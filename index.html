<style>
/* ============ THEMES ============ */
:root, [data-theme="dark"] {
  --bg: #0f1117;
  --bg-grad: radial-gradient(1200px 600px at 80% -10%, #1e2a4a55, transparent), radial-gradient(900px 500px at -10% 110%, #1a324055, transparent);
  --surface: #171a22;
  --surface-2: #1f232e;
  --border: #2c3140;
  --text: #eceef4;
  --text-2: #98a0b3;
  --accent: #4f7cff;
  --accent-2: #7c5cff;
  --accent-grad: linear-gradient(135deg, #4f7cff, #7c5cff);
  --accent-soft: #4f7cff22;
  --green: #2ee06e;
  --green-soft: #14532d40;
  --yellow: #f5c518;
  --yellow-soft: #713f1240;
  --red: #ff5c5c;
  --red-soft: #7f1d1d40;
  --shadow: 0 10px 30px rgba(0,0,0,.4);
  --shadow-sm: 0 3px 12px rgba(0,0,0,.25);
}
[data-theme="light"] {
  --bg: #eef1f6;
  --bg-grad: radial-gradient(1200px 600px at 80% -10%, #dbe6ff88, transparent), radial-gradient(900px 500px at -10% 110%, #e8ddff66, transparent);
  --surface: #ffffff;
  --surface-2: #f4f6fa;
  --border: #e2e6ee;
  --text: #101423;
  --text-2: #626b80;
  --accent: #3b63f3;
  --accent-2: #7c4dff;
  --accent-grad: linear-gradient(135deg, #3b63f3, #7c4dff);
  --accent-soft: #3b63f318;
  --green: #14a44d;
  --green-soft: #dcfce7;
  --yellow: #b8860b;
  --yellow-soft: #fef3c7;
  --red: #e11d48;
  --red-soft: #ffe4e6;
  --shadow: 0 10px 30px rgba(30,40,80,.10);
  --shadow-sm: 0 3px 12px rgba(30,40,80,.07);
}
[data-theme="ocean"] {
  --bg: #081826;
  --bg-grad: radial-gradient(1200px 600px at 80% -10%, #0e3a5a66, transparent), radial-gradient(900px 500px at -10% 110%, #06405566, transparent);
  --surface: #0e2438;
  --surface-2: #143049;
  --border: #1f4360;
  --text: #ddeefc;
  --text-2: #8fb4d1;
  --accent: #2ec5ff;
  --accent-2: #26e0c8;
  --accent-grad: linear-gradient(135deg, #2ec5ff, #26e0c8);
  --accent-soft: #2ec5ff22;
  --green: #34e3a1;
  --green-soft: #064e3b55;
  --yellow: #ffd166;
  --yellow-soft: #78350f55;
  --red: #ff7b7b;
  --red-soft: #7f1d1d55;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
  --shadow-sm: 0 3px 12px rgba(0,0,0,.3);
}
[data-theme="forest"] {
  --bg: #0c1710;
  --bg-grad: radial-gradient(1200px 600px at 80% -10%, #14432a55, transparent), radial-gradient(900px 500px at -10% 110%, #0f3d2555, transparent);
  --surface: #122117;
  --surface-2: #182b1f;
  --border: #27422f;
  --text: #e4f2e9;
  --text-2: #90b09d;
  --accent: #3ddc84;
  --accent-2: #a3e635;
  --accent-grad: linear-gradient(135deg, #3ddc84, #a3e635);
  --accent-soft: #3ddc8422;
  --green: #3ddc84;
  --green-soft: #14532d55;
  --yellow: #fbd34d;
  --yellow-soft: #713f1255;
  --red: #ff7b7b;
  --red-soft: #7f1d1d55;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
  --shadow-sm: 0 3px 12px rgba(0,0,0,.3);
}

[data-theme="sunset"] {
  --bg: #1a1010;
  --bg-grad: radial-gradient(1200px 600px at 80% -10%, #7c2d1266, transparent), radial-gradient(900px 500px at -10% 110%, #86198f44, transparent);
  --surface: #241417;
  --surface-2: #301b1e;
  --border: #4a2b2e;
  --text: #fdeee6;
  --text-2: #c99f92;
  --accent: #ff7849;
  --accent-2: #ffb020;
  --accent-grad: linear-gradient(135deg, #ff7849, #ffb020);
  --accent-soft: #ff784922;
  --green: #4ade80;
  --green-soft: #14532d55;
  --yellow: #ffb020;
  --yellow-soft: #78350f55;
  --red: #ff5c7c;
  --red-soft: #7f1d1d55;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
  --shadow-sm: 0 3px 12px rgba(0,0,0,.3);
}
[data-theme="rose"] {
  --bg: #fdf2f6;
  --bg-grad: radial-gradient(1200px 600px at 80% -10%, #fbcfe888, transparent), radial-gradient(900px 500px at -10% 110%, #e9d5ff77, transparent);
  --surface: #ffffff;
  --surface-2: #fdf4f8;
  --border: #f3d6e4;
  --text: #3b0a24;
  --text-2: #9d6b83;
  --accent: #ec4899;
  --accent-2: #a855f7;
  --accent-grad: linear-gradient(135deg, #ec4899, #a855f7);
  --accent-soft: #ec489918;
  --green: #14a44d;
  --green-soft: #dcfce7;
  --yellow: #b8860b;
  --yellow-soft: #fef3c7;
  --red: #e11d48;
  --red-soft: #ffe4e6;
  --shadow: 0 10px 30px rgba(120,30,80,.12);
  --shadow-sm: 0 3px 12px rgba(120,30,80,.08);
}
[data-theme="violet"] {
  --bg: #120f1e;
  --bg-grad: radial-gradient(1200px 600px at 80% -10%, #4c1d9555, transparent), radial-gradient(900px 500px at -10% 110%, #1e1b6455, transparent);
  --surface: #191430;
  --surface-2: #221b40;
  --border: #372c5e;
  --text: #ece9fb;
  --text-2: #a196c9;
  --accent: #a78bfa;
  --accent-2: #f472b6;
  --accent-grad: linear-gradient(135deg, #a78bfa, #f472b6);
  --accent-soft: #a78bfa22;
  --green: #34d399;
  --green-soft: #064e3b55;
  --yellow: #fbbf24;
  --yellow-soft: #78350f55;
  --red: #fb7185;
  --red-soft: #7f1d1d55;
  --shadow: 0 10px 30px rgba(0,0,0,.45);
  --shadow-sm: 0 3px 12px rgba(0,0,0,.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: "Inter", "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  color: var(--text);
  font-size: 15px;
  line-height: 1.5;
}
.hidden { display: none !important; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea {
  font-family: inherit; font-size: 14px;
  background: var(--surface-2); color: var(--text);
  border: 1.5px solid var(--border); border-radius: 10px;
  padding: 10px 12px; width: 100%; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
textarea { resize: vertical; min-height: 58px; line-height: 1.45; }
input:focus, select:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
label { font-size: 12.5px; color: var(--text-2); display: block; margin-bottom: 5px; font-weight: 600; }
.req { color: var(--red); }

/* ============ BUTTONS ============ */
.btn {
  border: 1.5px solid var(--border); background: var(--surface-2); color: var(--text);
  border-radius: 10px; padding: 9px 16px; font-size: 14px; font-weight: 700;
  transition: transform .1s, filter .15s, box-shadow .15s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.97); }
.btn-primary {
  background: var(--accent-grad); border: none; color: #fff;
  box-shadow: 0 4px 14px var(--accent-soft);
}
.btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn-danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn-block { width: 100%; }
.btn-sm { padding: 6px 12px; font-size: 12.5px; border-radius: 8px; }

/* ============ AUTH ============ */
.auth-screen {
  min-height: 100dvh; display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.auth-card {
  width: 100%; max-width: 440px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 22px; padding: 30px;
  box-shadow: var(--shadow);
  animation: rise .35s ease;
}
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; } }
.auth-logo { text-align: center; margin-bottom: 24px; }
.auth-logo-mark {
  width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 18px;
  background: var(--accent-grad); color: #fff; font-size: 32px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  box-shadow: 0 8px 24px var(--accent-soft);
}
.auth-logo-mark img { width: 100%; height: 100%; object-fit: cover; }
.auth-logo h1 { font-size: 22px; font-weight: 800; letter-spacing: -.3px; }
.auth-sub { color: var(--text-2); font-size: 13px; }
.auth-title { font-size: 16px; margin-bottom: 4px; font-weight: 700; }
.auth-hint { font-size: 13px; color: var(--text-2); margin-bottom: 14px; }
.auth-error { color: var(--red); font-size: 13px; min-height: 18px; margin: 6px 0; }
.auth-tabs { display: flex; gap: 6px; margin-bottom: 20px; background: var(--surface-2); border-radius: 12px; padding: 5px; }
.auth-tab {
  flex: 1; padding: 9px; border: none; background: transparent; color: var(--text-2);
  border-radius: 9px; font-size: 14px; font-weight: 700; transition: all .15s;
}
.auth-tab.active { background: var(--accent-grad); color: #fff; box-shadow: 0 3px 10px var(--accent-soft); }
.field { margin-bottom: 13px; }
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.phone-row { display: flex; gap: 8px; }
.cc-select { width: 118px; flex-shrink: 0; }
.pw-rules { list-style: none; margin: -4px 0 13px; font-size: 12px; color: var(--text-2); }
.pw-rules li { padding: 1.5px 0; transition: color .15s; }
.pw-rules li.ok { color: var(--green); }
.pw-rules li.bad { color: var(--red); }

/* ============ APP SHELL ============ */
.app-shell { display: flex; min-height: 100dvh; }
.sidebar {
  width: 240px; flex-shrink: 0; background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100dvh;
}
.sidebar-brand { display: flex; align-items: center; gap: 11px; padding: 20px 18px; }
.brand-mark {
  width: 40px; height: 40px; border-radius: 12px; background: var(--accent-grad);
  color: #fff; font-weight: 800; font-size: 20px;
  display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
  box-shadow: 0 4px 14px var(--accent-soft);
}
.brand-mark img { width: 100%; height: 100%; object-fit: cover; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-name { font-weight: 800; font-size: 16px; letter-spacing: -.3px; }
.brand-company { font-size: 11.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { flex: 1; padding: 8px 12px; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 10px 13px; border: none; background: transparent; color: var(--text-2);
  border-radius: 11px; font-size: 14px; font-weight: 600; margin-bottom: 3px; text-align: left;
  transition: all .13s;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active {
  background: var(--accent-soft); color: var(--accent); font-weight: 700;
  box-shadow: inset 3px 0 0 var(--accent);
}
.nav-item .ico { font-size: 16px; width: 20px; text-align: center; }
.sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }
.user-pill {
  display: flex; align-items: center; gap: 9px; width: 100%;
  background: var(--surface-2); border: 1.5px solid var(--border); border-radius: 12px;
  padding: 9px 11px; color: var(--text); text-align: left; transition: border-color .15s;
}
.user-pill:hover { border-color: var(--accent); }
.avatar {
  width: 34px; height: 34px; border-radius: 50%; background: var(--accent-grad);
  color: #fff; font-size: 12.5px; font-weight: 800; border: none;
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.avatar-btn { cursor: pointer; box-shadow: 0 3px 10px var(--accent-soft); transition: transform .1s; }
.avatar-btn:active { transform: scale(.94); }
.user-pill-text { display: flex; flex-direction: column; min-width: 0; }
.user-pill-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.user-pill-level { font-size: 11px; color: var(--text-2); }
.btn-signout { width: 100%; margin-top: 6px; font-size: 13px; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px; border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter: blur(10px);
  position: sticky; top: 0; z-index: 5;
}
.page-title { font-size: 19px; font-weight: 800; letter-spacing: -.3px; }
.topbar-actions { display: flex; align-items: center; gap: 10px; }
.page-container { padding: 22px 24px 96px; max-width: 1200px; width: 100%; margin: 0 auto; }

/* bottom bar (mobile) */
.bottombar {
  display: none; position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
}
.bottombar-inner { display: flex; }
.bb-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  border: none; background: transparent; color: var(--text-2);
  font-size: 10.5px; font-weight: 700; padding: 7px 2px; border-radius: 10px;
  transition: color .13s;
}
.bb-item .ico { font-size: 19px; }
.bb-item.active { color: var(--accent); }

@media (max-width: 860px) {
  .sidebar { display: none; }
  .bottombar { display: block; }
  .page-container { padding: 16px 14px 96px; }
  .topbar { padding: 12px 14px; }
}

/* ============ CARDS / GENERIC ============ */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 18px; padding: 20px; margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}
.card h3 { font-size: 15px; margin-bottom: 12px; font-weight: 700; }
.card-sub { font-size: 13px; color: var(--text-2); margin-bottom: 12px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr; } }
.placeholder-page { text-align: center; color: var(--text-2); padding: 70px 20px; }
.placeholder-page .big { font-size: 44px; margin-bottom: 12px; }

/* chips */
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent-soft); color: var(--accent);
  font-size: 12.5px; font-weight: 700; border-radius: 20px; padding: 5px 13px;
}
.chip button { border: none; background: transparent; color: inherit; font-size: 13px; padding: 0; }
.day-chip {
  border: 1.5px solid var(--border); background: var(--surface-2); color: var(--text-2);
  border-radius: 20px; padding: 7px 14px; font-size: 13px; font-weight: 700;
  transition: all .13s;
}
.day-chip.on { background: var(--accent-grad); border-color: transparent; color: #fff; box-shadow: 0 3px 10px var(--accent-soft); }

/* theme swatches */
.swatch-row { display: flex; gap: 12px; }
.swatch {
  width: 48px; height: 48px; border-radius: 14px; border: 2.5px solid var(--border); padding: 0;
  transition: transform .12s, border-color .15s;
}
.swatch:hover { transform: scale(1.07); }
.swatch.sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.sw-dark { background: linear-gradient(135deg, #0f1117 40%, #4f7cff); }
.sw-light { background: linear-gradient(135deg, #ffffff 40%, #3b63f3); }
.sw-ocean { background: linear-gradient(135deg, #0a3a5c 40%, #26e0c8); }
.sw-forest { background: linear-gradient(135deg, #14532d 40%, #a3e635); }
.sw-sunset { background: linear-gradient(135deg, #241417 40%, #ff7849); }
.sw-rose { background: linear-gradient(135deg, #fdf2f6 40%, #ec4899); }
.sw-violet { background: linear-gradient(135deg, #191430 40%, #a78bfa); }
.swatch-row { flex-wrap: wrap; }

/* member table */
.table-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.data th, table.data td { text-align: left; padding: 10px 11px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.data th { color: var(--text-2); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
.badge { font-size: 11.5px; font-weight: 800; border-radius: 20px; padding: 3px 11px; }
.badge-admin { background: var(--red-soft); color: var(--red); }
.badge-mgr { background: var(--yellow-soft); color: var(--yellow); }
.badge-member { background: var(--green-soft); color: var(--green); }
.badge-pending { background: var(--surface-2); color: var(--text-2); border: 1.5px dashed var(--border); }

/* ============ MODAL ============ */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(5,8,15,.6); z-index: 50;
  display: flex; align-items: center; justify-content: center; padding: 16px;
  backdrop-filter: blur(3px);
}
.modal {
  background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
  width: 100%; max-width: 480px; max-height: 92dvh; overflow-y: auto; padding: 22px;
  box-shadow: var(--shadow);
  animation: rise .22s ease;
}
.modal { position: relative; }
.modal h3 { font-size: 16px; margin-bottom: 14px; font-weight: 700; padding-right: 34px; }
.modal-x {
  position: absolute; top: 12px; right: 12px; z-index: 2;
  width: 30px; height: 30px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2);
  font-size: 13px; font-weight: 800; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background .13s, color .13s, transform .1s;
}
.modal-x:hover { background: var(--red-soft); color: var(--red); border-color: var(--red); }
.modal-x:active { transform: scale(.92); }
/* keep whatever sits at the top of the window clear of the ✕ */
.modal-x + div { padding-right: 40px; }
.modal-actions { display: flex; gap: 8px; margin-top: 18px; }
.modal-actions .btn { flex: 1; }

/* view card header block (mockup style) */
.view-head {
  border: 1px solid var(--border); border-radius: 14px;
  padding: 13px 15px; margin-bottom: 14px; background: var(--surface-2);
}
.view-head.tr-red { border-left: 4px solid var(--red); }
.view-head.tr-yellow { border-left: 4px solid var(--yellow); }
.view-head.tr-green { border-left: 4px solid var(--green); }
.view-head.tr-gray { border-left: 4px solid var(--border); }
.view-head .mini-bar { margin-top: 9px; }
.view-head .sub-inline { margin-top: 10px; }

/* account sheet */
.account-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.account-head .avatar { width: 46px; height: 46px; font-size: 16px; }
.account-name { font-weight: 800; font-size: 16px; }
.account-mail { font-size: 12.5px; color: var(--text-2); }

/* ============ TOAST ============ */
#toast-root { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); z-index: 99; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast {
  background: var(--surface); color: var(--text); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 11px 20px; font-size: 13.5px; font-weight: 700;
  box-shadow: var(--shadow); animation: toast-in .18s ease;
}
.toast.ok { border-color: var(--green); }
.toast.err { border-color: var(--red); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }

/* ============ TASKS ============ */
.task-row {
  display: flex; gap: 12px; align-items: center;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 13px 15px; margin-bottom: 9px;
  cursor: pointer; transition: transform .1s, border-color .15s;
  box-shadow: var(--shadow-sm);
}
.task-row:hover { border-color: var(--accent); transform: translateY(-1px); }
.tr-red { border-left: 4px solid var(--red); }
.tr-yellow { border-left: 4px solid var(--yellow); }
.tr-green { border-left: 4px solid var(--green); }

<script>
/* ============================================================
   db.js — data layer (stage 1: localStorage; stage 6: Supabase sync)
   ============================================================ */
"use strict";

const DB_KEY = "finops2_db";

const DEFAULT_CATEGORIES = [
  "Reporting", "Payments", "Compliance", "Budgeting",
  "Audit", "Tax", "Treasury", "HR finance", "Other"
];

const COUNTRY_CODES = [
  { code: "+20", label: "🇪🇬 +20 Egypt", digits: 10, example: "1012345678" },
  { code: "+966", label: "🇸🇦 +966 KSA", digits: 9, example: "512345678" },
  { code: "+971", label: "🇦🇪 +971 UAE", digits: 9, example: "501234567" },
  { code: "+965", label: "🇰🇼 +965 Kuwait", digits: 8, example: "51234567" },
  { code: "+974", label: "🇶🇦 +974 Qatar", digits: 8, example: "33123456" },
  { code: "+973", label: "🇧🇭 +973 Bahrain", digits: 8, example: "36123456" },
  { code: "+968", label: "🇴🇲 +968 Oman", digits: 8, example: "92123456" },
  { code: "+962", label: "🇯🇴 +962 Jordan", digits: 9, example: "791234567" },
  { code: "+1", label: "🇺🇸 +1 USA", digits: 10, example: "4155550123" },
  { code: "+44", label: "🇬🇧 +44 UK", digits: 10, example: "7912345678" }
];
function ccInfo(code) {
  return COUNTRY_CODES.find(c => c.code === code) || { code, digits: 10, example: "" };
}

// Levels: 3 = Admin, 2 = Manager, 1 = Member
const LEVEL_NAMES = { 3: "Admin", 2: "Manager", 1: "Member" };

let DB = null;

function freshDB() {
  return {
    version: 1,
    company: {
      name: "",
      logo: "",              // dataURL
      countryCode: "+20",
      domainRule: "",        // e.g. "npiceg.com" — empty = any domain
      workdays: [0, 1, 2, 3, 4], // JS getDay(): 0=Sun … 6=Sat. Default Sun–Thu.
      workStart: "08:30",    // working hours
      workEnd: "16:30",
      holidays: [],          // official holidays, "YYYY-MM-DD"
      captureAt: "09:00"     // daily indicator capture time
    },
    categories: [...DEFAULT_CATEGORIES],
    members: [],   // {email, firstName, lastName, jobTitle, cc, phone, level, passHash, salt, registered, createdAt}
    tasks: [],     // stage 2
    messages: [],  // stage 5
    waRules: [],   // stage 5
    indicators: [], // daily financial indicators history
    cfg: { theme: "dark", lang: "en" },
    session: null, // email of signed-in user
    nextId: 1,
    lastGenCheck: ""
  };
}

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    DB = raw ? JSON.parse(raw) : freshDB();
  } catch (e) {
    DB = freshDB();
  }
  // fill any missing keys after future upgrades
  const base = freshDB();
  for (const k of Object.keys(base)) if (DB[k] === undefined) DB[k] = base[k];
  for (const k of Object.keys(base.company)) if (DB.company[k] === undefined) DB.company[k] = base.company[k];
  migratePeriodCodes();
}

/* one-time migration: old period codes → MMM/YYYY format */
function migratePeriodCodes() {
  for (const t of DB.tasks || []) {
    if (!t.periodCode) continue;
    if (t.periodCode === "One-time" && t.month && t.year) { t.periodCode = t.month + "/" + t.year; continue; }
    t.periodCode = t.periodCode
      .replace(/\b([A-Z][a-z]{2})-(\d{2})\b/g, "$1/20$2")
      .replace(/\b(Q\d)-(\d{2})\b/g, "$1/20$2");
  }
}

function saveDB() {
  localStorage.setItem(DB_KEY, JSON.stringify(DB));
}

/* ---------- password hashing (SHA-256 + per-user salt) ---------- */
async function hashPassword(password, salt) {
  const data = new TextEncoder().encode(salt + "::" + password);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
function makeSalt() {
  const a = new Uint8Array(16);
  crypto.getRandomValues(a);
  return Array.from(a).map(b => b.toString(16).padStart(2, "0")).join("");
}

/* ---------- helpers ---------- */
function getMember(email) {
  if (!email) return null;
  return DB.members.find(m => m.email.toLowerCase() === email.toLowerCase()) || null;
}
function currentUser() { return getMember(DB.session); }
function fullName(m) { return m ? (m.firstName + " " + m.lastName).trim() : ""; }
function initials(m) {
  if (!m) return "?";
  return ((m.firstName[0] || "") + (m.lastName[0] || "")).toUpperCase() || m.email[0].toUpperCase();
}
function isAdmin(m) { return m && m.level === 3; }
function isManager(m) { return m && m.level >= 2; }

/* ---------- validation ---------- */
const PW_RULES = [
  { id: "len", label: "At least 8 characters", test: p => p.length >= 8 },
  { id: "cap", label: "One capital letter (A–Z)", test: p => /[A-Z]/.test(p) },
  { id: "num", label: "One number (0–9)", test: p => /[0-9]/.test(p) },
  { id: "spc", label: "One special character (!@#$…)", test: p => /[^A-Za-z0-9]/.test(p) }
];
function passwordOK(p) { return PW_RULES.every(r => r.test(p)); }

/* ---------- working hours helpers ---------- */
function hhmmToMin(s) {
  const m = String(s || "").match(/^(\d{1,2}):(\d{2})$/);
  return m ? (+m[1]) * 60 + (+m[2]) : null;
}
function nowMin() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function isWorkingNow() {
  const c = DB.company;
  const d = new Date();
  if (!c.workdays.includes(d.getDay())) return false;
  const s = hhmmToMin(c.workStart), e = hhmmToMin(c.workEnd);
  if (s === null || e === null) return true;
  const n = nowMin();
  return s <= e ? (n >= s && n <= e) : (n >= s || n <= e); // supports a shift crossing midnight
}
function workingHoursLabel() {
  const c = DB.company;
  return `${c.workStart}–${c.workEnd}`;
}
function emailOK(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function phoneOK(cc, p) {
  const n = ccInfo(cc).digits;
  return new RegExp("^\\d{" + n + "}$").test(p);
}
function phoneError(cc) {
  const i = ccInfo(cc);
  return `Mobile after ${i.code} must be exactly ${i.digits} digits (e.g. ${i.example}).`;
}
function domainOK(email) {
  const rule = (DB.company.domainRule || "").trim().toLowerCase();
  if (!rule) return true;
  return email.toLowerCase().endsWith("@" + rule);
}

</script>

"use strict";

function $(id) { return document.getElementById(id); }

function fillCountryCodes(sel, val, phoneInputId) {
  sel.innerHTML = COUNTRY_CODES.map(c =>
    `<option value="${c.code}" ${c.code === val ? "selected" : ""}>${c.label}</option>`).join("");
  if (phoneInputId) {
    const sync = () => {
      const i = ccInfo(sel.value);
      const inp = $(phoneInputId);
      inp.maxLength = i.digits;
      inp.placeholder = i.example;
    };
    sel.addEventListener("change", sync);
    sync();
  }
}

function renderPwRules(ulId, pass) {
  const ul = $(ulId);
  ul.innerHTML = PW_RULES.map(r => {
    const state = pass ? (r.test(pass) ? "ok" : "bad") : "";
    const mark = state === "ok" ? "✓" : state === "bad" ? "✗" : "•";
    return `<li class="${state}">${mark} ${r.label}</li>`;
  }).join("");
}

function showAuth() {
  $("app-shell").classList.add("hidden");
  $("auth-screen").classList.remove("hidden");
  const hasAdmin = DB.members.some(m => m.level === 3 && m.registered);
  $("auth-setup").classList.toggle("hidden", hasAdmin);
  $("auth-main").classList.toggle("hidden", !hasAdmin);
  $("auth-company-name").textContent = DB.company.name || "FinOps Manager";
  $("auth-sub").textContent = DB.company.name ? "Finance operations tracker" : "First time setup";
  if (DB.company.logo) $("auth-logo-mark").innerHTML = `<img src="${DB.company.logo}" alt="">`;
  fillCountryCodes($("su-cc"), DB.company.countryCode, "su-phone");
  fillCountryCodes($("rg-cc"), DB.company.countryCode, "rg-phone");
  renderPwRules("su-pw-rules", "");
  renderPwRules("rg-pw-rules", "");
}

/* ---------- first-run: create admin ---------- */
async function doSetupAdmin() {
  const err = $("su-error");
  err.textContent = "";
  const fn = $("su-fname").value.trim(), ln = $("su-lname").value.trim();
  const email = $("su-email").value.trim().toLowerCase();
  const job = $("su-job").value.trim();
  const cc = $("su-cc").value, phone = $("su-phone").value.trim();
  const p1 = $("su-pass").value, p2 = $("su-pass2").value;

  if (!fn || !ln) return err.textContent = "First and last name are required.";
  if (!emailOK(email)) return err.textContent = "Enter a valid email address.";
  if (!phoneOK(cc, phone)) return err.textContent = phoneError(cc);
  if (!passwordOK(p1)) return err.textContent = "Password does not meet all the rules.";
  if (p1 !== p2) return err.textContent = "Passwords do not match.";

  const salt = makeSalt();
  const passHash = await hashPassword(p1, salt);
  DB.members.push({
    email, firstName: fn, lastName: ln, jobTitle: job || "Finance manager",
    cc, phone, level: 3, passHash, salt, registered: true,
    createdAt: new Date().toISOString()
  });
  DB.session = email;
  saveDB();
  toast("Admin account created — welcome!", "ok");
  enterApp();
}

/* ---------- sign in ---------- */
async function doSignIn() {
  const err = $("si-error");
  err.textContent = "";
  const email = $("si-email").value.trim().toLowerCase();
  const pass = $("si-pass").value;
  const m = getMember(email);
  if (!m || !m.registered) return err.textContent = "Email or password is incorrect.";
  const h = await hashPassword(pass, m.salt);
  if (h !== m.passHash) return err.textContent = "Email or password is incorrect.";
  DB.session = m.email;
  saveDB();
  enterApp();
}

/* ---------- register step 1: email pre-check ---------- */
function doRegisterStep1() {
  const err = $("rg1-error");
  err.textContent = "";
  const email = $("rg-email").value.trim().toLowerCase();
  if (!emailOK(email)) return err.textContent = "Enter a valid email address.";
  const m = getMember(email);
  if (!m) return err.textContent = "This email is not registered. Contact your admin.";
  if (m.registered) return err.textContent = "This email already has an account — use Sign in.";
  $("rg-email-show").textContent = email;
  $("reg-step1").classList.add("hidden");
  $("reg-step2").classList.remove("hidden");
}

/* ---------- register step 2: details ---------- */
async function doRegisterStep2() {
  const err = $("rg2-error");
  err.textContent = "";
  const email = $("rg-email-show").textContent;
  const m = getMember(email);
  if (!m) return err.textContent = "Something went wrong — start again.";
  const fn = $("rg-fname").value.trim(), ln = $("rg-lname").value.trim();
  const job = $("rg-job").value.trim();
  const cc = $("rg-cc").value, phone = $("rg-phone").value.trim();
  const p1 = $("rg-pass").value, p2 = $("rg-pass2").value;

  if (!fn || !ln) return err.textContent = "First and last name are required.";
  if (!phoneOK(cc, phone)) return err.textContent = phoneError(cc);
  if (!passwordOK(p1)) return err.textContent = "Password does not meet all the rules.";
  if (p1 !== p2) return err.textContent = "Passwords do not match.";

  m.firstName = fn; m.lastName = ln; m.jobTitle = job;
  m.cc = cc; m.phone = phone;
  m.salt = makeSalt();
  m.passHash = await hashPassword(p1, m.salt);
  m.registered = true;
  DB.session = m.email;
  saveDB();
  toast("Account created — welcome!", "ok");
  enterApp();
}

function doSignOut() {
  DB.session = null;
  saveDB();
  showAuth();
}

function wireAuth() {
  $("su-btn").addEventListener("click", doSetupAdmin);
  $("su-pass").addEventListener("input", e => renderPwRules("su-pw-rules", e.target.value));
  $("si-btn").addEventListener("click", doSignIn);
  $("si-pass").addEventListener("keydown", e => { if (e.key === "Enter") doSignIn(); });
  $("rg1-btn").addEventListener("click", doRegisterStep1);
  $("rg2-btn").addEventListener("click", doRegisterStep2);
  $("rg-pass").addEventListener("input", e => renderPwRules("rg-pw-rules", e.target.value));
  $("tab-signin").addEventListener("click", () => switchAuthTab("signin"));
  $("tab-register").addEventListener("click", () => switchAuthTab("register"));
  $("signout-btn").addEventListener("click", doSignOut);
}

function switchAuthTab(which) {
  $("tab-signin").classList.toggle("active", which === "signin");
  $("tab-register").classList.toggle("active", which === "register");
  $("pane-signin").classList.toggle("hidden", which !== "signin");
  $("pane-register").classList.toggle("hidden", which !== "register");
  $("reg-step1").classList.remove("hidden");
  $("reg-step2").classList.add("hidden");
}

</script>
<script>
/* ============================================================
   settings.js — Settings page (admin only) + member management
   ============================================================ */
"use strict";

const WEEKDAYS = [
  { d: 0, label: "Sun" }, { d: 1, label: "Mon" }, { d: 2, label: "Tue" },
  { d: 3, label: "Wed" }, { d: 4, label: "Thu" }, { d: 5, label: "Fri" }, { d: 6, label: "Sat" }
];
const THEMES = [
  { id: "dark", label: "Dark" }, { id: "light", label: "Light" },
  { id: "ocean", label: "Ocean" }, { id: "forest", label: "Forest" },
  { id: "sunset", label: "Sunset" }, { id: "rose", label: "Rose" },
  { id: "violet", label: "Violet" }
];

function renderSettings(container) {
  const u = currentUser();
  if (!isAdmin(u)) {
    container.innerHTML = `<div class="placeholder-page"><div class="big">🔒</div><p>Settings is for the admin only.</p></div>`;
    return;
  }
  const c = DB.company;
  container.innerHTML = `
  <div class="grid-2">
    <div class="card">
      <h3>🏢 Company profile</h3>
      <div class="field"><label>Company name</label><input id="set-cname" value="${esc(c.name)}" placeholder="Your company"></div>
      <div class="field"><label>Logo</label>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="brand-mark" id="set-logo-preview">${c.logo ? `<img src="${c.logo}" alt="">` : "✓"}</span>
          <input type="file" id="set-logo-file" accept="image/*" style="width:auto;flex:1;">
        </div>
      </div>
      <div class="field"><label>Default country code</label><select id="set-cc"></select></div>
      <div class="field"><label>Email domain rule (empty = any email allowed)</label>
        <input id="set-domain" value="${esc(c.domainRule)}" placeholder="npiceg.com">
      </div>
    </div>

    <div class="card">
      <h3>📅 Working week</h3>
      <p class="card-sub">Tap the working days. Due dates falling on off-days shift to the next working day.</p>
      <div class="chip-row" id="set-workdays" style="margin-bottom:16px;"></div>

      <h3 style="margin-bottom:6px;">🕐 Working hours</h3>
      <p class="card-sub">Used for the daily indicator capture and to warn before sending reminders outside office hours.</p>
      <div class="form-grid-2">
        <div class="field"><label>Day starts</label><input type="time" id="set-workstart" value="${esc(c.workStart)}"></div>
        <div class="field"><label>Day ends</label><input type="time" id="set-workend" value="${esc(c.workEnd)}"></div>
      </div>
      <div class="field" style="margin-bottom:6px;">
        <label>Capture the 6 indicators at</label>
        <div style="display:flex;gap:8px;">
          <input type="time" id="set-captureat" value="${esc(c.captureAt)}" style="flex:1;">
          <button class="btn btn-sm" id="set-applysched">Apply to schedule</button>
        </div>
      </div>
      <p style="font-size:11.5px;color:var(--text-2);" id="set-sched-note">Currently scheduled for ${esc(c.captureAt)} every day.</p>

      <h3 style="margin:16px 0 6px;">🎌 Official holidays</h3>
      <p class="card-sub">Days the office is closed. On these days the NBE rate and the CBE rate carry the last working day's value instead of asking you to enter one.</p>
      <div style="display:flex;gap:8px;margin-bottom:10px;">
        <input type="date" id="set-holdate" style="flex:1;">
        <button class="btn btn-sm" id="set-holadd">Add</button>
      </div>
      <div class="chip-row" id="set-holidays"></div>
    </div>
  </div>

  <div class="grid-2">
    <div class="card">
      <h3>🏷️ Categories</h3>
      <div class="chip-row" id="set-cats" style="margin-bottom:12px;"></div>
      <div style="display:flex;gap:8px;">
        <input id="set-newcat" placeholder="New category name">
        <button class="btn btn-sm" id="set-addcat">Add</button>
      </div>
    </div>

    <div class="card">
      <h3>🎨 Appearance and language</h3>
      <p class="card-sub">Theme</p>
      <div class="swatch-row" id="set-themes" style="margin-bottom:16px;"></div>
      <p class="card-sub">Language</p>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-sm ${DB.cfg.lang === "en" ? "btn-primary" : ""}" id="set-lang-en">English</button>
        <button class="btn btn-sm ${DB.cfg.lang === "ar" ? "btn-primary" : ""}" id="set-lang-ar">العربية (stage 7)</button>
      </div>
    </div>
  </div>

  <div class="card" id="set-cloud-card">
    <h3>☁️ Cloud sync (phone + laptop)</h3>
    <p class="card-sub">Keeps this device and your phone showing the same tasks. Your data goes only to your own Supabase project.</p>
    <div id="set-cloud-body"><p class="card-sub">Loading…</p></div>
  </div>

  <div class="card" id="set-ai-card">
    <h3>✨ Email reading (AI)</h3>
    <p class="card-sub">Claude reads your Outlook inbox and proposes tasks. Nothing is ever added without your approval.</p>
    <div id="set-ai-body"><p class="card-sub">Loading…</p></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h3 style="margin:0;">👥 Team members</h3>
      <button class="btn btn-primary btn-sm" id="set-addmember">+ Add member</button>
    </div>
    <p class="card-sub">Add an email + level here — the person then registers themselves from their own device.</p>
    <div class="table-wrap">
      <table class="data">
        <thead><tr><th>Name</th><th>Email</th><th>Job title</th><th>Mobile</th><th>Level</th><th>Status</th><th></th></tr></thead>
        <tbody id="set-members"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h3>💾 Data</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-sm" id="set-backup">Download backup now</button>
      <button class="btn btn-sm" disabled title="Cloud sync arrives in stage 6">Sync: offline mode (stage 6)</button>
      <button class="btn btn-danger btn-sm" id="set-clear">Clear all data</button>
    </div>
  </div>`;

  // ---- wire company profile
  fillCountryCodes($("set-cc"), c.countryCode);
  $("set-cname").addEventListener("change", e => { c.name = e.target.value.trim(); saveDB(); applyBranding(); toast("Saved", "ok"); });
  $("set-cc").addEventListener("change", e => { c.countryCode = e.target.value; saveDB(); toast("Saved", "ok"); });
  $("set-domain").addEventListener("change", e => { c.domainRule = e.target.value.trim().replace(/^@/, ""); saveDB(); toast("Saved", "ok"); });
  $("set-logo-file").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      c.logo = rd.result; saveDB();
      $("set-logo-preview").innerHTML = `<img src="${c.logo}" alt="">`;
      applyBranding(); toast("Logo saved", "ok");
    };
    rd.readAsDataURL(f);
  });

  // ---- working hours
  $("set-workstart").addEventListener("change", e => {
    c.workStart = e.target.value || "08:30"; saveDB(); toast("Working hours saved", "ok");
  });
  $("set-workend").addEventListener("change", e => {
    c.workEnd = e.target.value || "16:30"; saveDB(); toast("Working hours saved", "ok");
  });
  $("set-captureat").addEventListener("change", e => {
    c.captureAt = e.target.value || "09:00"; saveDB();
    $("set-sched-note").textContent = `Saved. Press "Apply to schedule" so Windows captures at ${c.captureAt}.`;
  });
  $("set-applysched").addEventListener("click", async () => {
    const btn = $("set-applysched");
    btn.disabled = true; btn.textContent = "⏳ Applying…";
    try {
      const r = await fetch("api/schedule?time=" + encodeURIComponent(c.captureAt), { cache: "no-store" });
      const j = await r.json();
      if (j.ok) {
        $("set-sched-note").textContent = `Windows will capture the indicators at ${c.captureAt} every day.`;
        toast("Schedule updated to " + c.captureAt, "ok");
      } else {
        $("set-sched-note").textContent = "Could not update the schedule — run \"Setup daily 9AM capture.cmd\" once, then try again.";
        toast("Schedule not updated", "err");
      }
    } catch {
      $("set-sched-note").textContent = "The local server is not running, so the schedule could not be changed.";
      toast("Server not reachable", "err");
    }
    btn.disabled = false; btn.textContent = "Apply to schedule";
  });

  // ---- official holidays
  function renderHolidays() {
    const list = (c.holidays || []).slice().sort();
    $("set-holidays").innerHTML = list.length
      ? list.map(h => `<span class="chip">${esc(niceDate(h))} <button data-hol="${esc(h)}" title="Remove">✕</button></span>`).join("")
      : `<span style="font-size:12.5px;color:var(--text-2);">No holidays added yet.</span>`;
    $("set-holidays").querySelectorAll("[data-hol]").forEach(b => b.addEventListener("click", () => {
      c.holidays = (c.holidays || []).filter(x => x !== b.dataset.hol);
      saveDB(); renderHolidays(); toast("Holiday removed", "ok");
    }));
  }
  renderHolidays();
  $("set-holadd").addEventListener("click", () => {
    const v = $("set-holdate").value;
    if (!v) return toast("Pick a date first", "err");
    c.holidays = c.holidays || [];
    if (c.holidays.includes(v)) return toast("That day is already listed", "err");
    c.holidays.push(v);
    saveDB(); $("set-holdate").value = ""; renderHolidays();
    toast("Holiday added", "ok");
  });

  // ---- working week
  const wd = $("set-workdays");
  wd.innerHTML = WEEKDAYS.map(w =>
    `<button class="day-chip ${c.workdays.includes(w.d) ? "on" : ""}" data-d="${w.d}">${w.label}</button>`).join("");
  wd.querySelectorAll(".day-chip").forEach(b => b.addEventListener("click", () => {
    const d = +b.dataset.d;
    if (c.workdays.includes(d)) {
      if (c.workdays.length === 1) return toast("At least one working day is required", "err");
      c.workdays = c.workdays.filter(x => x !== d);
    } else c.workdays.push(d);
    c.workdays.sort();
    saveDB(); renderSettings(container);
  }));

  // ---- categories
  renderCatChips();
  $("set-addcat").addEventListener("click", addCategory);
  $("set-newcat").addEventListener("keydown", e => { if (e.key === "Enter") addCategory(); });

  function renderCatChips() {
    $("set-cats").innerHTML = DB.categories.map(cat =>
      `<span class="chip" style="${catChipStyle(cat)}">${esc(cat)} <button data-cat="${esc(cat)}" title="Remove">✕</button></span>`).join("");
    $("set-cats").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
      const cat = b.dataset.cat;
      const used = DB.tasks.some(t => t.category === cat);
      if (used) return toast("Tasks use this category — reassign them first", "err");
      if (DB.categories.length === 1) return toast("Keep at least one category", "err");
      DB.categories = DB.categories.filter(x => x !== cat);
      saveDB(); renderCatChips();
    }));
  }
  function addCategory() {
    const v = $("set-newcat").value.trim();
    if (!v) return;
    if (DB.categories.some(x => x.toLowerCase() === v.toLowerCase())) return toast("Category already exists", "err");
    DB.categories.push(v); saveDB();
    $("set-newcat").value = "";
    renderCatChips(); toast("Category added", "ok");
  }

  // ---- themes
  const tRow = $("set-themes");
  tRow.innerHTML = THEMES.map(t =>
    `<button class="swatch sw-${t.id} ${DB.cfg.theme === t.id ? "sel" : ""}" data-t="${t.id}" title="${t.label}"></button>`).join("");
  tRow.querySelectorAll(".swatch").forEach(b => b.addEventListener("click", () => {
    DB.cfg.theme = b.dataset.t; saveDB(); applyTheme();
    tRow.querySelectorAll(".swatch").forEach(x => x.classList.toggle("sel", x === b));
  }));
  $("set-lang-en").addEventListener("click", () => toast("English is active", "ok"));
  $("set-lang-ar").addEventListener("click", () => toast("Arabic arrives in stage 7", "err"));

  // ---- cloud + AI panels
  renderCloudSection();
  renderAISection();

  // ---- members
  renderMemberRows();
  $("set-addmember").addEventListener("click", openAddMemberModal);

  function renderMemberRows() {
    const rows = DB.members.map(m => {
      const lvlClass = m.level === 3 ? "badge-admin" : m.level === 2 ? "badge-mgr" : "badge-member";
      const self = u.email === m.email;
      return `<tr>
        <td>${m.registered ? esc(fullName(m)) : "<i style='color:var(--text-2)'>—</i>"}</td>
        <td>${esc(m.email)}</td>
        <td>${esc(m.jobTitle || "—")}</td>
        <td>${m.phone ? esc(m.cc + " " + m.phone) : "—"}</td>
        <td><span class="badge ${lvlClass}">L${m.level} · ${LEVEL_NAMES[m.level]}</span></td>
        <td>${m.registered ? "Registered" : `<span class="badge badge-pending">Invited</span>`}</td>
        <td style="text-align:right;">
          ${self ? "" : `<button class="btn btn-ghost btn-sm" data-act="level" data-e="${esc(m.email)}">Level</button>
          <button class="btn btn-ghost btn-sm" data-act="del" data-e="${esc(m.email)}" style="color:var(--red)">✕</button>`}
        </td>
      </tr>`;
    }).join("");
    $("set-members").innerHTML = rows || `<tr><td colspan="7" style="color:var(--text-2)">No members yet</td></tr>`;
    $("set-members").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
      const email = b.dataset.e;
      if (b.dataset.act === "level") openLevelModal(email, renderMemberRows);
      if (b.dataset.act === "del") {
        const m = getMember(email);
        openConfirm(`Remove ${m.registered ? fullName(m) : email}? Their task history is kept.`, () => {
          DB.members = DB.members.filter(x => x.email !== email);
          saveDB(); renderMemberRows(); toast("Member removed", "ok");
        });
      }
    }));
  }

  // ---- data buttons
  $("set-backup").addEventListener("click", downloadBackup);
  $("set-clear").addEventListener("click", () => {
    openConfirm("Clear ALL data? A backup will download first.", () => {
      downloadBackup();
      openConfirm("Really sure? This deletes everything on this device.", () => {
        localStorage.removeItem(DB_KEY);
        location.reload();
      });
    });
  });
}

/* ============================================================
   Cloud panel — connect this device to the Supabase project
   ============================================================ */
function renderCloudSection() {
  const box = $("set-cloud-body");
  if (!box) return;

  const connected = cloudReady();
  const last = CLOUD.lastSync
    ? new Date(CLOUD.lastSync).toLocaleString()
    : "never";

  if (connected) {
    box.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
        <span class="badge badge-member">✓ Connected</span>
        <span style="color:var(--text-2);font-size:12.5px;">${esc(CLOUD.email)}</span>
      </div>
      <table class="data" style="font-size:12.5px;">
        <tr><td>Last sync</td><td style="text-align:right;">${esc(last)}</td></tr>
        <tr><td>This device</td><td style="text-align:right;">${esc(CLOUD.deviceId)}</td></tr>
        ${CLOUD.lastError ? `<tr><td style="color:var(--red);">Last error</td><td style="text-align:right;color:var(--red);">${esc(CLOUD.lastError)}</td></tr>` : ""}
      </table>
      <label style="display:flex;align-items:center;gap:8px;margin:12px 0;font-size:13px;">
        <input type="checkbox" id="cl-auto" ${CLOUD.autoSync ? "checked" : ""} style="width:auto;">
        Sync automatically (on open, on reconnect, every 5 minutes)
      </label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm" id="cl-sync">⟳ Sync now</button>
        <button class="btn btn-sm" id="cl-out">Disconnect this device</button>
      </div>`;

    $("cl-auto").addEventListener("change", e => {
      CLOUD.autoSync = e.target.checked; saveCloud();
      if (CLOUD.autoSync) startCloudAuto();
      toast(CLOUD.autoSync ? "Automatic sync on" : "Automatic sync off", "ok");
    });
    $("cl-sync").addEventListener("click", async () => {
      const b = $("cl-sync"); b.disabled = true; b.textContent = "Syncing…";
      await cloudSync(false);
      renderCloudSection();
      route("settings");
    });
    $("cl-out").addEventListener("click", () => {
      openConfirm("Disconnect this device? Your tasks stay on it, they just stop syncing.", () => {
        cloudSignOut(); toast("Disconnected", "ok"); route("settings");
      });
    });
    return;
  }

  // not connected yet
  box.innerHTML = `
    <div style="margin-bottom:10px;">
      <span class="badge badge-pending">Not connected</span>
      <span style="color:var(--text-2);font-size:12.5px;margin-left:8px;">this device keeps its data to itself</span>
    </div>
    <div class="field"><label>Project URL</label>
      <input id="cl-url" value="${esc(CLOUD.url)}" placeholder="https://xxxxxxxx.supabase.co"></div>
    <div class="field"><label>Anon public key</label>
      <input id="cl-key" value="${esc(CLOUD.anonKey)}" placeholder="eyJhbGciOi..."></div>
    <div class="form-grid-2">
      <div class="field"><label>Your email</label>
        <input id="cl-email" type="email" value="${esc(CLOUD.email)}" autocomplete="email"></div>
      <div class="field"><label>Your cloud password</label>

/* approximate list prices, US$ per 1M tokens — used only for the estimate */
const AI_MODELS = [
  { id: "claude-opus-5",        name: "Opus 5 — best judgement",   in: 15, out: 75 },
  { id: "claude-sonnet-5",      name: "Sonnet 5 — balanced",       in: 3,  out: 15 },

function aiCost(model, inTok, outTok) {
  const m = AI_MODELS.find(x => x.id === model) || AI_MODELS[0];
  return (inTok / 1e6) * m.in + (outTok / 1e6) * m.out;
}

    <p class="card-sub">Runs quietly in the background whenever you are logged in, so proposals are already waiting for you.

      <tr><td>Proposals waiting</td><td style="text-align:right;">${s.proposals}</td></tr>
      <tr><td>Tokens this month</td><td style="text-align:right;">${s.inMonth.toLocaleString()} in · ${s.outMonth.toLocaleString()} out</td></tr>
      <tr><td><b>Estimated cost this month</b></td><td style="text-align:right;"><b>$${costMon.toFixed(2)}</b></td></tr>

  $("ai-save").addEventListener("click", async () => {

</script>
<script>
/* ============================================================
   tasks.js — stage 2: task model, date engine, recurrence
   generation, permissions, validation, task cards
   ============================================================ */
"use strict";

/* ================= TASK KINDS ================= */
/* "regular" = normal finance work; the rest are quick actions that live in
   their own dashboard panel and are measured separately. */
const TASK_KINDS = [
  { id: "regular", label: "Regular work", ico: "📄", quick: false },
  { id: "call",    label: "Call",         ico: "📞", quick: true },
  { id: "message", label: "Message",      ico: "💬", quick: true },
  { id: "email",   label: "Email",        ico: "✉️", quick: true },
  { id: "meeting", label: "Meeting",      ico: "🤝", quick: true }
];
function kindDef(id) { return TASK_KINDS.find(k => k.id === id) || TASK_KINDS[0]; }
function isQuick(t) { return kindDef(t.kind).quick; }

/* ================= DATE HELPERS (all dates = "YYYY-MM-DD") ================= */
function todayStr() { return fmtD(new Date()); }
function fmtD(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function parseD(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = parseD(s); d.setDate(d.getDate() + n); return fmtD(d); }
function isWorkdayD(d) { return DB.company.workdays.includes(d.getDay()); }
function shiftFwdWork(s) { let d = parseD(s); while (!isWorkdayD(d)) d.setDate(d.getDate() + 1); return fmtD(d); }
function shiftBackWork(s) { let d = parseD(s); while (!isWorkdayD(d)) d.setDate(d.getDate() - 1); return fmtD(d); }
function niceDate(s) {
  if (!s) return "—";
  const d = parseD(s);
  return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
}
function shortDate(s) {
  if (!s) return "—";
  return parseD(s).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
}
/* calendar day difference: due - today (negative = overdue) */
function daysToDue(due) {
  return Math.round((parseD(due) - parseD(todayStr())) / 86400000);
}
/* count working days strictly after `from` up to and including `to` */
function workdaysBetween(from, to) {
  let n = 0, d = parseD(from), end = parseD(to);
  while (d < end) { d.setDate(d.getDate() + 1); if (isWorkdayD(d)) n++; }
  return n;
}
function clampDay(year, monthIdx, day) {
  const last = new Date(year, monthIdx + 1, 0).getDate();
  return new Date(year, monthIdx, Math.min(day, last));
}
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ================= PERIODS ================= */
/* current period + due date for a recurrence rule, relative to today */
function currentPeriod(repeats, rule) {
  const now = parseD(todayStr());
  const y = now.getFullYear(), m = now.getMonth();
  if (repeats === "daily") {
    if (!isWorkdayD(now)) return null;
    const ds = todayStr();
    return { code: ds, due: ds, year: y, month: MONTHS[m] };
  }
  if (repeats === "weekly") {
    // week anchored on chosen weekday; period = that week's occurrence
    const wd = rule.weekday ?? DB.company.workdays[0];
    const d = new Date(now);
    const diff = (wd - d.getDay() + 7) % 7;
    d.setDate(d.getDate() + diff);
    // if this week's occurrence already passed (diff computed forward), also allow the one that passed this week:
    const back = new Date(now); back.setDate(back.getDate() - ((back.getDay() - wd + 7) % 7));
    const occ = back <= now ? back : d;
    const due = shiftFwdWork(fmtD(occ));
    return { code: "W" + fmtD(occ), due, year: occ.getFullYear(), month: MONTHS[occ.getMonth()] };
  }
  if (repeats === "monthly") {
    const due = shiftFwdWork(fmtD(clampDay(y, m, rule.dayOfMonth || 1)));
    return { code: MONTHS[m] + "/" + y, due, year: y, month: MONTHS[m] };
  }
  if (repeats === "quarterly") {
    // due in month after quarter end: Apr(Q1) Jul(Q2) Oct(Q3) Jan(Q4)
    // current cycle = the most recent due-month at or before now, else upcoming
    const dueMonths = [3, 6, 9, 0]; // Apr Jul Oct Jan (0-based) — Jan belongs to previous year's Q4
    let best = null;
    for (let yy = y - 1; yy <= y; yy++) {
      for (let qi = 0; qi < 4; qi++) {
        const dm = dueMonths[qi];
        const dueY = qi === 3 ? yy + 1 : yy;
        const due = shiftFwdWork(fmtD(clampDay(dueY, dm, rule.dayOfMonth || 1)));
        const start = new Date(dueY, dm, 1);
        if (start <= now && (!best || start > best.start)) {
          best = { start, code: "Q" + (qi + 1) + "/" + yy, due, year: dueY, month: MONTHS[dm] };
        }
      }
    }
    if (!best) return null;
    return { code: best.code, due: best.due, year: best.year, month: best.month };
  }
  if (repeats === "annual") {
    const mm = (rule.month ?? 1) - 1;
    const due = shiftFwdWork(fmtD(clampDay(y, mm, rule.day || 1)));
    return { code: String(y), due, year: y, month: MONTHS[mm] };
  }
  return null;
}

/* upcoming window (working days before due when the task becomes "ongoing") */
function upcomingWindow(repeats) {
  if (repeats === "quarterly") return 5;
  if (repeats === "annual") return 10;
  if (repeats === "daily" || repeats === "weekly") return 0;
  return 3; // monthly, once, withmain
}

/* ================= TASK STATE ================= */
/* traffic light: returns {cls: 'green'|'yellow'|'red'|'gray', label, days} */
function taskState(t) {
  if (t.status === "done") {
    const r = t.result || "On time";
    return { cls: "green", label: "Done · " + r.toLowerCase(), days: 0 };
  }
  const dd = daysToDue(t.dueDate);
  if (dd < 0) return { cls: "red", label: Math.abs(dd) + (Math.abs(dd) === 1 ? " day" : " days") + " overdue", days: dd };
  if (dd === 0) return { cls: "yellow", label: "Due today", days: 0 };
  const w = workdaysBetween(todayStr(), t.dueDate);
  const win = upcomingWindow(t.repeats);
  const label = "Due in " + w + (w === 1 ? " working day" : " working days");
  return { cls: w <= win ? "yellow" : "gray", label, days: dd };
}
function isOverdue(t) { return t.status !== "done" && daysToDue(t.dueDate) < 0; }
function computeResult(t) {
  const diff = Math.round((parseD(t.completedAt.slice(0, 10)) - parseD(t.dueDate)) / 86400000);
  return diff < 0 ? "Early" : diff === 0 ? "On time" : "Late";
}

/* ================= PERMISSIONS ================= */
function canSeeTask(u, t) {
  return isAdmin(u) || t.responsible === u.email || t.assignedBy === u.email;
}
function canEditFull(u, t) { return isAdmin(u) || t.assignedBy === u.email; }
function canEditStatus(u, t) { return canEditFull(u, t) || t.responsible === u.email; }
function assignableMembers(u) {
  // stage 2: admin/manager assign to anyone; member assigns to self
  if (isManager(u)) return DB.members.filter(m => m.registered);
  return DB.members.filter(m => m.email === u.email);
}

/* ================= HELPERS ================= */
function newId() { return DB.nextId++; }
function getTask(id) { return DB.tasks.find(t => t.id === id) || null; }
function subsOf(inst) { return DB.tasks.filter(t => t.type === "sub" && !t.template && t.parentId === inst.id); }
function subTemplatesOf(tpl) { return DB.tasks.filter(t => t.type === "sub" && t.template && t.parentId === tpl.id); }
function memberName(email) { const m = getMember(email); return m ? fullName(m) : email || "—"; }
function priBadge(p) {
  if (p === "urgent") return `<span class="pill pill-red">Urgent</span>`;
  if (p === "high") return `<span class="pill pill-yellow">High</span>`;
  return `<span class="pill pill-gray">Normal</span>`;
}
function repeatsLabel(t) {
  const r = t.repeats;
  if (r === "once") return "One-time";
  if (r === "daily") return "Daily";
  if (r === "weekly") return "Weekly · " + (["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][t.rule.weekday ?? 0]);
  if (r === "monthly") return "Monthly · day " + (t.rule.dayOfMonth || 1);
  if (r === "quarterly") return "Quarterly · day " + (t.rule.dayOfMonth || 1);
  if (r === "annual") return "Annual · " + shortDate(fmtD(clampDay(2026, (t.rule.month ?? 1) - 1, t.rule.day || 1)));
  return r;
}
/* real frequency of a sub (never "with main") */
function subFrequency(sub, parent) {
  return sub.repeats === "withmain" ? (parent ? parent.repeats : "once") : sub.repeats;
}

/* ================= GENERATION ENGINE ================= */
function runAutoGen() {
  const today = todayStr();
  if (DB.lastGenCheck === today) return;

  // Phase 1: main templates → current period instance
  for (const tpl of DB.tasks.filter(t => t.template && t.type === "main")) {
    const p = currentPeriod(tpl.repeats, tpl.rule);
    if (!p) continue;
    const exists = DB.tasks.some(t => !t.template && t.sourceId === tpl.id && t.periodCode === p.code);
    if (exists) continue;
    const inst = makeInstanceFromTemplate(tpl, p);
    DB.tasks.push(inst);
    // withmain subs generated with the parent
    for (const st of subTemplatesOf(tpl)) {
      if (st.repeats !== "withmain") continue;
      DB.tasks.push(makeSubInstance(st, inst, subDueWithMain(st, inst), p.code + "·main"));
    }
  }

  // Phase 2: faster sub templates → their own cycle inside the parent period
  for (const st of DB.tasks.filter(t => t.template && t.type === "sub" && t.repeats !== "withmain" && t.repeats !== "once")) {
    const parentTpl = getTask(st.parentId);
    // parent may be a template (recurring main) or a live once-instance
    let parentInst = null;
    if (parentTpl && parentTpl.template) {
      const p = currentPeriod(parentTpl.repeats, parentTpl.rule);
      if (!p) continue;
      parentInst = DB.tasks.find(t => !t.template && t.sourceId === parentTpl.id && t.periodCode === p.code);
    } else if (parentTpl && !parentTpl.template) {
      parentInst = parentTpl; // once main
    }
    if (!parentInst || parentInst.status === "done") continue;
    const sp = currentPeriod(st.repeats, st.rule);
    if (!sp) continue;
    let due = sp.due;
    if (due > parentInst.dueDate) continue; // capped at parent due
    const code = parentInst.periodCode + "·" + sp.code;
    const exists = DB.tasks.some(t => !t.template && t.sourceId === st.id && t.periodCode === code);
    if (!exists) DB.tasks.push(makeSubInstance(st, parentInst, due, code));
  }

  DB.lastGenCheck = today;
  saveDB();
}

function subDueWithMain(st, inst) {
  let due = addDays(inst.dueDate, -(st.offsetDays || 0));
  due = shiftBackWork(due);
  if (due > inst.dueDate) due = inst.dueDate;
  return due;
}

function makeInstanceFromTemplate(tpl, p) {
  return {
    id: newId(), type: "main", template: false, parentId: null,
    title: tpl.title, description: tpl.description, category: tpl.category,
    kind: tpl.kind || "regular",
    priority: tpl.priority, taskType: "recurring", repeats: tpl.repeats,
    rule: { ...tpl.rule }, dueDate: p.due,
    responsible: tpl.responsible, assignedBy: tpl.assignedBy,
    status: "todo", delayNote: "", linked: [...(tpl.linked || [])],
    sourceId: tpl.id, periodCode: p.code, year: p.year, month: p.month,
    archived: false, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
    completedAt: null, result: null
  };
}
function makeSubInstance(st, parentInst, due, code) {
  const p = { year: parseD(due).getFullYear(), month: MONTHS[parseD(due).getMonth()] };
  return {
    id: newId(), type: "sub", template: false, parentId: parentInst.id,
    title: st.title, description: st.description, category: parentInst.category,
    kind: st.kind || parentInst.kind || "regular",
    priority: st.priority || "normal", taskType: parentInst.taskType, repeats: st.repeats,
    rule: { ...st.rule }, dueDate: due,
    responsible: st.responsible, assignedBy: st.assignedBy,
    status: "todo", delayNote: "", linked: [],
    sourceId: st.id, periodCode: code, year: p.year, month: p.month,
    archived: false, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
    completedAt: null, result: null
  };
}

/* ================= STATUS / VALIDATION ================= */
/* set status with mandatory-delay-note rule; returns error string or null */
function trySetStatus(t, status, delayNote) {
  if (status !== "done" && isOverdue(t)) {
    if (!String(delayNote || t.delayNote || "").trim())
      return "This task is overdue — a delay explanation is required.";
  }
  if (delayNote !== undefined) t.delayNote = delayNote;
  t.status = status;
  if (status === "done") {
    t.completedAt = new Date().toISOString();
    t.result = computeResult(t);
    t.archived = true;
    // archive its subs' view is driven by parent; subs archive individually on done
  } else {
    t.completedAt = null; t.result = null; t.archived = false;
  }
  t.updatedAt = new Date().toISOString();
  saveDB();
  return null;
}

/* ================= TASKS PAGE (full — stage 3) ================= */
let TF = { q: "", status: "all", cat: "all", type: "all", member: "all", kind: "all", expanded: {} };

function visibleTasks(archived) {
  const u = currentUser();
  let list = DB.tasks.filter(t => !t.template && t.type === "main" && !!t.archived === archived && canSeeTask(u, t));
  if (TF.q) {
    const q = TF.q.toLowerCase();
    list = list.filter(t => t.title.toLowerCase().includes(q) || (t.description || "").toLowerCase().includes(q)
      || subsOf(t).some(s => s.title.toLowerCase().includes(q)));
  }
  if (TF.status !== "all") list = list.filter(t => t.status === TF.status);
  if (TF.cat !== "all") list = list.filter(t => t.category === TF.cat);
  if (TF.type !== "all") list = list.filter(t => TF.type === "recurring" ? t.taskType === "recurring" : t.taskType === "once");
  if (TF.kind === "quick") list = list.filter(isQuick);
  else if (TF.kind === "regular") list = list.filter(t => !isQuick(t));
  else if (TF.kind !== "all") list = list.filter(t => (t.kind || "regular") === TF.kind);
  if (TF.member !== "all") list = list.filter(t => t.responsible === TF.member || subsOf(t).some(s => s.responsible === TF.member));
  return list.sort((a, b) => {
    const order = { red: 0, yellow: 1, gray: 2, green: 3 };
    const sa = taskState(a), sb = taskState(b);
    if (order[sa.cls] !== order[sb.cls]) return order[sa.cls] - order[sb.cls];
    const pri = { urgent: 0, high: 1, normal: 2 };
    if (pri[a.priority] !== pri[b.priority]) return pri[a.priority] - pri[b.priority];
    return a.dueDate < b.dueDate ? -1 : 1;
  });
}

function nameOrMe(email) {

function subStatusText(s) {
  if (s.status === "done") {
    const diff = Math.round((parseD(s.completedAt.slice(0, 10)) - parseD(s.dueDate)) / 86400000);
    const tag = diff < 0 ? `(${Math.abs(diff)} day${Math.abs(diff) > 1 ? "s" : ""} early)` : diff === 0 ? "(on time)" : `(${diff} day${diff > 1 ? "s" : ""} late)`;
    return `done ${shortDate(s.completedAt.slice(0, 10))} <span class="st-${diff > 0 ? "red" : "green"}">${tag}</span>`;
  }
  const dd = daysToDue(s.dueDate);
  if (dd < 0) return `<span class="st-red">${Math.abs(dd)} day${Math.abs(dd) > 1 ? "s" : ""} overdue</span>`;
  if (dd === 0) return `<span class="st-yellow">due today</span>`;
  return `due ${shortDate(s.dueDate)}`;
}
function linkedTitles(t) {

function confirmDeleteTask(t) {
  const isRecInst = !t.template && t.taskType === "recurring" && t.sourceId;
  closeModal();
  if (t.type === "main" && isRecInst) {
    openModal(`
      <h3>Delete recurring task</h3>
      <p style="font-size:14px;color:var(--text-2);">"${esc(t.title)}" repeats automatically. What do you want to delete?</p>
      <div class="modal-actions" style="flex-direction:column;">
        <button class="btn" id="dl-period">Delete this period only (${esc(t.periodCode)})</button>
        <button class="btn btn-danger" id="dl-all">Stop the recurring task completely</button>
        <button class="btn btn-ghost" id="dl-cancel">Cancel</button>
      </div>`);
    $("dl-cancel").addEventListener("click", closeModal);
    $("dl-period").addEventListener("click", () => {
      deleteInstance(t); closeModal(); refreshCurrentPage(); toast("Period deleted", "ok");
    });
    $("dl-all").addEventListener("click", () => {
      deleteInstance(t);
      const tpl = getTask(t.sourceId);
      if (tpl) {
        for (const st of subTemplatesOf(tpl)) DB.tasks = DB.tasks.filter(x => x.id !== st.id);
        DB.tasks = DB.tasks.filter(x => x.id !== tpl.id);
      }
      saveDB(); closeModal(); refreshCurrentPage(); toast("Recurring task stopped", "ok");
    });
  } else {
    openConfirm(`Delete "${t.title}"? Archived history of other periods is kept.`, () => {
      deleteInstance(t); refreshCurrentPage(); toast("Deleted", "ok");
    });
  }
}
function deleteInstance(t) {
  if (t.type === "main") {
    for (const s of subsOf(t)) DB.tasks = DB.tasks.filter(x => x.id !== s.id);
    // once-main may own sub templates
    for (const st of DB.tasks.filter(x => x.template && x.type === "sub" && x.parentId === t.id))
      DB.tasks = DB.tasks.filter(x => x.id !== st.id);
  }
  DB.tasks = DB.tasks.filter(x => x.id !== t.id);
  saveDB();
}

/* ================= EDIT / CREATE CARD ================= */
let EDIT_SUBS = []; // working copy of subtask rows in the edit form

/* subtask may repeat at the same speed as the parent or faster — never slower */
function subRepeatOptions(parentRepeats) {
  switch (parentRepeats) {
    case "daily": return ["withmain", "daily"];
    case "weekly": return ["withmain", "daily", "weekly"];
    case "monthly": return ["withmain", "daily", "weekly", "monthly"];
    case "quarterly": return ["withmain", "daily", "weekly", "monthly", "quarterly"];
    case "annual": return ["withmain", "daily", "weekly", "monthly", "quarterly", "annual"];
    default: return ["once", "daily", "weekly", "monthly", "quarterly", "annual"]; // one-time parent
  }
}
const SUB_REPEAT_LABELS = { withmain: "With main task", once: "One-time", daily: "Daily", weekly: "Weekly", monthly: "Monthly", quarterly: "Quarterly", annual: "Annual" };

/* ---------- dedicated subtask edit card (no nested subtasks) ---------- */
function openSubEdit(id) {
  const u = currentUser();

  if (!s) return;

  const showDue = s.repeats === "withmain" || s.repeats === "once";
  openModal(`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">

      html = `<div class="field"><label>Day of month</label><select id="se-dom">
        ${Array.from({ length: 31 }, (_, x) => x + 1).map(d => `<option value="${d}" ${ruleState.dayOfMonth === d ? "selected" : ""}>${d}</option>`).join("")}</select></div>`;
    } else if (rep === "annual") {

        <div class="field"><label>Day</label><select id="se-day">

  $("se-save").addEventListener("click", () => {
    const err = $("se-err");
    err.textContent = "";
    const title = $("se-title").value.trim();
    if (!title) return err.textContent = "Subtask title is required.";
    const rep = $("se-rep").value;
    let due = s.dueDate, rule = {};
    if (rep === "withmain" || rep === "once") {
      due = $("se-due").value;
      if (!due) return err.textContent = "Due date is required.";
      if (parent && due > parent.dueDate) return err.textContent = `Due date must be on or before the main task (${niceDate(parent.dueDate)}).`;
    } else if (rep === "weekly") rule = { weekday: +$("se-weekday").value };
    else if (rep === "monthly" || rep === "quarterly") rule = { dayOfMonth: +$("se-dom").value };
    else if (rep === "annual") rule = { month: +$("se-month").value, day: +$("se-day").value };
    s.title = title;
    s.description = $("se-desc").value.trim();
    s.responsible = $("se-resp").value;
    s.repeats = rep;
    s.rule = rule;
    if (rep === "withmain" || rep === "once") s.dueDate = due;
    s.updatedAt = new Date().toISOString();
    const stpl = s.sourceId ? getTask(s.sourceId) : null;
    if (stpl) {
      stpl.title = title; stpl.description = s.description; stpl.responsible = s.responsible;
      stpl.repeats = rep; stpl.rule = { ...rule };
      if (rep === "withmain" && parent && parent.dueDate)
        stpl.offsetDays = Math.max(0, Math.round((parseD(parent.dueDate) - parseD(due)) / 86400000));
      stpl.updatedAt = s.updatedAt;
    }
    saveDB();
    toast("Subtask saved", "ok");
    closeModal();
    refreshCurrentPage();
  });
}

function openTaskEdit(id, presetKind) {
  const u = currentUser();
  const t = id ? getTask(id) : null;
  if (t && t.type === "sub") return openSubEdit(id);
  const isNew = !t;
  const members = assignableMembers(u);
  const src = t || {
    title: "", description: "", category: DB.categories[0], priority: "normal",
    kind: presetKind || "regular",
    // a quick task is normally a one-off for today
    taskType: presetKind ? "once" : "recurring", repeats: presetKind ? "once" : "monthly",
    rule: presetKind ? {} : { dayOfMonth: 1 },
    dueDate: shiftFwdWork(todayStr()), responsible: u.email, linked: []

    EDIT_SUBS = subsOf(t).map(s => ({

  openModal(`

        </div>
        <p style="font-size:11px;color:var(--text-2);margin-top:5px;" id="tk-kindnote"></p>
      </div>
      <div class="field"><label>Task title <b class="req">*</b></label><input id="tk-title" value="${esc(src.title)}"></div>
      <div class="field"><label>Description</label><textarea id="tk-desc" rows="2">${esc(src.description)}</textarea></div>
      <div class="form-grid-2">
        <div class="field"><label>Category <b class="req">*</b></label>
          <select id="tk-cat">${DB.categories.map(cat => `<option ${cat === src.category ? "selected" : ""}>${esc(cat)}</option>`).join("")}</select></div>
        <div class="field"><label>Priority <b class="req">*</b></label>
          <select id="tk-pri">
            <option value="normal" ${src.priority === "normal" ? "selected" : ""}>Normal</option>
            <option value="high" ${src.priority === "high" ? "selected" : ""}>High</option>
            <option value="urgent" ${src.priority === "urgent" ? "selected" : ""}>Urgent</option>
          </select></div>
      </div>
      <div class="form-grid-2">
        <div class="field"><label>Task type <b class="req">*</b></label>
          <select id="tk-type">
            <option value="recurring" ${src.taskType === "recurring" ? "selected" : ""}>Recurring</option>
            <option value="once" ${src.taskType === "once" ? "selected" : ""}>Non-recurring (one-time)</option>
          </select></div>
        <div class="field" id="tk-repeats-wrap"><label>Repeats <b class="req">*</b></label>
          <select id="tk-repeats">
            ${["daily","weekly","monthly","quarterly","annual"].map(r =>
              `<option value="${r}" ${src.repeats === r ? "selected" : ""}>${r[0].toUpperCase() + r.slice(1)}</option>`).join("")}
          </select></div>
      </div>
      <div class="form-grid-2" id="tk-rule-row"></div>
      <div class="form-grid-2">
        <div class="field"><label>Responsible <b class="req">*</b></label>
          <select id="tk-resp">${members.map(m => `<option value="${esc(m.email)}" ${m.email === src.responsible ? "selected" : ""}>${esc(fullName(m))}</option>`).join("")}</select></div>
        <div class="field"><label>Assigned by</label>
          <input value="${esc(t ? memberName(t.assignedBy) : fullName(u) + " (me)")} — automatic" disabled style="opacity:.7;"></div>
      </div>
      <p class="auth-error" id="tk-err"></p>

      <div style="border-top:1px solid var(--border);padding-top:12px;margin-top:4px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <label style="margin:0;">Subtasks (<span id="tk-subcount">${EDIT_SUBS.length}</span>) — optional</label>
          <button class="btn btn-sm" id="tk-addsub">+ Add subtask</button>
        </div>
        ${t ? (() => {
          const existing = subsOf(t);
          if (!existing.length) return "";
          const d = existing.filter(s => s.status === "done").length;
          const p = Math.round(d / existing.length * 100);
          return `<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-2);margin-bottom:4px;"><span>${d} of ${existing.length} done</span><b>${p}%</b></div>
          <div class="mini-bar" style="margin:0 0 10px;"><div style="width:${p}%"></div></div>`;
        })() : ""}

      </div>

      <div class="modal-actions">
        <button class="btn btn-primary" id="tk-save">${isNew ? "Create task" : "Save task + subtasks"}</button>
        <button class="btn" id="tk-cancel">Cancel</button>
      </div>
