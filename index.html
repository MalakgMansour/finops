<script>
/* ============================================================
   messages.js — stage 5: compose WhatsApp/Email with task
   auto-fill, drafts, history
   ============================================================ */
"use strict";

let MSG = { via: "wa", to: "", taskId: "" };

function msgAutoFill() {
  const u = currentUser();
  const m = getMember(MSG.to);
  const t = MSG.taskId ? getTask(+MSG.taskId) : null;
  if (!m) return "";
  if (!t) return `Hi ${m.firstName},\n\n\nThanks, ${u.firstName}`;
  const st = taskState(t);
  const parent = t.type === "sub" ? getTask(t.parentId) : null;
  let line = `a reminder about "${t.title}"${parent ? ` (part of ${parent.title})` : ""} — ${t.category}, due ${niceDate(t.dueDate)}`;
  if (isOverdue(t)) line += `, now ${Math.abs(daysToDue(t.dueDate))} day(s) overdue`;
  else if (st.cls === "yellow") line += ` (${st.label.toLowerCase()})`;
  if (t.delayNote) line += `. Your note on file: ${t.delayNote}`;
  return `Hi ${m.firstName}, ${line}. Please update the app today. Thanks, ${u.firstName}`;
}

function renderMessages(c) {
  const u = currentUser();
  if (!isManager(u)) {
    c.innerHTML = `<div class="placeholder-page"><div class="big">🔒</div><p>Messages is for managers and the admin.</p></div>`;
    return;
  }
  const members = DB.members.filter(m => m.registered && m.email !== u.email);
  if (!MSG.to && members.length) MSG.to = members[0].email;
  const toTasks = DB.tasks.filter(t => !t.template && t.responsible === MSG.to && t.status !== "done")
    .sort((a, b) => daysToDue(a.dueDate) - daysToDue(b.dueDate));
  const history = DB.messages.sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 25);

  c.innerHTML = `
    <div class="card">
      <h3>✍️ Compose</h3>
      <div class="form-grid-2">
        <div class="field"><label>Send via</label>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-sm ${MSG.via === "wa" ? "btn-primary" : ""}" id="mg-wa">💬 WhatsApp</button>
            <button class="btn btn-sm ${MSG.via === "email" ? "btn-primary" : ""}" id="mg-email">📧 Email</button>
          </div>
        </div>
        <div class="field"><label>To <b class="req">*</b></label>
          <select id="mg-to">${members.map(m => `<option value="${esc(m.email)}" ${MSG.to === m.email ? "selected" : ""}>${esc(fullName(m))}</option>`).join("")}</select>
        </div>
      </div>
      <div class="field"><label>About task (auto-fills the message)</label>
        <select id="mg-task">
          <option value="">— no specific task —</option>
          ${toTasks.map(t => {
            const st = taskState(t);
            return `<option value="${t.id}" ${MSG.taskId == t.id ? "selected" : ""}>${esc(t.title)} — ${st.label}</option>`;
          }).join("")}
        </select>
      </div>
      ${MSG.via === "email" ? `<div class="field"><label>Subject</label><input id="mg-subject" value="Task follow-up"></div>` : ""}
      <div class="field"><label>Message</label><textarea id="mg-body" rows="4">${esc(msgAutoFill())}</textarea></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-primary" id="mg-send">${MSG.via === "wa" ? "💬 Open in WhatsApp" : "📧 Open in Email"}</button>
        <button class="btn" id="mg-draft">Save draft</button>
      </div>
    </div>

    <p class="sec-title" style="color:var(--text-2);margin-top:6px;">🕘 History</p>
    ${history.length ? history.map(h => {
      const m = getMember(h.toEmail);
      const d = new Date(h.createdAt);
      return `<div class="card" style="padding:11px 15px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center;">
        <div style="min-width:0;">
          <b style="font-size:13.5px;">${h.type === "wa" ? "💬" : "📧"} To ${esc(m ? fullName(m) : h.toEmail)}${h.status === "draft" ? ` <span class="pill pill-yellow">Draft</span>` : ""}</b>
          <p style="font-size:12.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc((h.body || "").replace(/\n/g, " ").slice(0, 90))}</p>
        </div>
        <div style="flex-shrink:0;display:flex;align-items:center;gap:8px;">
          ${h.status === "draft" ? `<button class="btn btn-sm" data-senddraft="${h.id}">Send</button><button class="btn btn-ghost btn-sm" data-deldraft="${h.id}" style="color:var(--red);">✕</button>` : ""}
          <span style="font-size:11.5px;color:var(--text-2);">${h.status === "draft" ? "not sent" : d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}</span>
        </div>
      </div>`;
    }).join("") : `<p class="sec-empty">No messages yet.</p>`}
  `;

  $("mg-wa").addEventListener("click", () => { MSG.via = "wa"; keepAndRender(); });
  $("mg-email").addEventListener("click", () => { MSG.via = "email"; keepAndRender(); });
  $("mg-to").addEventListener("change", e => { MSG.to = e.target.value; MSG.taskId = ""; renderMessages(c); });
  $("mg-task").addEventListener("change", e => { MSG.taskId = e.target.value; keepBody(); });
  $("mg-send").addEventListener("click", () => confirmOutsideHours("Send the message", () => sendComposed(false)));
  $("mg-draft").addEventListener("click", () => sendComposed(true));
  c.querySelectorAll("[data-senddraft]").forEach(b => b.addEventListener("click", () => {
    const h = DB.messages.find(x => x.id === +b.dataset.senddraft);
    if (!h) return;
    openMsg(h);
    h.status = "sent"; h.createdAt = new Date().toISOString();
    saveDB(); renderMessages(c);
  }));
  c.querySelectorAll("[data-deldraft]").forEach(b => b.addEventListener("click", () => {
    DB.messages = DB.messages.filter(x => x.id !== +b.dataset.deldraft);
    saveDB(); renderMessages(c);
  }));

  function keepAndRender() { renderMessages(c); }
  function keepBody() {
    $("mg-body").value = msgAutoFill();
  }
  function sendComposed(asDraft) {
    const m = getMember(MSG.to);
    if (!m) return toast("Pick a recipient", "err");
    const body = $("mg-body").value.trim();
    if (!body) return toast("Message is empty", "err");
    const rec = {
      id: newId(), type: MSG.via, toEmail: m.email,
      subject: MSG.via === "email" ? ($("mg-subject") ? $("mg-subject").value.trim() : "") : "",
      body, linkedTaskId: MSG.taskId ? +MSG.taskId : null,
      status: asDraft ? "draft" : "sent", createdAt: new Date().toISOString()
    };
    if (!asDraft) openMsg(rec);
    DB.messages.push(rec);
    saveDB();
    toast(asDraft ? "Draft saved" : "Message logged", "ok");
    renderMessages(c);
  }
  function openMsg(rec) {
    const m = getMember(rec.toEmail);
    if (rec.type === "wa") {
      if (!m.phone) return toast(m.firstName + " has no mobile number", "err");
      window.open("https://wa.me/" + waPhone(m) + "?text=" + encodeURIComponent(rec.body), "_blank");
    } else {
      window.open("mailto:" + m.email + "?subject=" + encodeURIComponent(rec.subject || "") + "&body=" + encodeURIComponent(rec.body), "_blank");
    }
  }
}

</script>
<script>
/* ============================================================
   warules.js — stage 5: automation rules for WhatsApp reminders
   ============================================================ */
"use strict";

const WA_DEFAULT_TEMPLATE = "Hi [name], reminder: [task] ([category]) was due [due date] and is now [days] days overdue.[delay note] Please update the app today.";

function ruleMatches(rule) {
  const u = currentUser();
  return DB.tasks.filter(t => {
    if (t.template || !canSeeTask(u, t) || !isOverdue(t)) return false;
    const wd = workdaysBetween(t.dueDate, todayStr());
    if (wd <= (rule.threshold ?? 2)) return false;
    if (rule.category && rule.category !== "all" && t.category !== rule.category) return false;
    return true;
  }).sort((a, b) => daysToDue(a.dueDate) - daysToDue(b.dueDate));
}
function fillTemplate(tpl, m, t) {
  const days = Math.abs(daysToDue(t.dueDate));
  return tpl
    .replaceAll("[name]", m.firstName)
    .replaceAll("[task]", t.title)
    .replaceAll("[category]", t.category)
    .replaceAll("[due date]", niceDate(t.dueDate))
    .replaceAll("[days]", String(days))
    .replaceAll("[delay note]", t.delayNote ? ` Note on file: ${t.delayNote}.` : "");
}
function ruleMessages(rule) {
  const matches = ruleMatches(rule);
  const byMember = {};
  for (const t of matches) (byMember[t.responsible] = byMember[t.responsible] || []).push(t);
  return Object.entries(byMember).map(([email, items]) => {
    const m = getMember(email);
    const body = items.length === 1
      ? fillTemplate(rule.template || WA_DEFAULT_TEMPLATE, m, items[0])
      : `Hi ${m.firstName}, reminder about your overdue tasks:\n` + items.map((t, i) =>
          `${i + 1}) ${t.title} (${t.category}) — ${Math.abs(daysToDue(t.dueDate))} days overdue${t.delayNote ? ". Note: " + t.delayNote : ""}`).join("\n") +
        `\nPlease update the app today.`;
    return { m, items, body };
  });
}

function renderWARules(c) {
  const u = currentUser();
  if (!isManager(u)) {
    c.innerHTML = `<div class="placeholder-page"><div class="big">🔒</div><p>WA rules is for managers and the admin.</p></div>`;
    return;
  }
  const rules = DB.waRules;
  c.innerHTML = `
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
      <button class="btn btn-primary btn-sm" id="wr-add">+ New rule</button>
    </div>
    ${rules.length ? rules.map(r => {
      const msgs = ruleMessages(r);
      const total = msgs.reduce((n, x) => n + x.items.length, 0);
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
          <div>
            <b style="font-size:14.5px;">${esc(r.name)}</b>
            <p style="font-size:12.5px;color:var(--text-2);margin-top:2px;">
              Overdue more than <b style="color:var(--text);">${r.threshold} working day${r.threshold === 1 ? "" : "s"}</b>
              · ${r.category === "all" ? "all categories" : `category: ${esc(r.category)}`} · to the responsible person</p>
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0;">
            <button class="btn btn-ghost btn-sm" data-edit="${r.id}">✎</button>
            <button class="btn btn-ghost btn-sm" data-del="${r.id}" style="color:var(--red);">✕</button>
          </div>
        </div>
        <div style="background:var(--surface-2);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--text-2);margin:10px 0;">Template: "${esc(r.template || WA_DEFAULT_TEMPLATE)}"</div>
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
          ${total ? `<span class="st-red" style="font-size:12.5px;font-weight:700;">⚠ ${total} task${total > 1 ? "s" : ""} match today (${msgs.length} member${msgs.length > 1 ? "s" : ""})</span>`
                  : `<span class="st-green" style="font-size:12.5px;font-weight:700;">✓ No matches today</span>`}
          ${total ? `<div style="display:flex;gap:6px;">
            <button class="btn btn-sm" data-preview="${r.id}">👁 Preview</button>
            <button class="btn btn-primary btn-sm" data-send="${r.id}">💬 Send all</button>
          </div>` : ""}
        </div>
      </div>`;
    }).join("") : `<div class="placeholder-page"><div class="big">⚡</div>
      <p style="font-weight:700;">No rules yet</p>
      <p style="font-size:13px;margin-top:6px;">Example: "anything overdue more than 2 working days → prepare WhatsApp reminders".</p></div>`}
  `;

  $("wr-add").addEventListener("click", () => openRuleModal(null));
  c.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => openRuleModal(+b.dataset.edit)));
  c.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
    openConfirm("Delete this rule?", () => {
      DB.waRules = DB.waRules.filter(x => x.id !== +b.dataset.del);
      saveDB(); route("warules");
    });
  }));
  c.querySelectorAll("[data-preview]").forEach(b => b.addEventListener("click", () => openRulePreview(+b.dataset.preview)));
  c.querySelectorAll("[data-send]").forEach(b => b.addEventListener("click", () =>
    confirmOutsideHours("Send all reminders for this rule", () => sendRuleAll(+b.dataset.send))));
}

function openRuleModal(id) {
  const r = id ? DB.waRules.find(x => x.id === id) : null;
  openModal(`
    <h3>${r ? "Edit rule" : "New rule"}</h3>
    <div class="field"><label>Rule name <b class="req">*</b></label><input id="wr-name" value="${esc(r ? r.name : "")}" placeholder="Standard overdue chase"></div>
    <div class="form-grid-2">
      <div class="field"><label>Overdue more than (working days)</label>
        <select id="wr-threshold">${[0,1,2,3,5,7,10].map(n => `<option value="${n}" ${(r ? r.threshold : 2) === n ? "selected" : ""}>${n}</option>`).join("")}</select></div>
      <div class="field"><label>Category</label>
        <select id="wr-cat"><option value="all">All categories</option>
          ${DB.categories.map(x => `<option ${r && r.category === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select></div>
    </div>
    <div class="field"><label>Message template</label>
      <textarea id="wr-template" rows="3">${esc(r ? r.template : WA_DEFAULT_TEMPLATE)}</textarea>
      <p style="font-size:11px;color:var(--text-2);margin-top:4px;">Placeholders: [name] [task] [category] [due date] [days] [delay note]</p>
    </div>
    <p class="auth-error" id="wr-err"></p>
    <div class="modal-actions">
      <button class="btn btn-primary" id="wr-save">${r ? "Save rule" : "Create rule"}</button>
      <button class="btn" id="wr-cancel">Cancel</button>
    </div>`);
  $("wr-cancel").addEventListener("click", closeModal);
  $("wr-save").addEventListener("click", () => {
    const name = $("wr-name").value.trim();
    if (!name) return $("wr-err").textContent = "Rule name is required.";
    if (r) {
      r.name = name; r.threshold = +$("wr-threshold").value;
      r.category = $("wr-cat").value; r.template = $("wr-template").value.trim();
    } else {
      DB.waRules.push({
        id: newId(), name, threshold: +$("wr-threshold").value,
        category: $("wr-cat").value, template: $("wr-template").value.trim(),
        createdAt: new Date().toISOString()
      });
    }
    saveDB(); closeModal(); route("warules"); toast("Rule saved", "ok");
  });
}

function openRulePreview(id) {
  const r = DB.waRules.find(x => x.id === id);
  const msgs = ruleMessages(r);
  openModal(`
    <h3>Preview — ${esc(r.name)}</h3>
    ${msgs.map((x, i) => `
      <div style="border:1px solid var(--border);border-radius:11px;padding:10px 12px;margin-bottom:8px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <b style="font-size:13px;">To ${esc(fullName(x.m))} (${esc((x.m.cc || "") + " " + (x.m.phone || "no number"))}) · ${x.items.length} task${x.items.length > 1 ? "s" : ""}</b>
          <button class="btn btn-sm" data-open-one="${i}">💬 Open</button>
        </div>
        <p style="font-size:12.5px;color:var(--text-2);white-space:pre-wrap;">${esc(x.body)}</p>
      </div>`).join("")}
    <div class="modal-actions"><button class="btn" id="wp-close">Close</button></div>`);
  $("wp-close").addEventListener("click", closeModal);
  document.querySelectorAll("[data-open-one]").forEach(b => b.addEventListener("click", () => {
    const x = msgs[+b.dataset.openOne];
    if (!x.m.phone) return toast(x.m.firstName + " has no mobile number", "err");
    logReminder(x.m, x.items, x.body);
    window.open("https://wa.me/" + waPhone(x.m) + "?text=" + encodeURIComponent(x.body), "_blank");
  }));
}

function sendRuleAll(id) {
  const r = DB.waRules.find(x => x.id === id);
  const msgs = ruleMessages(r).filter(x => x.m.phone);
  if (!msgs.length) return toast("No recipients with phone numbers", "err");
  let i = 0;
  const next = () => {
    if (i >= msgs.length) { refreshCurrentPage(); return; }
    const x = msgs[i];
    logReminder(x.m, x.items, x.body);
    window.open("https://wa.me/" + waPhone(x.m) + "?text=" + encodeURIComponent(x.body), "_blank");
    i++;
    if (i < msgs.length) setTimeout(next, 1400); else refreshCurrentPage();
  };
  next();
}

</script>
<script>
/* ============================================================
   importexport.js — stage 5: CSV template, validated import,
   exports, backup/restore
   ============================================================ */
"use strict";

let IMP = { rows: null, fileName: "" };

const IMP_HEADER = ["Type","Kind","Main task","Title","Description","Category","Priority","Task type","Repeats","Repeat rule","Due date","Responsible","Status","Linked tasks"];

function downloadImportTemplate() {
  const lines = [
    "# FinOps import template — fill in Excel and save as CSV",
    "# Type: Main or Sub | Main task: the main task title (same on Main and its Sub rows)",
    "# Kind: Regular work / Call / Message / Email / Meeting (empty = Regular work)",
    "# Category: " + DB.categories.join(" / "),
    "# Priority: Normal / High / Urgent | Task type: Recurring / One-time",
    "# Repeats: Daily / Weekly / Monthly / Quarterly / Annual (Sub may also use: With main)",
    "# Repeat rule: Weekly=weekday name (e.g. Sunday) | Monthly/Quarterly=day 1-31 | Annual=day-month (e.g. 15-Mar)",
    "# Due date: YYYY-MM-DD (required for One-time and 'With main' subs)",
    "# Responsible: registered member email | Status: To do / In progress (default To do)",
    IMP_HEADER.join(","),
    `Main,Regular work,Payroll run,Payroll run,Monthly payroll,HR finance,High,Recurring,Monthly,26,,${DB.session},To do,`,
    `Sub,Regular work,Payroll run,Collect attendance,,HR finance,,Recurring,With main,,${todayStr()},${DB.session},To do,`,
    `Main,Regular work,GM report,GM report,One-off report,Reporting,Urgent,One-time,,,${addDays(todayStr(), 7)},${DB.session},To do,`,
    `Main,Call,Call the bank,Call the bank,FX confirmation,Treasury,Normal,One-time,,,${todayStr()},${DB.session},To do,`
  ];
  const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "finops_import_template.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

/* minimal CSV parser with quote support */
function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else inQ = false; }
      else cell += ch;
    } else if (ch === '"') inQ = true;
    else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") {
      if (cell !== "" || row.length) { row.push(cell); rows.push(row); row = []; cell = ""; }
      if (ch === "\r" && text[i + 1] === "\n") i++;
    } else cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.length && !(r.length === 1 && !r[0].trim()) && !r[0].trim().startsWith("#"));
}

function normDate(s) {
  s = (s || "").trim();
  if (!s) return "";
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return m[1] + "-" + m[2].padStart(2, "0") + "-" + m[3].padStart(2, "0");
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return m[3] + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0");
  return null;
}
const WD_NAMES = { sunday: 0, monday: 1, tuesday: 2, wednesday: 3, thursday: 4, friday: 5, saturday: 6 };

function validateImport(rows) {
  const header = rows[0].map(h => h.trim().toLowerCase());
  const idx = {};
  IMP_HEADER.forEach(h => idx[h] = header.indexOf(h.toLowerCase()));
  if (idx["Type"] < 0 || idx["Title"] < 0) return { error: "This file doesn't match the template — download the template and keep its columns." };
  const out = [];
  const mainDue = {};   // main title (lowercase) → due date within this file
  const get = (r, k) => (idx[k] >= 0 ? (r[idx[k]] || "") : "").trim();

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const rec = {
      line: i + 1,
      type: get(r, "Type").toLowerCase() === "sub" ? "sub" : "main",
      kind: (() => {
        const v = get(r, "Kind").toLowerCase().replace(/\s+/g, "");
        const k = TASK_KINDS.find(x => x.id === v || x.label.toLowerCase().replace(/\s+/g, "") === v);
        return k ? k.id : "regular";
      })(),
      mainTitle: get(r, "Main task"), title: get(r, "Title"), description: get(r, "Description"),
      category: get(r, "Category"), priority: get(r, "Priority").toLowerCase() || "normal",
      taskType: get(r, "Task type").toLowerCase().startsWith("one") ? "once" : "recurring",
      repeats: get(r, "Repeats").toLowerCase().replace("with main", "withmain"),
      ruleRaw: get(r, "Repeat rule"), due: get(r, "Due date"),
      responsible: get(r, "Responsible").toLowerCase(), status: get(r, "Status").toLowerCase(),
      linked: get(r, "Linked tasks"), errors: [], rule: {}
    };
    if (!rec.title) rec.errors.push("Missing title");
    if (!rec.mainTitle) rec.mainTitle = rec.type === "main" ? rec.title : "";
    // category
    if (rec.type === "main") {
      const cat = DB.categories.find(x => x.toLowerCase() === rec.category.toLowerCase());
      if (!cat) rec.errors.push(`Unknown category "${rec.category}"`);
      else rec.category = cat;
    }
    // responsible
    const m = getMember(rec.responsible);
    if (!m || !m.registered) rec.errors.push(`Responsible "${rec.responsible}" is not a registered member`);
    // priority
    if (!["normal", "high", "urgent"].includes(rec.priority)) rec.priority = "normal";
    // status
    rec.status = rec.status.startsWith("in") ? "inprogress" : "todo";
    // repeats + rule
    if (rec.taskType === "once") { rec.repeats = "once"; }
    if (rec.taskType === "recurring") {
      const valid = rec.type === "main"
        ? ["daily", "weekly", "monthly", "quarterly", "annual"]
        : ["withmain", "daily", "weekly", "monthly", "quarterly", "annual"];
      if (!valid.includes(rec.repeats)) rec.errors.push(`Invalid repeats "${rec.repeats || "(empty)"}"`);
      else {
        if (rec.repeats === "weekly") {
          const wd = WD_NAMES[rec.ruleRaw.toLowerCase()];
          if (wd === undefined) rec.errors.push(`Weekly needs a weekday name, got "${rec.ruleRaw}"`);
          else if (!DB.company.workdays.includes(wd)) rec.errors.push(`${rec.ruleRaw} is not a working day`);
          else rec.rule = { weekday: wd };
        } else if (rec.repeats === "monthly" || rec.repeats === "quarterly") {
          const d = parseInt(rec.ruleRaw, 10);
          if (!d || d < 1 || d > 31) rec.errors.push(`${rec.repeats} needs day 1-31, got "${rec.ruleRaw}"`);
          else rec.rule = { dayOfMonth: d };
        } else if (rec.repeats === "annual") {
          const am = rec.ruleRaw.match(/^(\d{1,2})[-\s\/]([A-Za-z]{3})/);
          const mi = am ? MONTHS.findIndex(x => x.toLowerCase() === am[2].toLowerCase()) : -1;
          if (!am || mi < 0) rec.errors.push(`Annual needs "day-month" e.g. 15-Mar, got "${rec.ruleRaw}"`);
          else rec.rule = { month: mi + 1, day: +am[1] };
        }
      }
    }
    // due date
    const needsDue = rec.taskType === "once" || rec.repeats === "withmain";
    if (needsDue) {
      const d = normDate(rec.due);
      if (!d) rec.errors.push(`Invalid or missing due date "${rec.due}"`);
      else rec.due = shiftFwdWork(d);
    } else rec.due = "";
    if (rec.type === "main" && rec.due) mainDue[rec.mainTitle.toLowerCase()] = rec.due;
    out.push(rec);
  }
  // second pass: sub → parent exists + due rule
  for (const rec of out) {
    if (rec.type !== "sub") continue;
    const key = rec.mainTitle.toLowerCase();
    const inFile = out.find(x => x.type === "main" && x.mainTitle.toLowerCase() === key);
    const inApp = DB.tasks.find(t => !t.template && t.type === "main" && t.status !== "done" && t.title.toLowerCase() === key);
    if (!inFile && !inApp) rec.errors.push(`Main task "${rec.mainTitle}" not found in file or app`);
    if (!rec.category) rec.category = inFile ? inFile.category : (inApp ? inApp.category : DB.categories[0]);
    const pDue = inFile ? (mainDue[key] || null) : (inApp ? inApp.dueDate : null);
    if (rec.due && pDue && rec.due > pDue) rec.errors.push(`Due after main task (${pDue})`);
    rec.parentInFile = !!inFile;
    rec.parentAppId = inApp ? inApp.id : null;
  }
  return { rows: out };
}

function runImport(rows) {
  const u = currentUser();
  const valid = rows.filter(r => !r.errors.length);
  const now = () => new Date().toISOString();
  const createdMains = {}; // lowercase title → {tpl, inst}
  let count = 0;

  const base = (rec, type) => ({
    id: newId(), type, parentId: null, title: rec.title, description: rec.description,
    category: rec.category, kind: rec.kind || "regular", priority: rec.priority, taskType: rec.taskType,
    repeats: rec.repeats, rule: { ...rec.rule }, dueDate: rec.due || null,
    responsible: rec.responsible, assignedBy: u.email, status: rec.status,
    delayNote: "", linked: [], sourceId: null, periodCode: null,
    archived: false, createdAt: now(), updatedAt: now(), completedAt: null, result: null
  });

  for (const rec of valid.filter(r => r.type === "main")) {
    if (rec.taskType === "recurring") {
      const tpl = { ...base(rec, "main"), template: true, dueDate: null };
      DB.tasks.push(tpl);
      createdMains[rec.mainTitle.toLowerCase()] = { tpl };
    } else {
      const d = parseD(rec.due);
      const inst = { ...base(rec, "main"), template: false, periodCode: MONTHS[d.getMonth()] + "/" + d.getFullYear(), year: d.getFullYear(), month: MONTHS[d.getMonth()] };
      DB.tasks.push(inst);
      createdMains[rec.mainTitle.toLowerCase()] = { inst };
    }
    count++;
  }
  for (const rec of valid.filter(r => r.type === "sub")) {
    const made = createdMains[rec.mainTitle.toLowerCase()];
    const parentTpl = made && made.tpl ? made.tpl : null;
    const parentInst = made && made.inst ? made.inst : (rec.parentAppId ? getTask(rec.parentAppId) : null);
    const owner = parentTpl || (parentInst && parentInst.sourceId ? getTask(parentInst.sourceId) : null) || parentInst;
    if (!owner) continue;
    if (rec.repeats === "withmain" || rec.repeats === "once") {
      const stpl = { ...base(rec, "sub"), template: true, parentId: (parentTpl || owner).id, dueDate: null, offsetDays: 0 };
      if (parentTpl) {
        DB.tasks.push(stpl); // instance comes from generation with parent's period due
        // offset: cannot know main due until generated; compute from rule preview
        const p = currentPeriod(parentTpl.repeats, parentTpl.rule);
        if (p && rec.due) stpl.offsetDays = Math.max(0, Math.round((parseD(p.due) - parseD(rec.due)) / 86400000));
      } else if (parentInst) {
        DB.tasks.push(makeSubInstance({ ...rec, rule: { ...rec.rule }, assignedBy: u.email, priority: rec.priority }, parentInst, rec.due, parentInst.periodCode + "·imp"));
      }
    } else {
      DB.tasks.push({ ...base(rec, "sub"), template: true, parentId: (parentTpl || owner).id, dueDate: null, offsetDays: 0 });
    }
    count++;
  }
  DB.lastGenCheck = "";
  saveDB();
  runAutoGen();
  return count;
}

  $("ie-template").addEventListener("click", downloadImportTemplate);
  $("ie-csv").addEventListener("click", () => {
    const rows = [];

    exportMasterCSV(rows);

  $("ie-backup").addEventListener("click", downloadBackup);
  $("ie-restore").addEventListener("click", () => $("ie-restore-file").click());
  $("ie-restore-file").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const data = JSON.parse(rd.result);
        if (!data.members || !data.tasks) throw new Error("bad file");
        openConfirm("Replace ALL current data with this backup? Current data will be lost (a safety backup downloads first).", () => {
          downloadBackup();
          delete data.exportedAt;

          saveDB();
          location.reload();
        });
      } catch { toast("Not a valid FinOps backup file", "err"); }
    };
    rd.readAsText(f);
  });

  const drop = $("ie-drop");
  drop.addEventListener("click", () => $("ie-file").click());
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.style.borderColor = "var(--accent)"; });
  drop.addEventListener("dragleave", () => drop.style.borderColor = "");
  drop.addEventListener("drop", e => {
    e.preventDefault(); drop.style.borderColor = "";
    if (e.dataTransfer.files[0]) handleImportFile(e.dataTransfer.files[0]);
  });
  $("ie-file").addEventListener("change", e => { if (e.target.files[0]) handleImportFile(e.target.files[0]); });

  function handleImportFile(f) {
    IMP.fileName = f.name;
    const rd = new FileReader();
    rd.onload = () => {
      const parsed = parseCSV(String(rd.result).replace(/^﻿/, ""));
      if (!parsed.length) return toast("Empty file", "err");

      drawPreview();

    rd.readAsText(f);

  function drawPreview() {

    const ok = rows.filter(r => !r.errors.length).length;
    const bad = rows.length - ok;
    $("ie-preview").innerHTML = `

              <td>${kindDef(r.kind).ico}</td>
              <td>${esc(r.mainTitle)}</td>
              <td>${esc(r.title)}</td>
              <td>${esc(r.category)}</td>
              <td>${r.repeats === "withmain" ? "With main" : r.repeats === "once" ? "One-time" : r.repeats}</td>
              <td>${r.due || "auto"}</td>
              <td>${esc(r.responsible)}</td>
              <td class="${r.errors.length ? "st-red" : "st-green"}" style="font-weight:700;white-space:normal;min-width:160px;">${r.errors.length ? "✗ " + esc(r.errors.join("; ")) : "✓ OK"}</td>
            </tr>`).join("")}
            </tbody>
          </table>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;flex-wrap:wrap;gap:8px;">
          <span style="font-size:12.5px;color:var(--text-2);">${ok} row${ok === 1 ? "" : "s"} ready${bad ? ` · <b class="st-red">${bad} with errors (will be skipped)</b>` : ""}</span>
          <button class="btn btn-primary btn-sm" id="ie-run" ${ok ? "" : "disabled"}>Import ${ok} valid row${ok === 1 ? "" : "s"}</button>
        </div>
      </div>`;
    $("ie-run").addEventListener("click", () => {
      const n = runImport(IMP.rows);
      IMP.rows = null;
      toast(n + " rows imported", "ok");
      route("tasks");
    });
  }
}

<script>
/* ============================================================
   xlsx.js — minimal real .xlsx writer (no libraries, works offline)
   downloadXlsx("name.xlsx", [{ name:"Sheet1", rows:[[...], [...]] }])
   Values: numbers stay numbers in Excel, everything else is text.
   ============================================================ */
"use strict";

/* ---------- CRC32 ---------- */
const XLSX_CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function xlsxCrc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = XLSX_CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function xlsxBytes(str) { return new TextEncoder().encode(str); }

/* ---------- ZIP (stored, no compression) ---------- */
function xlsxZip(files) {
  const chunks = [], central = [];
  let offset = 0;
  const dosTime = 0, dosDate = 0x2821; // fixed timestamp keeps output deterministic

  for (const f of files) {
    const nameB = xlsxBytes(f.name);
    const dataB = f.data;
    const crc = xlsxCrc32(dataB);

    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0, true);
    local.setUint16(8, 0, true);           // stored
    local.setUint16(10, dosTime, true);
    local.setUint16(12, dosDate, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, dataB.length, true);
    local.setUint32(22, dataB.length, true);
    local.setUint16(26, nameB.length, true);
    local.setUint16(28, 0, true);
    chunks.push(new Uint8Array(local.buffer), nameB, dataB);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint16(8, 0, true);
    cd.setUint16(10, 0, true);
    cd.setUint16(12, dosTime, true);
    cd.setUint16(14, dosDate, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, dataB.length, true);
    cd.setUint32(24, dataB.length, true);
    cd.setUint16(28, nameB.length, true);
    cd.setUint16(30, 0, true);
    cd.setUint16(32, 0, true);
    cd.setUint16(34, 0, true);
    cd.setUint16(36, 0, true);
    cd.setUint32(38, 0, true);
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), nameB);

    offset += 30 + nameB.length + dataB.length;
  }

  const centralSize = central.reduce((n, c) => n + c.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, centralSize, true);
  end.setUint32(16, offset, true);

  const all = [...chunks, ...central, new Uint8Array(end.buffer)];
  const total = all.reduce((n, c) => n + c.length, 0);
  const outBuf = new Uint8Array(total);
  let p = 0;
  for (const c of all) { outBuf.set(c, p); p += c.length; }
  return outBuf;
}

/* ---------- sheet XML ---------- */
function xlsxCol(n) {           // 1 -> A, 27 -> AA
  let s = "";
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
function xlsxEsc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[c]));
}
function xlsxSheetXml(rows) {
  const body = rows.map((row, ri) => {
    const cells = row.map((v, ci) => {
      const ref = xlsxCol(ci + 1) + (ri + 1);
      if (v === null || v === undefined || v === "") return "";
      if (typeof v === "number" && isFinite(v)) return `<c r="${ref}"><v>${v}</v></c>`;
      const bold = ri === 0 ? ' s="1"' : "";
      return `<c r="${ref}" t="inlineStr"${bold}><is><t xml:space="preserve">${xlsxEsc(v)}</t></is></c>`;
    }).join("");
    return `<row r="${ri + 1}">${cells}</row>`;
  }).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${body}</sheetData></worksheet>`;
}

function downloadXlsx(filename, sheets) {
  const names = sheets.map((s, i) => (s.name || ("Sheet" + (i + 1))).replace(/[\\\/\?\*\[\]:]/g, "").slice(0, 31));

  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>`;

  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`;

  const workbook = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${names.map((n, i) => `<sheet name="${xlsxEsc(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets>
</workbook>`;

  const wbRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}
<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`;

  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>
<fills count="1"><fill><patternFill patternType="none"/></fill></fills>
<borders count="1"><border/></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>
</styleSheet>`;

  const files = [
    { name: "[Content_Types].xml", data: xlsxBytes(contentTypes) },
    { name: "_rels/.rels", data: xlsxBytes(rels) },
    { name: "xl/workbook.xml", data: xlsxBytes(workbook) },
    { name: "xl/_rels/workbook.xml.rels", data: xlsxBytes(wbRels) },
    { name: "xl/styles.xml", data: xlsxBytes(styles) },
    ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i + 1}.xml`, data: xlsxBytes(xlsxSheetXml(s.rows)) }))
  ];

  const blob = new Blob([xlsxZip(files)], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

<script>
/* ============================================================
   indicators.js — 6 daily financial indicators:
   capture (auto file + manual), history table, charts,
   relationship view
   ============================================================ */
"use strict";

const IND_DEFS = [
  { key: "usdegp", label: "USD / EGP — NBE buying", short: "USD/EGP", unit: "EGP", dp: 2, auto: false,
    source: "https://www.nbe.com.eg/NBE/E/#/EN/ExchangeRatesAndCurrencyConverter",
    note: "NBE buying rate — entered manually (the NBE site blocks automated reading)." },
  { key: "brent",  label: "Brent crude",      short: "Brent",   unit: "$/bbl", dp: 2, auto: true,
    source: "https://www.investing.com/commodities/brent-oil", note: "Front-month Brent futures." },
  { key: "dxy",    label: "US dollar index",  short: "USD idx", unit: "",      dp: 2, auto: true,
    source: "https://www.investing.com/currencies/us-dollar-index", note: "ICE US dollar index." },
  { key: "gold",   label: "Gold",             short: "Gold",    unit: "$/oz",  dp: 2, auto: true,
    source: "https://www.investing.com/currencies/xau-usd", note: "COMEX front-month, tracks XAU/USD spot." },
  { key: "sofr",   label: "SOFR",             short: "SOFR",    unit: "%",     dp: 2, auto: true,
    source: "https://www.sofrrate.com/", note: "Official New York Fed published rate." },
  { key: "egyON",  label: "Egypt O/N deposit", short: "EGY O/N dep", unit: "%",  dp: 2, auto: false,
    source: "https://www.cbe.org.eg/en/economic-research/statistics/overnight-deposit-and-lending-rate",
    note: "CBE overnight DEPOSIT rate — entered manually (site blocks automated reads)." }
];
const IND_COLORS = { usdegp: "#4f7cff", brent: "#f0803c", dxy: "#22c55e", gold: "#eab308", sofr: "#a78bfa", egyON: "#ef4478" };

let INDV = { range: 90, focus: "all", loaded: false };

/* ---------- storage ---------- */
function indHistory() {
  DB.indicators = DB.indicators || [];
  return DB.indicators;
}

/* one-time cleanup: USD/EGP used to be auto-filled with a market rate.
   Only the NBE buying rate typed by hand is valid, so drop the rest. */
function indPurgeNonNbeUsdEgp() {
  if (DB.indFixNbeOnly) return;
  for (const r of indHistory()) {
    if (typeof r.usdegp === "number" && !(r.manual && r.manual.usdegp)) delete r.usdegp;
  }
  DB.indFixNbeOnly = true;
  saveDB();
}
function indByDate(date) {
  return indHistory().find(r => r.date === date) || null;
}
function indUpsert(date, values, meta) {
  if (date > todayStr()) return null;      // future dates are not allowed
  let r = indByDate(date);
  if (!r) { r = { date, capturedAt: null, manual: {} }; indHistory().push(r); }
  for (const [k, v] of Object.entries(values)) {
    if (v === null || v === undefined || v === "") continue;
    r[k] = typeof v === "number" ? v : parseFloat(v);
    if (meta && meta.manual) { r.manual = r.manual || {}; r.manual[k] = true; }
  }
  if (meta && meta.capturedAt) r.capturedAt = meta.capturedAt;
  indHistory().sort((a, b) => a.date < b.date ? -1 : 1);
  saveDB();
  return r;
}
function indSorted() { return [...indHistory()].sort((a, b) => a.date < b.date ? -1 : 1); }
function indLatest(key) {
  const rows = indSorted();
  for (let i = rows.length - 1; i >= 0; i--) if (typeof rows[i][key] === "number") return { v: rows[i][key], date: rows[i].date };
  return null;
}
function indPrev(key, beforeDate) {
  const rows = indSorted().filter(r => r.date < beforeDate && typeof r[key] === "number");
  return rows.length ? rows[rows.length - 1][key] : null;
}
function fmtNum(v, dp) {
  if (typeof v !== "number" || isNaN(v)) return "—";
  return v.toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp });
}

/* ---------- ask the local server to capture right now ---------- */
async function captureNow() {
  try {
    const res = await fetch("api/capture", { cache: "no-store" });
    const j = await res.json();
    return !!j.ok;
  } catch { return false; }
}

/* ---------- non-trading days: carry the last value forward ----------
   Markets are shut at weekends and on holidays, so no price exists for those
   days. Rather than leaving holes in the charts we repeat the last known value
   and mark it ↺, the usual "last observation carried forward" convention.

   Auto indicators : filled for any past day with no price (weekend / market
                     holiday). Never for today — today's real capture may still
                     arrive.
   Manual (NBE, CBE): filled only on days the office is closed (Fri/Sat and the
                     official holidays list), today included, because no new
                     rate is published then. On a normal working day the value
                     stays empty so you enter it yourself.
------------------------------------------------------------------- */
function isCompanyWorkday(dateStr) {
  const d = parseD(dateStr);
  if (!DB.company.workdays.includes(d.getDay())) return false;
  const hol = DB.company.holidays || [];
  return !hol.includes(dateStr);
}

function indFillNonTradingDays() {
  const rows = indSorted();
  if (!rows.length) return 0;
  const today = todayStr();
  const byDate = new Map(rows.map(r => [r.date, r]));
  const last = {};
  let filled = 0;

  for (let d = rows[0].date; d <= today; d = addDays(d, 1)) {
    let r = byDate.get(d);
    if (!r) {
      r = { date: d, capturedAt: null, manual: {}, carried: {} };
      indHistory().push(r);
      byDate.set(d, r);
    }
    for (const def of IND_DEFS) {
      if (typeof r[def.key] === "number") {
        if (!(r.carried && r.carried[def.key])) last[def.key] = r[def.key];
        continue;
      }
      const officeClosed = !isCompanyWorkday(d);
      const mayCarry = def.auto ? (d < today) : officeClosed;
      if (mayCarry && typeof last[def.key] === "number") {
        r[def.key] = last[def.key];
        r.carried = r.carried || {};
        r.carried[def.key] = true;
        filled++;
      }
    }
  }
  if (filled) {
    indHistory().sort((a, b) => a.date < b.date ? -1 : 1);
    saveDB();
  }
  return filled;
}

/* ---------- load the file written by the 9:00 fetcher ---------- */
async function loadIndicatorFile(showToast) {
  indPurgeNonNbeUsdEgp();
  try {
    const res = await fetch("data/indicators.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("no file");
    const rows = await res.json();
    let added = 0;
    for (const r of Array.isArray(rows) ? rows : [rows]) {
      if (!r || !r.date) continue;
      if (r.date > todayStr()) continue;   // no future-dated rows, ever
      const existing = indByDate(r.date);
      const vals = {};
      for (const d of IND_DEFS) {
        if (!d.auto) continue;                       // manual-only indicators are never taken from the file
        if (typeof r[d.key] === "number") {
          // never overwrite a value the user typed manually
          if (existing && existing.manual && existing.manual[d.key]) continue;
          // one value per day: keep the first real value already recorded —
          // but a carried-forward placeholder is always replaced by real data
          const carried = existing && existing.carried && existing.carried[d.key];
          if (existing && typeof existing[d.key] === "number" && !carried) continue;
          vals[d.key] = r[d.key];
          if (carried) delete existing.carried[d.key];
        }
      }
      if (Object.keys(vals).length) { indUpsert(r.date, vals, { capturedAt: r.capturedAt }); added++; }
    }
    indFillNonTradingDays();   // close weekend / holiday gaps
    INDV.loaded = true;
    if (showToast) toast(added ? "Indicators updated from today's capture" : "No new indicator data", "ok");
    return added;
  } catch (e) {
    INDV.loaded = false;
    indFillNonTradingDays();   // still close the gaps from what we already have
    if (showToast) toast("Could not read the capture file — is the server running?", "err");
    return 0;
  }
}

/* ---------- top strip (next to + Add task) ---------- */
function renderIndicatorStrip() {
  const el = $("ind-strip");
  if (!el) return;
  const today = todayStr();
  const missing = IND_DEFS.filter(d => { const l = indLatest(d.key); return !l || l.date !== today; });
  el.innerHTML = IND_DEFS.map(d => {
    const l = indLatest(d.key);
    if (!l) return `<button class="ind-chip ind-empty" data-ind="${d.key}">
      <span class="ind-name">${d.short}</span><span class="ind-val">—</span></button>`;
    const prev = indPrev(d.key, l.date);
    const diff = prev === null ? null : l.v - prev;
    const pct = prev ? (diff / prev * 100) : null;
    const dir = diff === null || Math.abs(diff) < 1e-9 ? "flat" : diff > 0 ? "up" : "down";
    const stale = l.date !== today;
    return `<button class="ind-chip${stale ? " ind-stale" : ""}" data-ind="${d.key}" title="${esc(d.label)} · ${l.date}${stale ? " (not captured today)" : ""}">
      <span class="ind-name">${d.short}${stale ? " ·" : ""}</span>
      <span class="ind-val" style="color:${IND_COLORS[d.key]}">${fmtNum(l.v, d.dp)}</span>
      ${pct === null ? "" : `<span class="ind-chg ind-${dir}">${dir === "up" ? "▲" : dir === "down" ? "▼" : "•"}${Math.abs(pct).toFixed(2)}%</span>`}
    </button>`;
  }).join("") + `<button class="ind-chip ind-more" id="ind-open" title="Open indicators page">📈</button>`;

  el.querySelectorAll("[data-ind]").forEach(b => b.addEventListener("click", () => {
    INDV.focus = b.dataset.ind; route("indicators");
  }));
  $("ind-open").addEventListener("click", () => { INDV.focus = "all"; route("indicators"); });
  const badge = $("ind-missing-badge");
  if (badge) badge.textContent = missing.length ? String(missing.length) : "";
}

/* ---------- charts (plain canvas, no libraries) ---------- */
function drawLineChart(canvas, series, opts) {
  opts = opts || {};
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.body);
  const gridCol = css.getPropertyValue("--border").trim() || "#333";
  const textCol = css.getPropertyValue("--text-2").trim() || "#888";

  const padL = 52, padR = 12, padT = 10, padB = 26;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const pts = series.flatMap(s => s.points);
  if (!pts.length) {
    ctx.fillStyle = textCol; ctx.font = "12px Inter, Arial"; ctx.textAlign = "center";
    ctx.fillText("No data yet", W / 2, H / 2); return;
  }
  let min = Math.min(...pts.map(p => p.y)), max = Math.max(...pts.map(p => p.y));
  if (min === max) { min -= 1; max += 1; }
  const padY = (max - min) * 0.12; min -= padY; max += padY;
  const allX = [...new Set(pts.map(p => p.x))].sort();
  const xIndex = new Map(allX.map((d, i) => [d, i]));
  const X = (d) => padL + (allX.length === 1 ? plotW / 2 : xIndex.get(d) / (allX.length - 1) * plotW);
  const Y = (v) => padT + plotH - (v - min) / (max - min) * plotH;

  // grid + y labels
  ctx.strokeStyle = gridCol; ctx.lineWidth = 1; ctx.fillStyle = textCol;
  ctx.font = "10px Inter, Arial"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let i = 0; i <= 4; i++) {
    const v = min + (max - min) * i / 4, y = Y(v);
    ctx.globalAlpha = .5; ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillText(opts.pct ? v.toFixed(0) + "%" : v.toFixed(Math.abs(max - min) < 5 ? 2 : 0), padL - 6, y);
  }
  // x labels (first, middle, last)
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  [0, Math.floor((allX.length - 1) / 2), allX.length - 1].filter((v, i, a) => a.indexOf(v) === i).forEach(i => {
    const d = allX[i];
    ctx.fillText(shortDate(d), X(d), padT + plotH + 7);
  });

  // lines
  for (const s of series) {
    if (!s.points.length) continue;
    ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.lineJoin = "round";
    ctx.beginPath();
    s.points.forEach((p, i) => { const x = X(p.x), y = Y(p.y); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.stroke();
    if (s.fill && s.points.length > 1) {
      ctx.lineTo(X(s.points[s.points.length - 1].x), padT + plotH);
      ctx.lineTo(X(s.points[0].x), padT + plotH);
      ctx.closePath();
      ctx.globalAlpha = .10; ctx.fillStyle = s.color; ctx.fill(); ctx.globalAlpha = 1;
    }
    if (s.points.length === 1) {
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(X(s.points[0].x), Y(s.points[0].y), 3.5, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function seriesFor(key, rows) {
  return rows.filter(r => typeof r[key] === "number").map(r => ({ x: r.date, y: r[key] }));
}
function rangeRows() {
  const rows = indSorted();
  if (INDV.range === 0) return rows;
  const from = addDays(todayStr(), -INDV.range);
  return rows.filter(r => r.date >= from);
}

/* Pearson correlation of day-over-day % changes */
function correlation(aKey, bKey, rows) {
  const pairs = [];
  let prevA = null, prevB = null;
  for (const r of rows) {
    const a = r[aKey], b = r[bKey];
    if (typeof a === "number" && typeof b === "number") {
      if (prevA !== null && prevB !== null && prevA !== 0 && prevB !== 0) {
        pairs.push([(a - prevA) / prevA, (b - prevB) / prevB]);
      }
      prevA = a; prevB = b;
    }
  }
  if (pairs.length < 3) return null;
  const n = pairs.length;
  const ma = pairs.reduce((s, p) => s + p[0], 0) / n;
  const mb = pairs.reduce((s, p) => s + p[1], 0) / n;
  let num = 0, da = 0, db = 0;
  for (const [a, b] of pairs) { num += (a - ma) * (b - mb); da += (a - ma) ** 2; db += (b - mb) ** 2; }
  if (da === 0 || db === 0) return null;
  return num / Math.sqrt(da * db);
}
function corrColor(c) {
  if (c === null) return "background:var(--surface-2);color:var(--text-2);";
  const a = Math.min(1, Math.abs(c));
  return c >= 0
    ? `background:rgba(34,197,94,${(a * .55).toFixed(2)});color:${a > .5 ? "#fff" : "var(--text)"};`
    : `background:rgba(239,68,68,${(a * .55).toFixed(2)});color:${a > .5 ? "#fff" : "var(--text)"};`;
}

        return `<div class="card ind-card">
