        </table>
      </div>
    </div>

    <div class="card">
      <h3>🗄️ Historical record (${all.length} day${all.length === 1 ? "" : "s"})</h3>
      <div class="table-wrap" style="max-height:50dvh;">
        <table class="data" style="min-width:760px;">
          <thead><tr><th>Date</th>${IND_DEFS.map(d => `<th>${esc(d.short)}${d.unit ? ` <span style="opacity:.6;">${esc(d.unit)}</span>` : ""}</th>`).join("")}<th>Captured</th><th></th></tr></thead>
          <tbody>
            ${all.length ? [...all].reverse().map(r => `<tr>
              <td style="font-weight:700;">${esc(r.date)}${r.date === today ? ` <span class="pill pill-gray">today</span>` : ""}</td>
              ${IND_DEFS.map(d => `<td>${typeof r[d.key] === "number" ? fmtNum(r[d.key], d.dp) : "<span style='color:var(--text-2)'>—</span>"}${r.carried && r.carried[d.key] ? " <span style='font-size:9px;color:var(--text-2)' title='carried from the previous day'>↺</span>" : (r.manual && r.manual[d.key] ? " <span style='font-size:9px;color:var(--text-2)' title='entered manually'>✎</span>" : "")}</td>`).join("")}
              <td style="color:var(--text-2);font-size:11.5px;">${r.capturedAt === "backfilled" ? "backfilled" : r.capturedAt ? esc(String(r.capturedAt).slice(11, 16)) : "manual"}</td>
              <td><button class="btn btn-ghost btn-sm" data-editday="${esc(r.date)}" title="Edit this day">✎</button></td>
            </tr>`).join("") : `<tr><td colspan="9" style="color:var(--text-2);">No records yet — press "Refresh now" or enter today's values.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    <p style="font-size:11.5px;color:var(--text-2);margin-top:4px;">
      Captured automatically every day at 09:00 (Brent, USD index, Gold, SOFR, USD/EGP market rate).
      The NBE counter rate and the CBE overnight rate are entered manually — those two sites block automated reading.
    </p>`;

  c.querySelectorAll("[data-range]").forEach(b => b.addEventListener("click", () => {
    INDV.range = +b.dataset.range; renderIndicators(c);
  }));
  $("ind-refresh").addEventListener("click", async () => {
    const btn = $("ind-refresh");
    const t = indByDate(todayStr()) || {};
    const stillMissing = IND_DEFS.filter(d => d.auto && typeof t[d.key] !== "number");
    if (!stillMissing.length) {
      await loadIndicatorFile(false);
      renderIndicatorStrip(); renderIndicators(c);
      return toast("Today is already captured — one value per day", "ok");
    }
    btn.disabled = true; btn.textContent = "⏳ Fetching…";
    const ok = await captureNow();          // live fetch (needs internet + server)
    await loadIndicatorFile(false);         // read whatever is on disk either way
    renderIndicatorStrip();
    renderIndicators(c);
    toast(ok ? "Captured today's values" : "No live connection — nothing captured yet", ok ? "ok" : "err");
  });
  $("ind-manual").addEventListener("click", () => openIndicatorEntry());
  if ($("ind-fix")) $("ind-fix").addEventListener("click", () => openIndicatorEntry());
  $("ind-csv").addEventListener("click", exportIndicatorsCSV);
  $("ind-xlsx").addEventListener("click", exportIndicatorsExcel);
  $("ind-upload").addEventListener("click", openIndicatorUpload);
  c.querySelectorAll("[data-editday]").forEach(b => b.addEventListener("click", () =>
    openIndicatorEntry(b.dataset.editday)));

  // draw the charts after layout
  requestAnimationFrame(() => {
    c.querySelectorAll("[data-chart]").forEach(cv => {
      const key = cv.dataset.chart;
      drawLineChart(cv, [{ points: seriesFor(key, rows), color: IND_COLORS[key], fill: true }]);
    });
    const comb = $("ind-combined");
    if (comb) {
      const series = IND_DEFS.map(d => {
        const pts = seriesFor(d.key, rows);
        if (!pts.length) return { points: [], color: IND_COLORS[d.key] };
        const base = pts[0].y || 1;
        return { points: pts.map(p => ({ x: p.x, y: p.y / base * 100 })), color: IND_COLORS[d.key] };
      });
      drawLineChart(comb, series, { pct: true });
    }
  });
}

/* ---------- manual entry ---------- */
function openIndicatorEntry(date) {
  const d0 = date || todayStr();
  const rec = indByDate(d0) || {};
  openModal(`
    <h3>Indicator values</h3>
    <div class="field"><label>Date</label><input type="date" id="ie-date" value="${d0}" max="${todayStr()}"></div>
    ${IND_DEFS.map(d => `
      <div class="field">
        <label>${esc(d.label)}${d.unit ? ` (${esc(d.unit)})` : ""} ${d.auto ? `<span class="pill pill-gray">auto</span>` : `<span class="pill pill-yellow">manual</span>`}
          — <a href="${d.source}" target="_blank" rel="noopener" style="color:var(--accent);">open source ↗</a></label>
        <input type="number" step="any" data-ind-in="${d.key}" value="${typeof rec[d.key] === "number" ? rec[d.key] : ""}" placeholder="${d.note}">
      </div>`).join("")}
    <label style="display:flex;gap:8px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-bottom:4px;cursor:pointer;">
      <input type="checkbox" id="ie-fillgap" style="width:auto;margin-top:2px;">
      <span style="font-size:12.5px;color:var(--text-2);font-weight:400;">
        <b style="color:var(--text);">Also fill the empty days before this date</b><br>
        Use after leave or travel: the same value is copied into every earlier day that has no value yet, back to the last one recorded. Those days are marked ↺.
      </span>
    </label>
    <p class="auth-error" id="ie-err"></p>
    <div class="modal-actions">
      <button class="btn btn-primary" id="ie-save">Save values</button>
      <button class="btn" id="ie-cancel">Cancel</button>
    </div>`);
  $("ie-cancel").addEventListener("click", closeModal);
  $("ie-date").addEventListener("change", e => { closeModal(); openIndicatorEntry(e.target.value); });
  $("ie-save").addEventListener("click", () => {
    const date = $("ie-date").value || d0;
    const before = indByDate(date) || {};
    const changed = {}, unchanged = {};
    let any = false;
    document.querySelectorAll("[data-ind-in]").forEach(inp => {
      if (inp.value === "") return;
      const k = inp.dataset.indIn, v = parseFloat(inp.value);
      if (isNaN(v)) return;
      any = true;
      // only values the user actually edited count as manual — a pre-filled
      // auto value must stay auto so tomorrow's capture can still update it
      if (typeof before[k] === "number" && Math.abs(before[k] - v) < 1e-9) unchanged[k] = v;
      else changed[k] = v;
    });
    if (!any) return $("ie-err").textContent = "Enter at least one value.";
    if (Object.keys(unchanged).length) indUpsert(date, unchanged, {});
    if (Object.keys(changed).length) indUpsert(date, changed, { manual: true });

    // after leave: copy each saved value into the earlier days that are still empty
    let gapDays = 0;
    if ($("ie-fillgap").checked) {
      const entered = { ...changed, ...unchanged };
      for (const [key, value] of Object.entries(entered)) {
        // stop at the last day that already has a value for this indicator
        const earlier = indSorted().filter(r => r.date < date);
        let stopAt = null;
        for (let i = earlier.length - 1; i >= 0; i--) {
          if (typeof earlier[i][key] === "number") { stopAt = earlier[i].date; break; }
        }
        const targets = earlier.filter(r => typeof r[key] !== "number" && (!stopAt || r.date > stopAt));
        for (const r of targets) {
          r[key] = value;
          r.manual = r.manual || {}; r.manual[key] = true;
          r.carried = r.carried || {}; r.carried[key] = true;
          gapDays++;
        }
      }
      if (gapDays) saveDB();
    }
    closeModal();
    toast(gapDays ? `Saved · ${gapDays} earlier empty day${gapDays === 1 ? "" : "s"} filled` : "Indicator values saved", "ok");
    renderIndicatorStrip();
    refreshCurrentPage();
  });
}

/* ---------- Excel export (two sheets: values + day-over-day % change) ---------- */
function exportIndicatorsExcel() {
  const rows = indSorted();
  if (!rows.length) return toast("No data to export yet", "err");

  const header = ["Date", ...IND_DEFS.map(d => d.label + (d.unit ? " (" + d.unit + ")" : "")), "Captured at", "Source"];
  const values = [header];
  const changes = [["Date", ...IND_DEFS.map(d => d.short + " %")]];
  let prev = {};

  for (const r of rows) {
    const manualKeys = Object.keys(r.manual || {});
    values.push([
      r.date,
      ...IND_DEFS.map(d => typeof r[d.key] === "number" ? r[d.key] : ""),
      r.capturedAt === "backfilled" ? "backfilled" : (r.capturedAt || "manual"),
      manualKeys.length ? (manualKeys.length === IND_DEFS.length ? "manual" : "auto + manual") : "auto"
    ]);
    changes.push([
      r.date,
      ...IND_DEFS.map(d => {
        const v = r[d.key], p = prev[d.key];
        if (typeof v !== "number" || typeof p !== "number" || p === 0) return "";
        return Math.round((v - p) / p * 10000) / 100;
      })
    ]);
    for (const d of IND_DEFS) if (typeof r[d.key] === "number") prev[d.key] = r[d.key];
  }

  // a small summary sheet: latest, min, max, average per indicator
  const summary = [["Indicator", "Latest", "Date", "Minimum", "Maximum", "Average", "Days recorded"]];
  for (const d of IND_DEFS) {
    const vals = rows.filter(r => typeof r[d.key] === "number").map(r => r[d.key]);
    const last = indLatest(d.key);
    summary.push([
      d.label + (d.unit ? " (" + d.unit + ")" : ""),
      last ? last.v : "", last ? last.date : "",
      vals.length ? Math.min(...vals) : "",
      vals.length ? Math.max(...vals) : "",
      vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length * 10000) / 10000 : "",
      vals.length
    ]);
  }

  downloadXlsx(`indicators_${todayStr()}.xlsx`, [
    { name: "Daily values", rows: values },
    { name: "Daily % change", rows: changes },
    { name: "Summary", rows: summary }
  ]);
  toast("Excel file downloaded", "ok");
}

/* ---------- upload historical values for the manual indicators ---------- */
function openIndicatorUpload() {
  const manualDefs = IND_DEFS.filter(d => !d.auto);
  openModal(`
    <h3>⬆ Upload history</h3>
    <p class="auth-hint">For the manual indicators — ${manualDefs.map(d => esc(d.label)).join(" and ")}. Prepare a file in Excel, save as CSV, then drop it here.</p>
    <div style="background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--text-2);margin-bottom:12px;">
      <b style="color:var(--text);">Columns (first row = headings):</b><br>
      <code style="font-size:11.5px;">Date, USD/EGP, O/N deposit</code><br>
      Date as YYYY-MM-DD or DD/MM/YYYY. Leave a cell empty to skip it. Future dates are ignored.
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button class="btn btn-sm" id="iu-template">⬇ Download template</button>
      <button class="btn btn-sm" id="iu-pick" style="flex:1;">📄 Choose CSV file</button>
      <input type="file" id="iu-file" accept=".csv,text/csv" class="hidden">
    </div>
    <div id="iu-preview"></div>
    <div class="modal-actions"><button class="btn" id="iu-close">Close</button></div>`);

  $("iu-close").addEventListener("click", closeModal);
  $("iu-pick").addEventListener("click", () => $("iu-file").click());
  $("iu-template").addEventListener("click", () => {
    const rows = [["Date", ...manualDefs.map(d => d.label)]];
    for (let i = 5; i >= 1; i--) rows.push([addDays(todayStr(), -i), "", ""]);
    const csv = rows.map(r => r.map(x => `"${x}"`).join(",")).join("\n");
    const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "indicator_history_template.csv";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  $("iu-file").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => previewUpload(String(rd.result).replace(/^﻿/, ""), f.name);
    rd.readAsText(f);
  });

  function normDateStr(s) {
    s = String(s || "").trim();
    let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
    if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
    m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if (m) return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
    return null;
  }

  function previewUpload(text, fileName) {
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) return toast("The file has no data rows", "err");
    const cell = (l) => l.split(",").map(x => x.replace(/^"|"$/g, "").trim());
    const head = cell(lines[0]).map(h => h.toLowerCase());
    // map each manual indicator to a column
    const colOf = {};
    manualDefs.forEach(d => {
      let idx = head.findIndex(h => h.includes(d.label.toLowerCase()));
      if (idx < 0 && d.key === "usdegp") idx = head.findIndex(h => h.includes("usd") && h.includes("egp"));
      if (idx < 0 && d.key === "egyON") idx = head.findIndex(h => h.includes("o/n") || h.includes("overnight") || h.includes("deposit"));
      colOf[d.key] = idx;
    });
    const dateCol = head.findIndex(h => h.includes("date"));
    if (dateCol < 0) return toast("No 'Date' column found", "err");

    const parsed = [];
    for (let i = 1; i < lines.length; i++) {
      const c = cell(lines[i]);
      const date = normDateStr(c[dateCol]);
      const rec = { line: i + 1, raw: c[dateCol], date, vals: {}, errors: [] };
      if (!date) rec.errors.push("bad date");
      else if (date > todayStr()) rec.errors.push("future date — skipped");
      for (const d of manualDefs) {
        const idx = colOf[d.key];
        if (idx < 0) continue;
        const v = (c[idx] || "").replace(/,/g, "").trim();
        if (v === "") continue;
        const n = parseFloat(v);
        if (isNaN(n)) rec.errors.push(`${d.short}: "${v}" is not a number`);
        else rec.vals[d.key] = n;
      }
      if (!rec.errors.length && !Object.keys(rec.vals).length) rec.errors.push("no values");
      parsed.push(rec);
    }
    const okRows = parsed.filter(r => !r.errors.length);

    $("iu-preview").innerHTML = `
      <div class="table-wrap" style="max-height:34dvh;border:1px solid var(--border);border-radius:10px;">
        <table class="data" style="font-size:12px;">
          <thead><tr><th>Line</th><th>Date</th>${manualDefs.map(d => `<th>${esc(d.short)}</th>`).join("")}<th>Check</th></tr></thead>
          <tbody>${parsed.map(r => `<tr>
            <td>${r.line}</td><td>${esc(r.date || r.raw || "—")}</td>
            ${manualDefs.map(d => `<td>${r.vals[d.key] !== undefined ? fmtNum(r.vals[d.key], d.dp) : "—"}</td>`).join("")}
            <td class="${r.errors.length ? "st-red" : "st-green"}" style="font-weight:700;white-space:normal;">${r.errors.length ? "✗ " + esc(r.errors.join("; ")) : "✓ OK"}</td>
          </tr>`).join("")}</tbody>
        </table>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap;">
        <span style="font-size:12.5px;color:var(--text-2);">${esc(fileName)} · ${okRows.length} row${okRows.length === 1 ? "" : "s"} ready${parsed.length - okRows.length ? ` · <b class="st-red">${parsed.length - okRows.length} skipped</b>` : ""}</span>
        <button class="btn btn-primary btn-sm" id="iu-apply" ${okRows.length ? "" : "disabled"}>Import ${okRows.length} day${okRows.length === 1 ? "" : "s"}</button>
      </div>`;

    $("iu-apply").addEventListener("click", () => {
      let n = 0;
      for (const r of okRows) { indUpsert(r.date, r.vals, { manual: true }); n++; }
      closeModal();
      toast(`${n} day${n === 1 ? "" : "s"} imported`, "ok");
      renderIndicatorStrip();
      refreshCurrentPage();
    });
  }
}

function exportIndicatorsCSV() {
  const q = (s) => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const lines = [["Date", ...IND_DEFS.map(d => d.label + (d.unit ? " (" + d.unit + ")" : "")), "Captured at"].map(q).join(",")];
  for (const r of indSorted()) {
    lines.push([r.date, ...IND_DEFS.map(d => typeof r[d.key] === "number" ? r[d.key] : ""), r.capturedAt || "manual"].map(q).join(","));
  }
  const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `indicators_${todayStr()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Indicators exported", "ok");
}

</script>
<script>
/* ============================================================
   proposals.js — tasks proposed from your Outlook inbox.
   Nothing is ever added without your click.
   ============================================================ */
"use strict";

let PROP = { list: [], loading: false, lastRun: null, error: null };

function decidedIds() {
  DB.emailDecided = DB.emailDecided || [];
  return DB.emailDecided;
}
function markDecided(id) {
  if (!decidedIds().includes(id)) decidedIds().push(id);
  PROP.list = PROP.list.filter(p => p.email_id !== id);
  saveDB();
  syncDecidedToDisk();
}
/* tell the reader script which emails are settled so it never proposes them again */
async function syncDecidedToDisk() {
  try {
    await fetch("api/decided", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(decidedIds())
    });
  } catch { /* the file is rewritten on the next successful sync */ }
}

/* Outlook can only be reached from the machine it runs on */
function onOfficeLaptop() {
  return ["localhost", "127.0.0.1"].includes(location.hostname);
}

async function loadProposals(showToast) {
  try {
    const res = await fetch("data/task_proposals.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("no file");
    const rows = await res.json();
    const done = decidedIds();
    PROP.list = (Array.isArray(rows) ? rows : []).filter(p => p && p.email_id && !done.includes(p.email_id));
    PROP.error = null;
  } catch {
    PROP.list = [];
    PROP.error = onOfficeLaptop()
      ? "No proposals file yet — press “Read my inbox”."
      : "Your inbox is read on your work laptop, where Outlook lives. Approve proposals there and the tasks sync to this device.";
  }
  if (showToast) toast(`${PROP.list.length} proposal${PROP.list.length === 1 ? "" : "s"} waiting`, "ok");
  return PROP.list.length;
}

async function scanInbox(c) {
  PROP.loading = true;
  if (c) renderProposals(c);
  try {
    const res = await fetch("api/readmail", { cache: "no-store" });
    const j = await res.json();
    PROP.lastRun = j.output || "";
    PROP.error = j.ok ? null : (j.output || "The inbox scan failed.");
  } catch {
    PROP.error = "Could not reach the local server.";
  }
  await loadProposals(false);
  PROP.loading = false;
  if (c) renderProposals(c);
  updateProposalBadge();
}

function updateProposalBadge() {
  const el = document.querySelector('[data-p="proposals"] .nav-badge');
  document.querySelectorAll('[data-p="proposals"]').forEach(b => {
    let badge = b.querySelector(".nav-badge");
    if (PROP.list.length) {
      if (!badge) { badge = document.createElement("span"); badge.className = "nav-badge"; b.appendChild(badge); }
      badge.textContent = PROP.list.length;
    } else if (badge) badge.remove();
  });
}

/* ---------- turn one proposal into a real task ---------- */
function proposalToTask(p, openEditor) {
  const u = currentUser();
  const cat = DB.categories.includes(p.category) ? p.category : DB.categories[0];
  let due = /^\d{4}-\d{2}-\d{2}$/.test(p.due_date || "") ? p.due_date : addDays(todayStr(), 3);
  due = shiftFwdWork(due);
  if (due < todayStr()) due = shiftFwdWork(todayStr());
  const d = parseD(due);
  const now = new Date().toISOString();
  const t = {
    id: newId(), type: "main", template: false, parentId: null,
    title: (p.title || p.subject || "Task from email").slice(0, 120),
    description: `From email — ${p.from || p.requested_by || "unknown"}${p.subject ? ` · “${p.subject}”` : ""}${p.reason ? `\n${p.reason}` : ""}`,
    category: cat,
    kind: ["regular", "call", "message", "email", "meeting"].includes(p.kind) ? p.kind : "regular",
    priority: ["normal", "high", "urgent"].includes(p.priority) ? p.priority : "normal",
    taskType: "once", repeats: "once", rule: {},
    dueDate: due, responsible: u.email, assignedBy: u.email,
    status: "todo", delayNote: "", linked: [], sourceId: null,
    periodCode: MONTHS[d.getMonth()] + "/" + d.getFullYear(),
    year: d.getFullYear(), month: MONTHS[d.getMonth()],
    archived: false, createdAt: now, updatedAt: now, completedAt: null, result: null,
    fromEmail: p.email_id
  };
  DB.tasks.push(t);
  saveDB();
  markDecided(p.email_id);
  if (openEditor) openTaskEdit(t.id);
  return t;
}

/* ---------- the page ---------- */
function renderProposals(c) {
  const kindIco = (k) => kindDef(k).ico;

  c.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
      <div>
        <div style="font-size:15px;font-weight:800;">📬 Proposed from your email</div>
        <div style="font-size:12px;color:var(--text-2);">Nothing is added to your tasks until you press ✓.</div>
      </div>
      <div style="display:flex;gap:8px;">
        ${onOfficeLaptop() ? `<button class="btn btn-sm btn-primary" id="pr-scan" ${PROP.loading ? "disabled" : ""}>
          ${PROP.loading ? "⏳ Reading…" : "📥 Read my inbox"}</button>` : ""}
        ${PROP.list.length > 1 ? `<button class="btn btn-sm" id="pr-ignore-all">Ignore all</button>` : ""}
      </div>
    </div>

    ${PROP.error && !PROP.list.length ? `<div class="card" style="border-color:var(--yellow);padding:12px 15px;font-size:13px;">
      <b class="st-yellow">${esc(PROP.error)}</b>
    </div>` : ""}

    ${PROP.loading ? `<div class="placeholder-page"><div class="big">📨</div>
      <p style="font-weight:700;">Reading your inbox…</p>
      <p style="font-size:13px;margin-top:6px;">Outlook is being read locally. This takes a few seconds.</p></div>` : ""}

    ${!PROP.loading && !PROP.list.length && !PROP.error ? `<div class="placeholder-page"><div class="big">✅</div>
      <p style="font-weight:700;">Nothing waiting</p>
      <p style="font-size:13px;margin-top:6px;">No new email looks like it needs a task.</p></div>` : ""}

    ${PROP.list.map((p, i) => `
      <div class="card" style="padding:13px 15px;margin-bottom:9px;">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;">
          <div style="min-width:0;flex:1;">
            <div class="task-row-title" style="font-size:14.5px;">
              ${kindIco(p.kind)} ${esc(p.title || "(untitled)")}
              <span class="pill" style="${catChipStyle(p.category)}">${esc(p.category)}</span>
              ${p.priority !== "normal" ? priBadge(p.priority) : ""}
              ${p.source === "ai" ? `<span class="pill pill-gray" title="Read by Claude">✨ AI</span>` : `<span class="pill pill-gray" title="Matched by keywords">rules</span>`}
            </div>
            <div class="task-row-sub">
              From <b>${esc(p.from || p.requested_by || "—")}</b>${p.received ? " · " + esc(p.received) : ""}
              ${p.due_date ? ` · suggested due <b>${esc(niceDate(p.due_date))}</b>` : " · no date given"}
            </div>
            ${p.subject ? `<div style="font-size:12px;color:var(--text-2);margin-top:4px;">✉️ ${esc(p.subject)}</div>` : ""}
            ${p.reason ? `<div style="font-size:12px;color:var(--text-2);margin-top:3px;font-style:italic;">“${esc(p.reason)}”</div>` : ""}
          </div>
        </div>
        <div style="display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;">
          <button class="btn btn-sm btn-primary" data-add="${i}">✓ Add task</button>
          <button class="btn btn-sm" data-edit="${i}">✎ Edit first</button>
          <button class="btn btn-sm btn-ghost" data-skip="${i}" style="color:var(--red);">✕ Ignore</button>
        </div>
      </div>`).join("")}
  `;

  if ($("pr-scan")) $("pr-scan").addEventListener("click", () => scanInbox(c));
  if ($("pr-ignore-all")) $("pr-ignore-all").addEventListener("click", () => {
    openConfirm(`Ignore all ${PROP.list.length} proposals? They won't be suggested again.`, () => {
      [...PROP.list].forEach(p => markDecided(p.email_id));
      renderProposals(c); updateProposalBadge();
      toast("All proposals cleared", "ok");
    });
  });
  c.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => {
    const p = PROP.list[+b.dataset.add];
    const t = proposalToTask(p, false);
    toast(`Added: ${t.title}`, "ok");
    renderProposals(c); updateProposalBadge();
  }));
  c.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => {
    const p = PROP.list[+b.dataset.edit];
    proposalToTask(p, true);
    renderProposals(c); updateProposalBadge();
  }));
  c.querySelectorAll("[data-skip]").forEach(b => b.addEventListener("click", () => {
    markDecided(PROP.list[+b.dataset.skip].email_id);
    renderProposals(c); updateProposalBadge();
  }));
}

</script>
<script>
/* ============================================================
   cloud.js — sync this device with a Supabase project
   ------------------------------------------------------------
   One row per person holds the whole FinOps document as JSON.
   Sync merges record by record (task by task), so editing on the
   phone and on the laptop on the same day does not wipe either.
   ============================================================ */
"use strict";

const CLOUD_KEY = "finops2_cloud";

let CLOUD = {
  url: "", anonKey: "", email: "",
  accessToken: "", refreshToken: "", userId: "",
  deviceId: "", autoSync: true, lastSync: "", lastError: ""
};

function loadCloud() {
  try {
    const raw = localStorage.getItem(CLOUD_KEY);
    if (raw) CLOUD = Object.assign(CLOUD, JSON.parse(raw));
  } catch (e) { /* keep defaults */ }
  if (!CLOUD.deviceId) {
    CLOUD.deviceId = "dev_" + Math.random().toString(36).slice(2, 10);
    saveCloud();
  }
}
function saveCloud() { localStorage.setItem(CLOUD_KEY, JSON.stringify(CLOUD)); }
function cloudReady() { return !!(CLOUD.url && CLOUD.anonKey && CLOUD.accessToken); }
function cloudConfigured() { return !!(CLOUD.url && CLOUD.anonKey); }

/* ---------- low level ---------- */
function cloudHeaders(withAuth) {
  const h = { "apikey": CLOUD.anonKey, "Content-Type": "application/json" };
  if (withAuth && CLOUD.accessToken) h["Authorization"] = "Bearer " + CLOUD.accessToken;
  return h;
}

async function cloudFetch(path, opts, retry) {
  const res = await fetch(CLOUD.url.replace(/\/+$/, "") + path, opts);
  if (res.status === 401 && !retry && CLOUD.refreshToken) {
    const ok = await cloudRefresh();
    if (ok) {
      opts.headers = Object.assign({}, opts.headers, { "Authorization": "Bearer " + CLOUD.accessToken });
      return cloudFetch(path, opts, true);
    }
  }
  return res;
}

/* ---------- sign in / out ---------- */
/* The password is typed by the user into this form and sent straight to
   their own Supabase project. It is never stored on the device. */
async function cloudSignIn(email, password) {
  const res = await fetch(CLOUD.url.replace(/\/+$/, "") + "/auth/v1/token?grant_type=password", {
    method: "POST", headers: cloudHeaders(false),
    body: JSON.stringify({ email, password })
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error_description || j.msg || j.message || "Sign in failed");
  CLOUD.accessToken = j.access_token;
  CLOUD.refreshToken = j.refresh_token;
  CLOUD.userId = j.user ? j.user.id : "";
  CLOUD.email = email;
  CLOUD.lastError = "";
  saveCloud();
  return true;
}

async function cloudRefresh() {
  try {
    const res = await fetch(CLOUD.url.replace(/\/+$/, "") + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST", headers: cloudHeaders(false),
      body: JSON.stringify({ refresh_token: CLOUD.refreshToken })
    });
    if (!res.ok) return false;
    const j = await res.json();
    CLOUD.accessToken = j.access_token;
    CLOUD.refreshToken = j.refresh_token;
    saveCloud();
    return true;
  } catch (e) { return false; }
}

function cloudSignOut() {
  CLOUD.accessToken = ""; CLOUD.refreshToken = ""; CLOUD.userId = "";
  saveCloud();
}

/* ---------- merge ---------- */
function newer(a, b) {
  return (new Date(b || 0) > new Date(a || 0)) ? b : a;
}

/* merge two lists of records by a key, newest updatedAt wins */
function mergeById(localList, remoteList, keyOf) {
  const out = new Map();
  for (const r of (localList || [])) out.set(keyOf(r), r);
  for (const r of (remoteList || [])) {
    const k = keyOf(r);
    const mine = out.get(k);
    if (!mine) { out.set(k, r); continue; }
    const a = mine.updatedAt || mine.createdAt || "";
    const b = r.updatedAt || r.createdAt || "";
    out.set(k, (new Date(b) > new Date(a)) ? r : mine);
  }
  return [...out.values()];
}

/* merge a whole document. `remoteStamp` decides the single-value settings. */
function mergeDB(local, remote, remoteStamp, localStamp) {
  if (!remote) return local;
  const remoteWinsSettings = new Date(remoteStamp || 0) > new Date(localStamp || 0);
  const out = JSON.parse(JSON.stringify(local));

  out.tasks    = mergeById(local.tasks,    remote.tasks,    t => t.id);
  out.messages = mergeById(local.messages, remote.messages, m => m.id);
  out.waRules  = mergeById(local.waRules,  remote.waRules,  r => r.id);
  out.members  = mergeById(local.members,  remote.members,  m => (m.email || "").toLowerCase());

  // indicators: one value per source per day; a real reading beats a carried one
  const im = new Map();
  for (const r of (local.indicators || [])) im.set(r.key + "|" + r.date, r);
  for (const r of (remote.indicators || [])) {
    const k = r.key + "|" + r.date;
    const mine = im.get(k);
    if (!mine) { im.set(k, r); continue; }
    if (mine.carried && !r.carried) im.set(k, r);
  }
  out.indicators = [...im.values()];

  // categories: keep both sides
  out.categories = [...new Set([...(local.categories || []), ...(remote.categories || [])])];

  if (remoteWinsSettings) {
    out.company = remote.company || local.company;
    out.cfg = remote.cfg || local.cfg;
  }
  out.nextId = Math.max(local.nextId || 1, remote.nextId || 1);
  out.lastGenCheck = newer(local.lastGenCheck, remote.lastGenCheck);
  out.session = local.session;         // never take another device's login
  return out;
}

/* ---------- pull / push ---------- */
async function cloudPull() {
  const res = await cloudFetch("/rest/v1/finops_docs?select=doc,updated_at,device&limit=1", {
    method: "GET", headers: cloudHeaders(true)
  });
  if (!res.ok) throw new Error("Could not read from the cloud (HTTP " + res.status + ")");
  const rows = await res.json();
  return rows && rows.length ? rows[0] : null;
}

async function cloudPush(doc) {
  const row = {
    owner: CLOUD.userId,
    doc: doc,
    device: CLOUD.deviceId,
    updated_at: new Date().toISOString()
  };
  const res = await cloudFetch("/rest/v1/finops_docs", {
    method: "POST",
    headers: Object.assign(cloudHeaders(true), { "Prefer": "resolution=merge-duplicates,return=minimal" }),
    body: JSON.stringify(row)
  });
  if (!res.ok) {
    const t = await res.text().catch(() => "");
    throw new Error("Could not save to the cloud (HTTP " + res.status + ") " + t.slice(0, 120));
  }
  return true;
}

/* the whole round trip: pull, merge, save locally, push back */
async function cloudSync(silent) {
  if (!cloudReady()) return { ok: false, reason: "not signed in" };
  try {
    const remoteRow = await cloudPull();
    const localStamp = CLOUD.lastSync || "";
    if (remoteRow && remoteRow.doc) {
      const merged = mergeDB(DB, remoteRow.doc, remoteRow.updated_at, localStamp);
      DB = merged;
      saveDB();
    }
    await cloudPush(DB);
    CLOUD.lastSync = new Date().toISOString();
    CLOUD.lastError = "";
    saveCloud();
    if (!silent) toast("Synced", "ok");
    return { ok: true };
  } catch (e) {
    CLOUD.lastError = e.message || String(e);
    saveCloud();
    if (!silent) toast("Sync failed — " + CLOUD.lastError, "warn");
    return { ok: false, reason: CLOUD.lastError };
  }
}

/* sync quietly on open, when the tab regains focus, and every 5 minutes */
let cloudTimer = null;
function startCloudAuto() {
  if (cloudTimer) clearInterval(cloudTimer);
  if (!CLOUD.autoSync) return;
  cloudSync(true);
  cloudTimer = setInterval(() => { if (navigator.onLine) cloudSync(true); }, 5 * 60 * 1000);
  window.addEventListener("online", () => cloudSync(true));
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") cloudSync(true);
  });
}

</script>
<script>
/* ============================================================
   app.js — shell, navigation, routing (stage 1)
   ============================================================ */
"use strict";

const PAGES = [
  { id: "dashboard", label: "Dashboard", ico: "🏠", min: 1 },
  { id: "tasks", label: "Tasks", ico: "✅", min: 1 },
  { id: "followup", label: "Follow-up", ico: "🔔", min: 1 },
  { id: "proposals", label: "From email", ico: "📬", min: 1 },
  { id: "indicators", label: "Indicators", ico: "📈", min: 1 },
  { id: "mastersheet", label: "Master sheet", ico: "📊", min: 3 },
  { id: "team", label: "Team", ico: "👥", min: 1 },
  { id: "messages", label: "Messages", ico: "💬", min: 2 },
  { id: "warules", label: "WA rules", ico: "⚡", min: 2 },
  { id: "importexport", label: "Import/export", ico: "📥", min: 3 },
  { id: "settings", label: "Settings", ico: "⚙️", min: 3 }
];

// mobile bottom bar shows the first 4 allowed + "More"
let currentPage = "dashboard";

/* stable color per category — same category, same color everywhere */
const CAT_PALETTE = [200, 262, 330, 16, 42, 150, 105, 285, 355, 180, 225, 60];
function catHue(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return CAT_PALETTE[h % CAT_PALETTE.length];
}
function catChipStyle(name) {
  const hue = catHue(name);
  return `background:hsla(${hue},85%,55%,.16);color:hsl(${hue},80%,60%);`;
}
function catChipStyleStrong(name) {
  const hue = catHue(name);
  return `background:hsl(${hue},75%,45%);color:#fff;`;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- toast ---------- */
function toast(msg, kind) {
  const t = document.createElement("div");
  t.className = "toast " + (kind || "");
  t.textContent = msg;
  $("toast-root").appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

/* ---------- modal ---------- */
function openModal(html) {
  $("modal-root").innerHTML = `<div class="modal-backdrop" id="modal-bd">
    <div class="modal"><button class="modal-x" id="modal-x" title="Close" aria-label="Close">✕</button>${html}</div>
  </div>`;
  $("modal-x").addEventListener("click", closeModal);
  // deliberately NOT closing on an outside click — typed work must never be lost
}
function closeModal() { $("modal-root").innerHTML = ""; }

/* Escape closes only windows with nothing typed in them */
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const modal = document.querySelector("#modal-root .modal");
  if (!modal) return;
  if (!modal.querySelector("input, textarea, select")) closeModal();
});
function openConfirm(msg, onYes) {
  openModal(`
    <h3>Please confirm</h3>
    <p style="font-size:14px;color:var(--text-2);">${esc(msg)}</p>
    <div class="modal-actions">
      <button class="btn btn-danger" id="cf-yes">Yes, continue</button>
      <button class="btn" id="cf-no">Cancel</button>
    </div>`);
  $("cf-no").addEventListener("click", closeModal);
  $("cf-yes").addEventListener("click", () => { closeModal(); onYes(); });
}

/* ---------- theme / branding ---------- */
function applyTheme() {
  document.documentElement.dataset.theme = DB.cfg.theme || "dark";
}
function applyBranding() {
  const c = DB.company;
  $("brand-name").textContent = "FinOps";
  $("brand-company").textContent = c.name || "";
  $("brand-mark").innerHTML = c.logo ? `<img src="${c.logo}" alt="">` : "✓";
  document.title = (c.name ? c.name + " — " : "") + "FinOps Manager";
}

/* ---------- navigation ---------- */
function allowedPages(u) {
  return PAGES.filter(p => u.level >= p.min);
}

function renderNav() {
  const u = currentUser();
  if (!u) return;
  const pages = allowedPages(u);

  $("nav").innerHTML = pages.map(p =>
    `<button class="nav-item ${p.id === currentPage ? "active" : ""}" data-p="${p.id}">
      <span class="ico">${p.ico}</span>${p.label}</button>`).join("");
  $("nav").querySelectorAll(".nav-item").forEach(b =>
    b.addEventListener("click", () => route(b.dataset.p)));

  // mobile bottom bar: first 4 + more sheet
  const primary = pages.slice(0, 4);
  const rest = pages.slice(4);
  let bb = primary.map(p =>
    `<button class="bb-item ${p.id === currentPage ? "active" : ""}" data-p="${p.id}">
      <span class="ico">${p.ico}</span>${p.label}</button>`).join("");
  if (rest.length) {
    const restActive = rest.some(p => p.id === currentPage);
    bb += `<button class="bb-item ${restActive ? "active" : ""}" data-p="__more">
      <span class="ico">☰</span>More</button>`;
  }
  $("bottombar").innerHTML = `<div class="bottombar-inner">${bb}</div>`;
  $("bottombar").querySelectorAll(".bb-item").forEach(b =>
    b.addEventListener("click", () => {
      if (b.dataset.p === "__more") openMoreSheet(rest);
      else route(b.dataset.p);
    }));

  // user pill (sidebar) + topbar avatar (always visible, incl. mobile)
  $("user-avatar").textContent = initials(u);
  $("user-name").textContent = fullName(u);
  $("user-level").textContent = `L${u.level} · ${LEVEL_NAMES[u.level]}`;
  $("topbar-user").textContent = initials(u);
}

function openAccountSheet() {
  const u = currentUser();
  if (!u) return;
  openModal(`
    <div class="account-head">
      <span class="avatar">${initials(u)}</span>
      <div>
        <div class="account-name">${esc(fullName(u))}</div>
        <div class="account-mail">${esc(u.email)} · L${u.level} ${LEVEL_NAMES[u.level]}</div>
      </div>
    </div>
    <p class="card-sub">${esc(u.jobTitle || "")} ${u.phone ? "· " + esc(u.cc + " " + u.phone) : ""}</p>
    <div class="modal-actions" style="flex-direction:column;">
      <button class="btn" id="acc-profile">✎ Edit profile</button>
      <button class="btn btn-danger" id="acc-signout">⎋ Sign out</button>
    </div>`);
  $("acc-profile").addEventListener("click", () => { closeModal(); openProfileModal(); });
  $("acc-signout").addEventListener("click", () => { closeModal(); doSignOut(); });
}

function openMoreSheet(rest) {
  openModal(`
    <h3>More</h3>
    ${rest.map(p => `<button class="nav-item" data-p="${p.id}" style="width:100%;">
      <span class="ico">${p.ico}</span>${p.label}</button>`).join("")}
  `);
  $("modal-root").querySelectorAll(".nav-item").forEach(b =>
    b.addEventListener("click", () => { closeModal(); route(b.dataset.p); }));
}

/* ---------- routing ---------- */
function route(page) {
  const u = currentUser();
  if (!u) return showAuth();
  const def = PAGES.find(p => p.id === page);
  if (!def || u.level < def.min) page = "dashboard";
  currentPage = page;
  $("page-title").textContent = PAGES.find(p => p.id === page).label;
  renderNav();
  const c = $("page-container");
  c.innerHTML = "";
  switch (page) {
    case "settings": renderSettings(c); break;
    case "dashboard": renderDashboard(c); break;
    case "tasks": renderTasksPage(c); break;
    case "followup": renderFollowUp(c); break;
    case "proposals": renderProposals(c); break;
    case "indicators": renderIndicators(c); break;
    case "mastersheet": renderMasterSheet(c); break;
    case "team": renderTeam(c); break;
    case "messages": renderMessages(c); break;
    case "warules": renderWARules(c); break;
    case "importexport": renderImportExport(c); break;
  }
}

function renderStagePlaceholder(c, ico, title, sub) {
  c.innerHTML = `<div class="placeholder-page">
    <div class="big">${ico}</div>
    <p style="font-weight:700;">${esc(title)}</p>
    ${sub ? `<p style="font-size:13px;margin-top:6px;">${esc(sub)}</p>` : ""}
  </div>`;
}

/* ---------- enter app ---------- */
function enterApp() {
  $("auth-screen").classList.add("hidden");
  $("app-shell").classList.remove("hidden");
  applyBranding();
  runAutoGen();
  route("dashboard");
  // pull today's captured indicators, then paint the strip
  renderIndicatorStrip();
  loadIndicatorFile(false).then(n => {
    renderIndicatorStrip();
    if (currentPage === "indicators") route("indicators");
  });
  loadProposals(false).then(() => updateProposalBadge());
  if (cloudReady()) startCloudAuto();
}

/* ---------- boot ---------- */
document.addEventListener("DOMContentLoaded", () => {
  loadDB();
  loadCloud();
  applyTheme();
  wireAuth();
  $("add-task-btn").addEventListener("click", () => openTaskEdit(null));
  $("user-pill").addEventListener("click", openAccountSheet);
  $("topbar-user").addEventListener("click", openAccountSheet);
  if (currentUser()) enterApp();
  else showAuth();

  // installable + works with no signal
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
});

</script>
<script>
/* hosted build: no separate manifest/icon files, so build them at run time */
(function () {
