  `);

  const ruleState = { ...src.rule };
  let kindSel = src.kind || "regular";

  function paintKind() {
    $("tk-kindrow").querySelectorAll("[data-kind]").forEach(b =>
      b.classList.toggle("on", b.dataset.kind === kindSel));
    $("tk-kindnote").textContent = kindDef(kindSel).quick
      ? "Quick task — shows in the Quick tasks panel on the dashboard, not in the main lists."
      : "Regular work — shows in Overdue / Ongoing / Upcoming as usual.";
  }
  paintKind();
  $("tk-kindrow").querySelectorAll("[data-kind]").forEach(b => b.addEventListener("click", () => {
    kindSel = b.dataset.kind; paintKind();
  }));

  function drawRuleRow() {
    const type = $("tk-type").value, rep = $("tk-repeats").value;
    $("tk-repeats-wrap").style.display = type === "recurring" ? "" : "none";
    let html = "";
    if (type === "once") {
      html = `<div class="field"><label>Due date <b class="req">*</b></label><input type="date" id="tk-due" value="${src.dueDate || ""}"></div>
              <div class="field"><label>&nbsp;</label><p style="font-size:11.5px;color:var(--text-2);padding-top:10px;">Off-day dates shift to the next working day</p></div>`;
    } else if (rep === "weekly") {
      html = `<div class="field"><label>Weekday <b class="req">*</b></label><select id="tk-weekday">
        ${DB.company.workdays.map(d => `<option value="${d}" ${ruleState.weekday === d ? "selected" : ""}>${["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d]}</option>`).join("")}
      </select></div>`;
    } else if (rep === "monthly" || rep === "quarterly") {
      html = `<div class="field"><label>Day of month <b class="req">*</b></label><select id="tk-dom">
        ${Array.from({ length: 31 }, (_, i) => i + 1).map(d => `<option value="${d}" ${ruleState.dayOfMonth === d ? "selected" : ""}>${d}</option>`).join("")}
      </select></div>
      ${rep === "quarterly" ? `<div class="field"><label>&nbsp;</label><p style="font-size:11.5px;color:var(--text-2);padding-top:10px;">Due in the month after each quarter end</p></div>` : ""}`;
    } else if (rep === "annual") {
      html = `<div class="field"><label>Month <b class="req">*</b></label><select id="tk-month">
        ${MONTHS.map((m, i) => `<option value="${i + 1}" ${ruleState.month === i + 1 ? "selected" : ""}>${m}</option>`).join("")}
      </select></div>
      <div class="field"><label>Day <b class="req">*</b></label><select id="tk-day">
        ${Array.from({ length: 31 }, (_, i) => i + 1).map(d => `<option value="${d}" ${ruleState.day === d ? "selected" : ""}>${d}</option>`).join("")}
      </select></div>`;
    } else {
      html = `<div class="field"><label>&nbsp;</label><p style="font-size:11.5px;color:var(--text-2);padding-top:10px;">Every working day automatically</p></div>`;
    }
    $("tk-rule-row").innerHTML = html;
  }
  drawRuleRow();
  $("tk-type").addEventListener("change", () => { drawRuleRow(); drawSubs(); });
  $("tk-repeats").addEventListener("change", () => { drawRuleRow(); drawSubs(); });

  function collectRule() {
    const type = $("tk-type").value, rep = $("tk-repeats").value;
    if (type === "once") return { rule: {}, repeats: "once" };
    if (rep === "weekly") return { rule: { weekday: +$("tk-weekday").value }, repeats: rep };
    if (rep === "monthly" || rep === "quarterly") return { rule: { dayOfMonth: +$("tk-dom").value }, repeats: rep };
    if (rep === "annual") return { rule: { month: +$("tk-month").value, day: +$("tk-day").value }, repeats: rep };
    return { rule: {}, repeats: "daily" };
  }
  function mainDuePreview() {
    const type = $("tk-type").value;
    if (type === "once") return $("tk-due") ? ($("tk-due").value || null) : null;
    const { rule, repeats } = collectRule();
    const p = currentPeriod(repeats, rule);
    return p ? p.due : null;
  }

  /* ---- subtask rows ---- */
  function drawSubs() {
    const parentRep = $("tk-type").value === "once" ? "once" : $("tk-repeats").value;
    const opts = subRepeatOptions(parentRep);
    $("tk-subcount").textContent = EDIT_SUBS.length;
    $("tk-subs").innerHTML = EDIT_SUBS.map((s, i) => {
      if (!opts.includes(s.repeats)) s.repeats = opts[0];
      if (!s.open) {
        return `<div class="sub-row" data-i="${i}" style="cursor:pointer;">
          <span style="color:var(--text-2);">▸</span>
          <div style="flex:1;"><b style="font-size:13.5px;">${esc(s.title || "(untitled subtask)")}</b>
          <span style="font-size:11.5px;color:var(--text-2);"> · ${esc(memberName(s.responsible))} · ${SUB_REPEAT_LABELS[s.repeats]}${s.repeats === "withmain" || s.repeats === "once" ? " · due " + shortDate(s.dueDate) : ""}</span></div>
          <button class="btn btn-ghost btn-sm" data-del="${i}" style="color:var(--red);">✕</button>
        </div>`;
      }
      const showDue = s.repeats === "withmain" || s.repeats === "once";
      const showWeekday = s.repeats === "weekly";
      const showDom = s.repeats === "monthly" || s.repeats === "quarterly";
      const showAnnual = s.repeats === "annual";
      return `<div class="sub-edit" data-i="${i}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <b style="font-size:13px;">▾ Subtask ${i + 1}</b>
          <button class="btn btn-ghost btn-sm" data-del="${i}" style="color:var(--red);">✕ Remove</button>
        </div>
        <div class="field"><label>Title <b class="req">*</b></label><input data-f="title" data-i="${i}" value="${esc(s.title)}"></div>
        <div class="field"><label>Description</label><textarea data-f="description" data-i="${i}" rows="2">${esc(s.description || "")}</textarea></div>
        <div class="form-grid-2">
          <div class="field"><label>Responsible <b class="req">*</b></label>
            <select data-f="responsible" data-i="${i}">${members.map(m => `<option value="${esc(m.email)}" ${m.email === s.responsible ? "selected" : ""}>${esc(fullName(m))}</option>`).join("")}</select></div>
          <div class="field"><label>Repeats</label>
            <select data-f="repeats" data-i="${i}">${opts.map(o => `<option value="${o}" ${s.repeats === o ? "selected" : ""}>${SUB_REPEAT_LABELS[o]}</option>`).join("")}</select></div>
        </div>
        <div class="form-grid-2">
          ${showDue ? `<div class="field"><label>Due date <b class="req">*</b></label><input type="date" data-f="dueDate" data-i="${i}" value="${s.dueDate || ""}"></div>
            <div class="field"><label>&nbsp;</label><p style="font-size:11px;color:var(--text-2);padding-top:8px;">🔒 On or before the main task due date</p></div>` : ""}
          ${showWeekday ? `<div class="field"><label>Weekday</label><select data-f="weekday" data-i="${i}">
            ${DB.company.workdays.map(d => `<option value="${d}" ${s.rule.weekday === d ? "selected" : ""}>${["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d]}</option>`).join("")}</select></div>
            <div class="field"><label>&nbsp;</label><p style="font-size:11px;color:var(--text-2);padding-top:8px;">Repeats until the main due date</p></div>` : ""}
          ${showDom ? `<div class="field"><label>Day of month</label><select data-f="dayOfMonth" data-i="${i}">
            ${Array.from({ length: 31 }, (_, x) => x + 1).map(d => `<option value="${d}" ${s.rule.dayOfMonth === d ? "selected" : ""}>${d}</option>`).join("")}</select></div>
            <div class="field"><label>&nbsp;</label><p style="font-size:11px;color:var(--text-2);padding-top:8px;">${s.repeats === "quarterly" ? "Due in the month after each quarter end" : "Repeats until the main due date"}</p></div>` : ""}
          ${showAnnual ? `<div class="field"><label>Month</label><select data-f="month" data-i="${i}">
            ${MONTHS.map((m, x) => `<option value="${x + 1}" ${s.rule.month === x + 1 ? "selected" : ""}>${m}</option>`).join("")}</select></div>
            <div class="field"><label>Day</label><select data-f="day" data-i="${i}">
            ${Array.from({ length: 31 }, (_, x) => x + 1).map(d => `<option value="${d}" ${s.rule.day === d ? "selected" : ""}>${d}</option>`).join("")}</select></div>` : ""}
          ${!showDue && !showWeekday && !showDom && !showAnnual ? `<div class="field"><label>&nbsp;</label><p style="font-size:11px;color:var(--text-2);padding-top:8px;">Every working day until the main due date</p></div>` : ""}
        </div>
      </div>`;
    }).join("") || `<p style="font-size:12.5px;color:var(--text-2);">No subtasks — this is a simple main task.</p>`;

    // wire rows
    $("tk-subs").querySelectorAll(".sub-row").forEach(el => el.addEventListener("click", e => {
      if (e.target.dataset.del !== undefined && e.target.dataset.del !== "") return;
      EDIT_SUBS[+el.dataset.i].open = true; drawSubs();
    }));
    $("tk-subs").querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", e => {
      e.stopPropagation();
      EDIT_SUBS.splice(+b.dataset.del, 1); drawSubs();
    }));
    $("tk-subs").querySelectorAll("[data-f]").forEach(inp => inp.addEventListener("change", () => {
      const s = EDIT_SUBS[+inp.dataset.i], f = inp.dataset.f;
      if (f === "weekday") s.rule.weekday = +inp.value;
      else if (f === "dayOfMonth") s.rule.dayOfMonth = +inp.value;
      else if (f === "month") s.rule.month = +inp.value;
      else if (f === "day") s.rule.day = +inp.value;
      else if (f === "repeats") { s.repeats = inp.value; drawSubs(); }
      else s[f] = inp.value;
    }));
  }
  drawSubs();

  $("tk-addsub").addEventListener("click", () => {
    const parentRep = $("tk-type").value === "once" ? "once" : $("tk-repeats").value;
    const due = mainDuePreview() || shiftFwdWork(todayStr());
    EDIT_SUBS.push({
      instId: null, tplId: null, title: "", description: "", responsible: u.email,
      repeats: subRepeatOptions(parentRep)[0], rule: {}, dueDate: due, open: true
    });
    drawSubs();
  });

  $("tk-cancel").addEventListener("click", closeModal);
  $("tk-save").addEventListener("click", () => saveTaskForm(t));

  function saveTaskForm(existing) {
    const err = $("tk-err");
    err.textContent = "";
    const title = $("tk-title").value.trim();
    if (!title) return err.textContent = "Task title is required.";
    const type = $("tk-type").value;
    const { rule, repeats } = collectRule();
    let due = null;
    if (type === "once") {
      due = $("tk-due").value;
      if (!due) return err.textContent = "Due date is required for a one-time task.";
      due = shiftFwdWork(due);
    } else {
      const p = currentPeriod(repeats, rule);
      due = p ? p.due : null;
    }
    // validate subs
    for (const s of EDIT_SUBS) {
      if (!s.title.trim()) return err.textContent = "Every subtask needs a title.";
      if ((s.repeats === "withmain" || s.repeats === "once")) {
        if (!s.dueDate) return err.textContent = `Subtask "${s.title}" needs a due date.`;
        s.dueDate = shiftBackWork(s.dueDate) <= s.dueDate ? s.dueDate : s.dueDate;
        if (due && s.dueDate > due) return err.textContent = `Subtask "${s.title}" is due after the main task (${niceDate(due)}).`;
      }
    }
    const uNow = currentUser();

    if (!existing) {
      if (type === "recurring") {
        const tpl = {
          id: newId(), type: "main", template: true, parentId: null,
          title, description: $("tk-desc").value.trim(), category: $("tk-cat").value,
          kind: kindSel,
          priority: $("tk-pri").value, taskType: "recurring", repeats, rule,
          dueDate: null, responsible: $("tk-resp").value, assignedBy: uNow.email,
          status: "todo", delayNote: "", linked: [], sourceId: null, periodCode: null,
          archived: false, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
          completedAt: null, result: null
        };
        DB.tasks.push(tpl);
        for (const s of EDIT_SUBS) {
          const offset = s.repeats === "withmain" && due ? Math.round((parseD(due) - parseD(s.dueDate)) / 86400000) : 0;
          DB.tasks.push({
            id: newId(), type: "sub", template: true, parentId: tpl.id,
            title: s.title.trim(), description: (s.description || "").trim(), category: tpl.category,
            priority: "normal", taskType: "recurring", repeats: s.repeats, rule: { ...s.rule },
            offsetDays: Math.max(0, offset), dueDate: null,
            responsible: s.responsible, assignedBy: uNow.email,
            status: "todo", delayNote: "", linked: [], sourceId: null, periodCode: null,
            archived: false, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
            completedAt: null, result: null
          });
        }
        DB.lastGenCheck = ""; // force generation now
        saveDB();
        runAutoGen();
      } else {
        const p = { year: parseD(due).getFullYear(), month: MONTHS[parseD(due).getMonth()] };
        const inst = {
          id: newId(), type: "main", template: false, parentId: null,
          title, description: $("tk-desc").value.trim(), category: $("tk-cat").value,
          kind: kindSel,
          priority: $("tk-pri").value, taskType: "once", repeats: "once", rule: {},
          dueDate: due, responsible: $("tk-resp").value, assignedBy: uNow.email,
          status: "todo", delayNote: "", linked: [], sourceId: null,
          periodCode: p.month + "/" + p.year, year: p.year, month: p.month,
          archived: false, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
          completedAt: null, result: null
        };
        DB.tasks.push(inst);
        for (const s of EDIT_SUBS) {
          if (s.repeats === "once") {
            DB.tasks.push(makeSubInstance({ ...s, title: s.title.trim(), rule: { ...s.rule }, assignedBy: uNow.email, priority: "normal" }, inst, s.dueDate, "One-time"));
          } else {
            DB.tasks.push({
              id: newId(), type: "sub", template: true, parentId: inst.id,
              title: s.title.trim(), description: (s.description || "").trim(), category: inst.category,
              priority: "normal", taskType: "once", repeats: s.repeats, rule: { ...s.rule },
              offsetDays: 0, dueDate: null, responsible: s.responsible, assignedBy: uNow.email,
              status: "todo", delayNote: "", linked: [], sourceId: null, periodCode: null,
              archived: false, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
              completedAt: null, result: null
            });
          }
        }
        DB.lastGenCheck = "";
        saveDB();
        runAutoGen();
      }
      toast("Task created", "ok");
    } else {
      // update instance
      existing.title = title;
      existing.description = $("tk-desc").value.trim();
      existing.category = $("tk-cat").value;
      existing.kind = kindSel;
      existing.priority = $("tk-pri").value;
      existing.responsible = $("tk-resp").value;
      if (existing.taskType === "once" && type === "once") existing.dueDate = due;
      existing.updatedAt = new Date().toISOString();
      // update template for future periods
      const tpl = existing.sourceId ? getTask(existing.sourceId) : null;
      if (tpl) {
        tpl.title = title; tpl.description = existing.description;
        tpl.category = existing.category; tpl.priority = existing.priority;
        tpl.kind = kindSel;
        tpl.responsible = existing.responsible;
        tpl.repeats = repeats; tpl.rule = rule;
        tpl.updatedAt = new Date().toISOString();
      }
      // subs: update existing, add new, remove deleted
      const keptInstIds = EDIT_SUBS.filter(s => s.instId).map(s => s.instId);
      for (const s of subsOf(existing)) {
        if (!keptInstIds.includes(s.id)) {
          if (s.sourceId) DB.tasks = DB.tasks.filter(x => x.id !== s.sourceId);
          DB.tasks = DB.tasks.filter(x => x.id !== s.id);
        }
      }
      for (const s of EDIT_SUBS) {
        if (s.instId) {
          const inst = getTask(s.instId);
          if (inst) {
            inst.title = s.title.trim(); inst.description = (s.description || "").trim();
            inst.responsible = s.responsible; inst.category = existing.category;
            if (s.repeats === "withmain" || s.repeats === "once") inst.dueDate = s.dueDate;
            inst.updatedAt = new Date().toISOString();
            const stpl = inst.sourceId ? getTask(inst.sourceId) : null;
            if (stpl) {
              stpl.title = inst.title; stpl.description = inst.description;
              stpl.responsible = inst.responsible; stpl.repeats = s.repeats; stpl.rule = { ...s.rule };
              if (s.repeats === "withmain" && existing.dueDate)
                stpl.offsetDays = Math.max(0, Math.round((parseD(existing.dueDate) - parseD(s.dueDate)) / 86400000));
            }
          }
        } else {
          // new sub added during edit
          const owner = tpl || existing;
          if (s.repeats === "withmain" || s.repeats === "once") {
            DB.tasks.push(makeSubInstance({ ...s, title: s.title.trim(), rule: { ...s.rule }, assignedBy: uNow.email, priority: "normal" }, existing, s.dueDate, existing.periodCode + "·added"));
            if (tpl) {
              DB.tasks.push({
                id: newId(), type: "sub", template: true, parentId: tpl.id,
                title: s.title.trim(), description: (s.description || "").trim(), category: tpl.category,
                priority: "normal", taskType: "recurring", repeats: "withmain", rule: {},
                offsetDays: Math.max(0, Math.round((parseD(existing.dueDate) - parseD(s.dueDate)) / 86400000)),
                dueDate: null, responsible: s.responsible, assignedBy: uNow.email,
                status: "todo", delayNote: "", linked: [], sourceId: null, periodCode: null,
                archived: false, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
                completedAt: null, result: null
              });
            }
          } else {
            DB.tasks.push({
              id: newId(), type: "sub", template: true, parentId: (tpl || existing).id,
              title: s.title.trim(), description: (s.description || "").trim(), category: existing.category,
              priority: "normal", taskType: existing.taskType, repeats: s.repeats, rule: { ...s.rule },
              offsetDays: 0, dueDate: null, responsible: s.responsible, assignedBy: uNow.email,
              status: "todo", delayNote: "", linked: [], sourceId: null, periodCode: null,
              archived: false, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
              completedAt: null, result: null
            });
            DB.lastGenCheck = "";
          }
        }
      }
      saveDB();
      runAutoGen();
      toast("Task saved", "ok");
    }
    closeModal();
    refreshCurrentPage();
  }
}

function refreshCurrentPage() {
  route(currentPage);
}

</script>
<script>
/* ============================================================
   dashboard.js — stage 3: dashboard with stat cards, team
   overdue, my today, upcoming, member filter, charts view
   ============================================================ */
"use strict";

let DASH = { member: "all", view: "list" };

/* all task instances (main + sub) the user may see */
function myVisibleInstances() {
  const u = currentUser();
  return DB.tasks.filter(t => !t.template && canSeeTask(u, t));
}
function dashFiltered() {
  let list = myVisibleInstances();
  if (DASH.member !== "all") list = list.filter(t => t.responsible === DASH.member);
  return list;
}

function renderDashboard(c) {
  runAutoGen();
  const u = currentUser();
  const everything = dashFiltered();
  // quick tasks (calls, messages, emails, meetings) live in their own panel only
  const all = everything.filter(t => !isQuick(t));
  const quick = everything.filter(t => isQuick(t) && t.status !== "done")
    .sort((a, b) => daysToDue(a.dueDate) - daysToDue(b.dueDate));
  const quickDoneToday = everything.filter(t => isQuick(t) && t.status === "done" &&
    t.completedAt && t.completedAt.slice(0, 10) === todayStr());
  const overdue = all.filter(t => isOverdue(t)).sort((a, b) => daysToDue(a.dueDate) - daysToDue(b.dueDate));
  const ongoing = all.filter(t => t.status !== "done" && !isOverdue(t) && taskState(t).cls === "yellow")
    .sort((a, b) => a.dueDate < b.dueDate ? -1 : 1);
  const upcoming = all.filter(t => t.status !== "done" && !isOverdue(t) && taskState(t).cls === "gray")
    .sort((a, b) => a.dueDate < b.dueDate ? -1 : 1).slice(0, 6);
  const now = new Date();
  const doneEarly = all.filter(t => t.status === "done" && t.result === "Early" &&
    t.completedAt && new Date(t.completedAt).getMonth() === now.getMonth() && new Date(t.completedAt).getFullYear() === now.getFullYear());

  const myToday = ongoing.filter(t => t.responsible === u.email);
  const otherOngoing = ongoing.filter(t => t.responsible !== u.email);

  const greet = now.getHours() < 12 ? "Good morning" : now.getHours() < 17 ? "Good afternoon" : "Good evening";
  const members = DB.members.filter(m => m.registered);

  c.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
      <div>
        <div style="font-size:17px;font-weight:800;">${greet}, ${esc(u.firstName)} 👋</div>
        <div style="font-size:12.5px;color:var(--text-2);">${now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}${DB.company.name ? " · " + esc(DB.company.name) : ""}
          · <span title="Working hours">${isWorkingNow() ? "🟢" : "⚪"} ${esc(workingHoursLabel())}</span></div>
      </div>
      <div style="display:flex;gap:8px;">
        <select id="dash-member" style="width:auto;">
          <option value="all">👥 All members</option>
          ${members.map(m => `<option value="${esc(m.email)}" ${DASH.member === m.email ? "selected" : ""}>${esc(fullName(m))}</option>`).join("")}
        </select>
        <button class="btn btn-sm ${DASH.view === "charts" ? "btn-primary" : ""}" id="dash-view">📊 ${DASH.view === "charts" ? "List" : "Charts"}</button>
      </div>
    </div>

    <div class="stat-grid">
      <button class="stat-card" data-go="overdue"><span class="stat-label st-red">Overdue</span><span class="stat-num st-red">${overdue.length}</span></button>
      <button class="stat-card" data-go="ongoing"><span class="stat-label st-yellow">Ongoing</span><span class="stat-num st-yellow">${ongoing.length}</span></button>
      <button class="stat-card" data-go="upcoming"><span class="stat-label">Upcoming</span><span class="stat-num">${upcoming.length}</span></button>
      <button class="stat-card" data-go="done"><span class="stat-label st-green">Done early · ${MONTHS[now.getMonth()]}</span><span class="stat-num st-green">${doneEarly.length}</span></button>
    </div>

    <div id="dash-manual"></div>
    <div class="dash-split">
      <div id="dash-body"></div>
      <div id="dash-quick"></div>
    </div>
  `;

  renderManualPrompt($("dash-manual"));
  renderQuickPanel($("dash-quick"), quick, quickDoneToday, c);

  $("dash-member").addEventListener("change", e => { DASH.member = e.target.value; renderDashboard(c); });
  $("dash-view").addEventListener("click", () => { DASH.view = DASH.view === "list" ? "charts" : "list"; renderDashboard(c); });

  const body = $("dash-body");
  if (DASH.view === "charts") {
    body.innerHTML = renderDashCharts(everything);
    body.querySelectorAll("[data-perf]").forEach(b => b.addEventListener("click", () => {
      window.__perfPeriod = b.dataset.perf; renderDashboard(c);
    }));
    body.querySelectorAll("[data-scope]").forEach(b => b.addEventListener("click", () => {
      window.__perfScope = b.dataset.scope; renderDashboard(c);
    }));
  } else {
    body.innerHTML = `
      <div id="sec-overdue">
        <p class="sec-title st-red">🔴 Overdue — whole team</p>
        ${overdue.length ? dashSection(overdue) : `<p class="sec-empty">Nothing overdue — all clear 🎉</p>`}
      </div>
      <div id="sec-ongoing" style="margin-top:18px;">
        <p class="sec-title st-yellow">🟡 ${DASH.member === "all" ? "My tasks today" : "Ongoing"}</p>
        ${(DASH.member === "all" ? myToday : ongoing).length
          ? dashSection(DASH.member === "all" ? myToday : ongoing)
          : `<p class="sec-empty">Nothing in the window right now.</p>`}
        ${DASH.member === "all" && otherOngoing.length ? `
          <p class="sec-title" style="margin-top:14px;color:var(--text-2);">Team ongoing</p>
          ${dashSection(otherOngoing)}` : ""}
      </div>
      <div id="sec-upcoming" style="margin-top:18px;">
        <p class="sec-title" style="color:var(--text-2);">⏳ Upcoming</p>
        ${upcoming.length ? dashSection(upcoming) : `<p class="sec-empty">Nothing approaching yet.</p>`}
      </div>`;
  }

  c.querySelectorAll("[data-open]").forEach(el =>
    el.addEventListener("click", () => openTaskView(+el.dataset.open)));
  c.querySelectorAll("[data-opensub]").forEach(el => el.addEventListener("click", e => {
    e.stopPropagation(); openTaskView(+el.dataset.opensub);
  }));
  c.querySelectorAll("[data-expand]").forEach(el => el.addEventListener("click", e => {
    e.stopPropagation();
    TF.expanded[+el.dataset.expand] = TF.expanded[+el.dataset.expand] === false;
    renderDashboard(c);
  }));
  c.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => {
    const target = { overdue: "sec-overdue", ongoing: "sec-ongoing", upcoming: "sec-upcoming" }[b.dataset.go];
    if (b.dataset.go === "done") { window.__tasksTab = "arch"; route("tasks"); return; }
    if (DASH.view === "charts") { DASH.view = "list"; renderDashboard(c); }
    const el = document.getElementById(target);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }));
}

/* ---------- Quick tasks panel (calls, messages, emails, meetings) ---------- */
function renderQuickPanel(host, quick, doneToday, page) {
  if (!host) return;
  const late = quick.filter(isOverdue).length;
  const dueToday = quick.filter(t => daysToDue(t.dueDate) === 0).length;

  host.innerHTML = `
    <div class="card quick-card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;">
        <b style="font-size:13.5px;">⚡ Quick tasks</b>
        <span style="display:flex;gap:5px;align-items:center;">
          ${late ? `<span class="pill pill-red">${late} late</span>` : ""}
          ${dueToday ? `<span class="pill pill-yellow">${dueToday} today</span>` : ""}
          <span class="pill pill-gray">${quick.length} to do</span>
        </span>
      </div>
      ${quick.length ? quick.map(t => {
        const st = taskState(t);
        const k = kindDef(t.kind);
        return `<div class="quick-row" data-qopen="${t.id}">
          <button class="quick-box" data-qdone="${t.id}" title="Mark done"></button>
          <span class="quick-ico">${k.ico}</span>
          <span class="quick-text">${esc(t.title)}</span>
          <span class="quick-when st-${st.cls}">${isOverdue(t) ? Math.abs(daysToDue(t.dueDate)) + "d late" : daysToDue(t.dueDate) === 0 ? "today" : shortDate(t.dueDate)}</span>
        </div>`;
      }).join("") : `<p style="font-size:12.5px;color:var(--text-2);margin:2px 0 6px;">Nothing quick pending 🎉</p>`}

      ${doneToday.length ? `<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:7px;">
        ${doneToday.map(t => `<div class="quick-row quick-done" data-qopen="${t.id}">
          <span class="quick-box on">✓</span>
          <span class="quick-ico">${kindDef(t.kind).ico}</span>
          <span class="quick-text">${esc(t.title)}</span>
          <span class="quick-when st-green">done</span>
        </div>`).join("")}
      </div>` : ""}

      <button class="btn btn-sm btn-block" id="quick-add" style="margin-top:10px;">+ Quick task</button>
    </div>`;

  host.querySelectorAll("[data-qdone]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const t = getTask(+b.dataset.qdone);
    if (!t) return;
    const err = trySetStatus(t, "done");
    if (err) { toast(err, "err"); return openTaskView(t.id); }
    toast("Done · " + t.result.toLowerCase(), "ok");
    renderDashboard(page);
  }));
  host.querySelectorAll("[data-qopen]").forEach(el => el.addEventListener("click", e => {
    if (e.target.closest("[data-qdone]")) return;
    openTaskView(+el.dataset.qopen);
  }));
  $("quick-add").addEventListener("click", () => openTaskEdit(null, "call"));
}

/* main tasks render as the full card (with subtask preview lines); subs whose
   parent is already shown in the same section are skipped to avoid duplicates */
function dashSection(list) {
  const mainIds = new Set(list.filter(t => t.type === "main").map(t => t.id));
  return list.filter(t => !(t.type === "sub" && mainIds.has(t.parentId)))
    .map(t => t.type === "main" ? taskRow(t) : dashRow(t)).join("");
}
function dashRow(t) {
  const st = taskState(t);
  const parent = t.type === "sub" ? getTask(t.parentId) : null;
  return `<div class="task-row tr-${st.cls}" data-open="${t.id}">
    <div class="task-row-main">
      <div class="task-row-title">${esc(t.title)}
        ${parent ? `<span class="pill pill-gray">↰ ${esc(parent.title)}</span>` : ""}
        <span class="pill" style="${catChipStyle(t.category)}">${esc(t.category)}</span>
        ${t.priority === "urgent" ? priBadge(t.priority) : ""}
      </div>
      <div class="task-row-sub">By ${esc(nameOrMe(t.assignedBy))} → ${esc(nameOrMe(t.responsible))} · ${repeatsLabel(t)}
        ${t.delayNote ? " · delay: " + esc(t.delayNote) : (isOverdue(t) && !t.delayNote ? ` · <span style="color:var(--red);">no delay note yet</span>` : "")}
      </div>
    </div>
    <div class="task-row-state st-${st.cls}">${st.label}<br><span>${shortDate(t.dueDate)}</span></div>
  </div>`;
}

/* ---------- charts view (pure CSS bars) ---------- */
function renderDashCharts(all) {
  const members = DB.members.filter(m => m.registered);
  // scope toggle: regular work / quick tasks / both
  const scope = window.__perfScope || "regular";
  const inScope = (t) => scope === "all" ? true : scope === "quick" ? isQuick(t) : !isQuick(t);
  const active = all.filter(t => t.status !== "done" && inScope(t));
  const arch = DB.tasks.filter(t => !t.template && t.status === "done" && inScope(t));

  // status overview
  const counts = {
    Overdue: active.filter(isOverdue).length,
    Ongoing: active.filter(t => !isOverdue(t) && taskState(t).cls === "yellow").length,
    Upcoming: active.filter(t => !isOverdue(t) && taskState(t).cls === "gray").length,
    "Done (archived)": arch.length
  };
  const colors = { Overdue: "var(--red)", Ongoing: "var(--yellow)", Upcoming: "var(--text-2)", "Done (archived)": "var(--green)" };

  // per-member on-time % for selected period
  const period = window.__perfPeriod || "year";
  const from = perfFrom(period);
  const perf = members.map(m => {
    const done = arch.filter(t => t.responsible === m.email && t.completedAt && new Date(t.completedAt) >= from);
    const onTime = done.filter(t => t.result !== "Late").length;
    return { name: fullName(m), total: done.length, pct: done.length ? Math.round(onTime / done.length * 100) : null };
  });

  // per-category active load
  const cats = {};
  for (const t of active.filter(t => t.type === "main")) cats[t.category] = (cats[t.category] || 0) + 1;

  return `
    <div class="card">
      <h3>Status overview</h3>
      ${barRows(Object.entries(counts).map(([k, v]) => ({ label: k, val: v, color: colors[k] })))}
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
        <h3 style="margin:0;">On-time performance</h3>
        <div style="display:flex;gap:6px;">
          ${["week", "month", "quarter", "year"].map(p =>
            `<button class="btn btn-sm ${period === p ? "btn-primary" : ""}" data-perf="${p}">${p[0].toUpperCase() + p.slice(1)}</button>`).join("")}
        </div>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">
        ${[["regular", "📄 Regular work"], ["quick", "⚡ Quick tasks"], ["all", "Both together"]].map(([v, l]) =>
          `<button class="btn btn-sm ${scope === v ? "btn-primary" : ""}" data-scope="${v}">${l}</button>`).join("")}
      </div>
      ${perf.map(p => `
        <div style="margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
            <b>${esc(p.name)}</b>
            <span style="color:var(--text-2);">${p.pct === null ? "no completed tasks" : p.pct + "% on time · " + p.total + " done"}</span>
          </div>
          <div class="mini-bar" style="height:8px;"><div style="width:${p.pct ?? 0}%;background:${p.pct === null ? "var(--border)" : p.pct >= 90 ? "var(--green)" : p.pct >= 70 ? "var(--yellow)" : "var(--red)"};"></div></div>
        </div>`).join("")}
    </div>
    <div class="card">
      <h3>Active main tasks by category</h3>
      ${Object.keys(cats).length ? barRows(Object.entries(cats).map(([k, v]) => ({ label: k, val: v, color: `hsl(${catHue(k)},75%,50%)` }))) : `<p class="sec-empty">No active tasks.</p>`}
    </div>`;
}
function perfFrom(period) {
  const now = new Date();
  if (period === "week") { const d = new Date(now); d.setDate(d.getDate() - 7); return d; }
  if (period === "month") return new Date(now.getFullYear(), now.getMonth(), 1);
  if (period === "quarter") return new Date(now.getFullYear(), Math.floor(now.getMonth() / 3) * 3, 1);
  return new Date(now.getFullYear(), 0, 1);
}
function barRows(rows) {
  const max = Math.max(1, ...rows.map(r => r.val));
  return rows.map(r => `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
      <span style="width:130px;font-size:12.5px;color:var(--text-2);flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(r.label)}</span>
      <div style="flex:1;" class="mini-bar"><div style="width:${Math.round(r.val / max * 100)}%;background:${r.color};"></div></div>
      <b style="width:30px;text-align:right;font-size:13px;">${r.val}</b>
    </div>`).join("");
}

</script>
<script>
/* ============================================================
   followup.js — stage 4: overdue chasing page with WhatsApp
   reminders grouped by member + reminder history
   ============================================================ */
"use strict";

let FU = { member: "all" };

function overdueVisible() {
  const u = currentUser();
  let list = DB.tasks.filter(t => !t.template && canSeeTask(u, t) && isOverdue(t));
  if (FU.member !== "all") list = list.filter(t => t.responsible === FU.member);
  return list.sort((a, b) => daysToDue(a.dueDate) - daysToDue(b.dueDate));
}

function waPhone(m) {
  return (m.cc || "").replace("+", "") + (m.phone || "");
}
function reminderText(m, items) {
  const lines = items.map((t, i) => {
    const days = Math.abs(daysToDue(t.dueDate));
    const parent = t.type === "sub" ? getTask(t.parentId) : null;
    return `${i + 1}) ${t.title}${parent ? " (part of " + parent.title + ")" : ""} — due ${niceDate(t.dueDate)}, now ${days} day${days > 1 ? "s" : ""} overdue${t.delayNote ? ". Your note: " + t.delayNote : ""}`;
  });
  return `Hi ${m.firstName}, a reminder about your overdue task${items.length > 1 ? "s" : ""}:\n${lines.join("\n")}\nPlease update the app today. Thanks, ${fullName(currentUser())}`;
}
function logReminder(m, items, body) {
  DB.messages.push({
    id: newId(), type: "wa", toEmail: m.email, subject: "Overdue reminder",
    body, taskIds: items.map(t => t.id), linkedTaskId: items[0] ? items[0].id : null,
    createdAt: new Date().toISOString()
  });
  saveDB();
}
/* ask before messaging the team outside office hours */
function confirmOutsideHours(what, onYes) {
  if (isWorkingNow()) return onYes();
  const now = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  openConfirm(`It is ${now} — outside working hours (${workingHoursLabel()}). ${what} anyway?`, onYes);
}

function sendWaReminder(email) {
  const m = getMember(email);
  if (!m) return;
  const items = overdueVisible().filter(t => t.responsible === email);
  if (!items.length) return toast("Nothing overdue for " + m.firstName, "ok");
  if (!m.phone) return toast(m.firstName + " has no mobile number in their profile", "err");
  const body = reminderText(m, items);
  logReminder(m, items, body);
  window.open("https://wa.me/" + waPhone(m) + "?text=" + encodeURIComponent(body), "_blank");
  refreshCurrentPage();
}

function renderFollowUp(c) {
  runAutoGen();
  const u = currentUser();
  const list = overdueVisible();
  const withNote = list.filter(t => t.delayNote).length;
  const oldest = list.length ? Math.abs(daysToDue(list[0].dueDate)) : 0;
  const byMember = {};
  for (const t of list) (byMember[t.responsible] = byMember[t.responsible] || []).push(t);
  const members = DB.members.filter(m => m.registered);
  const history = DB.messages.filter(x => x.type === "wa").sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 15);

  c.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;">
      <div style="display:flex;gap:8px;">
        <select id="fu-member" style="width:auto;">
          <option value="all">Member: All</option>
          ${members.map(m => `<option value="${esc(m.email)}" ${FU.member === m.email ? "selected" : ""}>${esc(fullName(m))}</option>`).join("")}
        </select>
      </div>
      ${list.length ? `<button class="btn btn-primary btn-sm" id="fu-remindall">💬 Remind all (${Object.keys(byMember).length})</button>` : ""}
    </div>

    <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
      <div class="stat-card" style="cursor:default;"><span class="stat-label st-red">Overdue items</span><span class="stat-num st-red">${list.length}</span></div>
      <div class="stat-card" style="cursor:default;"><span class="stat-label">Oldest overdue</span><span class="stat-num">${oldest} day${oldest === 1 ? "" : "s"}</span></div>
      <div class="stat-card" style="cursor:default;"><span class="stat-label">With delay note</span><span class="stat-num">${withNote} of ${list.length}</span></div>
    </div>

    ${!list.length ? `<div class="placeholder-page"><div class="big">🎉</div><p style="font-weight:700;color:var(--green);">Nothing overdue — all clear</p></div>` : ""}

    ${Object.entries(byMember).map(([email, items]) => {
      const m = getMember(email);
      return `
      <div style="display:flex;align-items:center;gap:9px;margin:16px 0 8px;">
        <span class="avatar" style="width:28px;height:28px;font-size:11px;">${initials(m)}</span>
        <b style="font-size:13.5px;">${esc(m ? fullName(m) : email)}</b>
        <span class="st-red" style="font-size:12px;font-weight:700;">· ${items.length} overdue</span>
        <button class="btn btn-sm" data-remind="${esc(email)}" style="margin-left:auto;">💬 Remind</button>
      </div>
      ${items.map(t => {
        const parent = t.type === "sub" ? getTask(t.parentId) : null;
        const days = Math.abs(daysToDue(t.dueDate));
        return `<div class="task-row tr-red" data-open="${t.id}">
          <div class="task-row-main">
            <div class="task-row-title">${esc(t.title)}
              ${parent ? `<span class="pill pill-gray">↰ ${esc(parent.title)}</span>` : ""}
              <span class="pill" style="${catChipStyle(t.category)}">${esc(t.category)}</span>
              <span class="pill pill-gray">${t.repeats === "once" ? "One-time" : "↻ " + repeatsLabel(t)}</span>
            </div>
            <div class="task-row-sub">
              ${t.delayNote ? `📝 Delay note: ${esc(t.delayNote)}` : `<span class="st-red">⚠ No delay note written yet</span>`}
            </div>
          </div>
          <div class="task-row-state st-red">${days} day${days > 1 ? "s" : ""} overdue<br><span>due ${shortDate(t.dueDate)}</span></div>
        </div>`;
      }).join("")}`;
    }).join("")}

    ${history.length ? `
    <p class="sec-title" style="margin-top:22px;color:var(--text-2);">🕘 Reminders sent</p>
    <div class="card" style="padding:12px 16px;">
      ${history.map(h => {
        const m = getMember(h.toEmail);
        const d = new Date(h.createdAt);
        return `<div style="display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--border);font-size:12.5px;">
          <span>💬 To <b>${esc(m ? fullName(m) : h.toEmail)}</b> · ${esc((h.body || "").split("\n")[1] || h.subject || "").slice(0, 60)}…</span>
          <span style="color:var(--text-2);flex-shrink:0;">${d.toLocaleDateString("en-GB", { day: "numeric", month: "short" })} ${d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })}</span>
        </div>`;
      }).join("")}
    </div>` : ""}
  `;

  $("fu-member").addEventListener("change", e => { FU.member = e.target.value; renderFollowUp(c); });
  c.querySelectorAll("[data-open]").forEach(el => el.addEventListener("click", () => openTaskView(+el.dataset.open)));
  c.querySelectorAll("[data-remind]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    confirmOutsideHours("Send the reminder", () => sendWaReminder(b.dataset.remind));
  }));
  if ($("fu-remindall")) $("fu-remindall").addEventListener("click", () => {
    confirmOutsideHours("Send all reminders", () => {
      const emails = Object.keys(byMember);
      let i = 0;
      const next = () => {
        if (i >= emails.length) return;
        sendWaReminder(emails[i]);
        i++;
        if (i < emails.length) setTimeout(next, 1400);
      };
      next();
    });
  });
}

</script>
<script>
/* ============================================================
   mastersheet.js — stage 4: 24-column admin data collector
   with filters, inline editing, save-all, CSV export
   ============================================================ */
"use strict";

let MS = { q: "", status: "all", cat: "all", member: "all", period: "all", year: "all", arch: "all", showSubs: true, dirty: {} };

function mainTitleOf(t) {
  if (t.type === "main") return t.title;
  const p = getTask(t.parentId);
  return p ? p.title : "";
}
function ruleText(t) {
  const r = t.rule || {};
  if (t.repeats === "weekly") return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][r.weekday ?? 0];
  if (t.repeats === "monthly" || t.repeats === "quarterly") return "Day " + (r.dayOfMonth || 1);
  if (t.repeats === "annual") return (r.day || 1) + " " + MONTHS[(r.month || 1) - 1];
  if (t.repeats === "daily") return "Every workday";
  return "—";
}
function realRepeats(t) {
  if (t.repeats === "withmain") {
    const p = getTask(t.parentId);
    return p ? (p.repeats === "once" ? "One-time" : p.repeats[0].toUpperCase() + p.repeats.slice(1)) : "—";
  }
  if (t.repeats === "once") return "One-time";
  return t.repeats[0].toUpperCase() + t.repeats.slice(1);
}
/* completion vs due: + = finished late, - = finished early, 0 = on time */
function varDays(t) {
  if (!t.completedAt) return null;
  return Math.round((parseD(t.completedAt.slice(0, 10)) - parseD(t.dueDate)) / 86400000);
}
function daysCell(t) {
  if (t.status === "done") return { txt: "0", cls: "st-green" };
  const dd = daysToDue(t.dueDate);
  if (dd < 0) return { txt: "+" + Math.abs(dd), cls: "st-red" };
  return { txt: "-" + dd, cls: dd <= 3 ? "st-yellow" : "" };
}

function msRows() {
  const u = currentUser();
  let mains = DB.tasks.filter(t => !t.template && t.type === "main" && canSeeTask(u, t));
  const match = (t) => {
    if (MS.q) {
      const q = MS.q.toLowerCase();
      if (!t.title.toLowerCase().includes(q) && !(t.description || "").toLowerCase().includes(q)) return false;
    }
    if (MS.status !== "all" && t.status !== MS.status) return false;
    if (MS.cat !== "all" && t.category !== MS.cat) return false;
    if (MS.member !== "all" && t.responsible !== MS.member) return false;
    if (MS.period !== "all" && t.periodCode !== MS.period) return false;
    if (MS.year !== "all" && String(t.year) !== MS.year) return false;
    if (MS.arch === "active" && t.archived) return false;
    if (MS.arch === "archived" && !t.archived) return false;
    return true;
  };
  const rows = [];
  mains.sort((a, b) => (b.year - a.year) || (a.dueDate < b.dueDate ? 1 : -1));
  for (const m of mains) {
    const subs = MS.showSubs ? subsOf(m) : [];
    const mMatch = match(m);
    const sMatch = subs.filter(match);
    if (mMatch || sMatch.length) {
      rows.push(m);
      for (const s of (mMatch ? subs : sMatch)) rows.push(s);
    }
  }
  return rows;
}

function renderMasterSheet(c) {
  runAutoGen();
  const u = currentUser();
  if (!isAdmin(u)) {
    c.innerHTML = `<div class="placeholder-page"><div class="big">🔒</div><p>The Master sheet is for the admin only.</p></div>`;
    return;
  }
  const members = DB.members.filter(m => m.registered);
  const periods = [...new Set(DB.tasks.filter(t => !t.template && t.periodCode).map(t => t.periodCode))];
  const years = [...new Set(DB.tasks.filter(t => !t.template && t.year).map(t => String(t.year)))].sort();
  const rows = msRows();
  const dirtyCount = Object.keys(MS.dirty).length;

  c.innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center;">
      <input id="ms-q" placeholder="🔍 Search…" value="${esc(MS.q)}" style="flex:1;min-width:140px;">
      <select id="ms-status" style="width:auto;"><option value="all">Status: All</option>
        <option value="todo" ${MS.status === "todo" ? "selected" : ""}>To do</option>
        <option value="inprogress" ${MS.status === "inprogress" ? "selected" : ""}>In progress</option>
        <option value="done" ${MS.status === "done" ? "selected" : ""}>Done</option></select>
      <select id="ms-cat" style="width:auto;"><option value="all">Category: All</option>
        ${DB.categories.map(x => `<option ${MS.cat === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>
      <select id="ms-member" style="width:auto;"><option value="all">Member: All</option>
        ${members.map(m => `<option value="${esc(m.email)}" ${MS.member === m.email ? "selected" : ""}>${esc(fullName(m))}</option>`).join("")}</select>
      <select id="ms-period" style="width:auto;"><option value="all">Period: All</option>
        ${periods.map(p => `<option ${MS.period === p ? "selected" : ""}>${esc(p)}</option>`).join("")}</select>
      <select id="ms-year" style="width:auto;"><option value="all">Year: All</option>
        ${years.map(y => `<option ${MS.year === y ? "selected" : ""}>${y}</option>`).join("")}</select>
      <select id="ms-arch" style="width:auto;">
        <option value="all" ${MS.arch === "all" ? "selected" : ""}>Active + Archived</option>
        <option value="active" ${MS.arch === "active" ? "selected" : ""}>Active only</option>
        <option value="archived" ${MS.arch === "archived" ? "selected" : ""}>Archived only</option></select>
      <button class="btn btn-sm" id="ms-subs">${MS.showSubs ? "👁 Subtasks: shown" : "🙈 Subtasks: hidden"}</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
      <span style="font-size:12.5px;color:var(--text-2);">${rows.length} rows${dirtyCount ? ` · <b class="st-yellow">${dirtyCount} unsaved edit${dirtyCount > 1 ? "s" : ""}</b>` : ""}</span>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-sm ${dirtyCount ? "btn-primary" : ""}" id="ms-save" ${dirtyCount ? "" : "disabled"}>💾 Save all changes</button>
        <button class="btn btn-sm" id="ms-export">📥 Export CSV</button>
      </div>
    </div>
    <div class="table-wrap card" style="padding:0;">
      <table class="data ms-table">
        <thead><tr>
          <th>ID</th><th>Type</th><th>Kind</th><th>Main task</th><th>Title</th><th>Category</th><th>Priority</th>
          <th>Task type</th><th>Repeats</th><th>Rule</th><th>Year</th><th>Month</th><th>Period</th>
          <th>Due</th><th>Responsible</th><th>By</th><th>Status</th><th>Delay note</th><th>Days</th>
          <th>Completed</th><th>Due vs done</th><th>Result</th><th>Linked</th><th>State</th><th>Created</th><th>Updated</th>
        </tr></thead>
        <tbody>
        ${rows.map(t => {
          const d = daysCell(t);
          const dirty = MS.dirty[t.id] || {};
          const val = (f, orig) => dirty[f] !== undefined ? dirty[f] : orig;
          const dcls = (f) => dirty[f] !== undefined ? "ms-dirty" : "";
          const isSub = t.type === "sub";
          return `<tr>
            <td>${t.id}</td>
            <td>${isSub ? "Sub" : "Main"}</td>
            <td>${kindDef(t.kind).ico} ${esc(kindDef(t.kind).label)}</td>
            <td style="${isSub ? "color:var(--text-2);" : "font-weight:700;"}">${esc(mainTitleOf(t))}</td>
            <td style="${isSub ? "padding-left:20px;" : "font-weight:700;"}">${isSub ? "↳ " : ""}${esc(t.title)}</td>
            <td class="${dcls("category")}">${isSub ? esc(t.category) : `<select data-ed="category" data-id="${t.id}">${DB.categories.map(x => `<option ${val("category", t.category) === x ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>`}</td>
            <td class="${dcls("priority")}"><select data-ed="priority" data-id="${t.id}">
              ${["normal","high","urgent"].map(p => `<option value="${p}" ${val("priority", t.priority) === p ? "selected" : ""}>${p[0].toUpperCase() + p.slice(1)}</option>`).join("")}</select></td>
            <td>${t.taskType === "once" ? "One-time" : "Recurring"}</td>
            <td>${realRepeats(t)}</td>
            <td>${ruleText(t)}</td>
            <td>${t.year || "—"}</td>
            <td>${t.month || "—"}</td>
            <td>${esc(t.periodCode || "—")}</td>
            <td class="${dcls("dueDate")}"><input type="date" data-ed="dueDate" data-id="${t.id}" value="${val("dueDate", t.dueDate)}" style="width:130px;"></td>
            <td class="${dcls("responsible")}"><select data-ed="responsible" data-id="${t.id}">
              ${members.map(m => `<option value="${esc(m.email)}" ${val("responsible", t.responsible) === m.email ? "selected" : ""}>${esc(fullName(m))}</option>`).join("")}</select></td>
            <td>${esc(nameOrMe(t.assignedBy))}</td>
            <td class="${dcls("status")}"><select data-ed="status" data-id="${t.id}">
              ${[["todo","To do"],["inprogress","In progress"],["done","Done"]].map(([v, l]) => `<option value="${v}" ${val("status", t.status) === v ? "selected" : ""}>${l}</option>`).join("")}</select></td>
            <td class="${dcls("delayNote")}"><input data-ed="delayNote" data-id="${t.id}" value="${esc(val("delayNote", t.delayNote || ""))}" placeholder="—" style="width:150px;"></td>
            <td class="${d.cls}" style="font-weight:800;">${d.txt}</td>
            <td>${t.completedAt ? shortDate(t.completedAt.slice(0, 10)) : "—"}</td>
            ${(() => { const v = varDays(t);
              return `<td class="${v === null ? "" : v > 0 ? "st-red" : "st-green"}" style="font-weight:800;">${v === null ? "—" : v > 0 ? "+" + v : v}</td>`; })()}
            <td class="${t.result === "Late" ? "st-red" : t.result ? "st-green" : ""}">${t.result || "—"}</td>
            <td>${esc(linkedTitles(t).join(", ") || "—")}</td>
            <td>${t.archived ? "Archived" : "Active"}</td>
            <td>${shortDate(t.createdAt.slice(0, 10))}</td>
            <td>${shortDate(t.updatedAt.slice(0, 10))}</td>
          </tr>`;
        }).join("")}
        </tbody>
      </table>
      ${!rows.length ? `<p style="padding:20px;color:var(--text-2);font-size:13px;">No rows match the filters.</p>` : ""}
    </div>`;

  $("ms-q").addEventListener("input", e => { MS.q = e.target.value; renderMasterSheet(c); });
  for (const [id, key] of [["ms-status","status"],["ms-cat","cat"],["ms-member","member"],["ms-period","period"],["ms-year","year"],["ms-arch","arch"]])
    $(id).addEventListener("change", e => { MS[key] = e.target.value; renderMasterSheet(c); });
  $("ms-subs").addEventListener("click", () => { MS.showSubs = !MS.showSubs; renderMasterSheet(c); });
  $("ms-export").addEventListener("click", () => exportMasterCSV(rows));
  $("ms-save").addEventListener("click", () => saveMasterEdits(c));

  c.querySelectorAll("[data-ed]").forEach(el => el.addEventListener("change", () => {
    const id = +el.dataset.id, f = el.dataset.ed;
    const t = getTask(id);
    if (!t) return;
    MS.dirty[id] = MS.dirty[id] || {};
    if (String(t[f] ?? "") === el.value) delete MS.dirty[id][f];
    else MS.dirty[id][f] = el.value;
    if (!Object.keys(MS.dirty[id]).length) delete MS.dirty[id];
    el.closest("td").classList.add("ms-dirty");
    // update save button state without full redraw (keeps focus)
    const n = Object.keys(MS.dirty).length;
    $("ms-save").disabled = !n;
    $("ms-save").classList.toggle("btn-primary", !!n);
  }));
}

function saveMasterEdits(c) {
  const errors = [];
  for (const [idStr, edits] of Object.entries(MS.dirty)) {
    const t = getTask(+idStr);
    if (!t) continue;
    // validate due date rule for subs / mains
    if (edits.dueDate) {
      if (t.type === "sub") {
        const p = getTask(t.parentId);
        if (p && edits.dueDate > p.dueDate) { errors.push(`"${t.title}": subtask due after main task — not saved`); delete edits.dueDate; }
      } else {
        for (const s of subsOf(t)) if (s.dueDate > edits.dueDate) { errors.push(`"${t.title}": due before subtask "${s.title}" — not saved`); delete edits.dueDate; break; }
      }
    }
    // status change with overdue rule
    if (edits.status && edits.status !== "done") {
      const note = edits.delayNote !== undefined ? edits.delayNote : t.delayNote;
      const due = edits.dueDate || t.dueDate;
      if (daysToDue(due) < 0 && !String(note || "").trim()) {
        errors.push(`"${t.title}": overdue — delay note required before status change`);
        delete edits.status;
      }
    }
    for (const [f, v] of Object.entries(edits)) {
      if (f === "status") {
        trySetStatus(t, v, edits.delayNote !== undefined ? edits.delayNote : undefined);
        continue;
      }
      t[f] = v;
    }
    if (edits.category) for (const s of subsOf(t)) s.category = edits.category;
    t.updatedAt = new Date().toISOString();
  }
  MS.dirty = {};
  saveDB();
  renderMasterSheet(c);
  if (errors.length) toast(errors[0], "err");
  else toast("All changes saved", "ok");
}

function exportMasterCSV(rows) {
  const esc2 = (s) => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const header = ["ID","Type","Kind","Main task","Title","Description","Category","Priority","Task type","Repeats","Repeat rule","Year","Month","Period","Due date","Responsible","Assigned by","Status","Delay note","Days","Completed date","Due vs done","Result","Linked tasks","State","Created","Updated"];
  const lines = [header.join(",")];
  for (const t of rows) {
    const d = daysCell(t);
    lines.push([
      t.id, t.type === "sub" ? "Sub" : "Main", kindDef(t.kind).label, mainTitleOf(t), t.title, t.description || "",
      t.category, t.priority, t.taskType === "once" ? "One-time" : "Recurring", realRepeats(t), ruleText(t),
      t.year || "", t.month || "", t.periodCode || "", t.dueDate || "",
      memberName(t.responsible), memberName(t.assignedBy),
      t.status === "todo" ? "To do" : t.status === "inprogress" ? "In progress" : "Done",
      t.delayNote || "", d.txt, t.completedAt ? t.completedAt.slice(0, 10) : "",
      (() => { const v = varDays(t); return v === null ? "" : v > 0 ? "+" + v : String(v); })(), t.result || "",
      linkedTitles(t).join("; "), t.archived ? "Archived" : "Active",
      t.createdAt.slice(0, 10), t.updatedAt.slice(0, 10)
    ].map(esc2).join(","));
  }
  const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `master_sheet_${todayStr()}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("CSV exported", "ok");
}

</script>
<script>
/* ============================================================
   team.js — stage 5: member cards, workload, on-time %,
   admin controls, profile editing
   ============================================================ */
"use strict";

function memberStats(email) {
  const inst = DB.tasks.filter(t => !t.template && t.responsible === email);
  const active = inst.filter(t => t.status !== "done");
  const overdue = active.filter(isOverdue);
  const from = new Date(new Date().getFullYear(), 0, 1);
  const done = inst.filter(t => t.status === "done" && t.completedAt && new Date(t.completedAt) >= from);
  const onTime = done.filter(t => t.result !== "Late").length;
  return {
    active: active.length, overdue: overdue.length,
    doneYear: done.length,
    pct: done.length ? Math.round(onTime / done.length * 100) : null
  };
}

function renderTeam(c) {
  const u = currentUser();
  const admin = isAdmin(u);
  const mgr = isManager(u);
  const members = [...DB.members].sort((a, b) => b.level - a.level);

  c.innerHTML = `
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
      ${admin ? `<button class="btn btn-primary btn-sm" id="tm-add">+ Add member</button>` : ""}
    </div>
    <div class="team-grid">
      ${members.map(m => {
        const lvlClass = m.level === 3 ? "badge-admin" : m.level === 2 ? "badge-mgr" : "badge-member";
        if (!m.registered) {
          return `<div class="card team-card team-invited">
            <div style="text-align:center;color:var(--text-2);">
              <div style="font-size:22px;margin-bottom:6px;">✉️</div>
              <b style="font-size:13.5px;">${esc(m.email)}</b>
              <p style="font-size:12px;margin-top:2px;">Invited · not registered yet</p>
              <span class="badge ${lvlClass}" style="margin-top:6px;display:inline-block;">L${m.level} · ${LEVEL_NAMES[m.level]}</span>
              ${admin ? `<div style="margin-top:10px;"><button class="btn btn-ghost btn-sm" data-del="${esc(m.email)}" style="color:var(--red);">✕ Cancel invite</button></div>` : ""}
            </div>
          </div>`;
        }
        const s = mgr ? memberStats(m.email) : null;
        return `<div class="card team-card" ${mgr ? `data-view="${esc(m.email)}" style="cursor:pointer;"` : ""}>
          <div style="display:flex;align-items:center;gap:11px;margin-bottom:10px;">
            <span class="avatar" style="width:40px;height:40px;font-size:14px;">${initials(m)}</span>
            <div style="min-width:0;">
              <b style="font-size:14.5px;">${esc(fullName(m))}${m.email === u.email ? " (me)" : ""}</b>
              <p style="font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(m.jobTitle || "—")}</p>
            </div>
          </div>
          <span class="badge ${lvlClass}">L${m.level} · ${LEVEL_NAMES[m.level]}</span>
          ${s ? `
          <div style="margin-top:10px;font-size:12.5px;color:var(--text-2);">
            <p>Active: <b style="color:var(--text);">${s.active}</b> · Overdue: <b class="${s.overdue ? "st-red" : ""}" style="${s.overdue ? "" : "color:var(--text);"}">${s.overdue}</b></p>
            <p style="margin:3px 0 6px;">On time this year: <b style="color:var(--text);">${s.pct === null ? "—" : s.pct + "%"}</b> · ${s.doneYear} done</p>
            <div class="mini-bar" style="height:6px;margin:0;"><div style="width:${s.pct ?? 0}%;background:${s.pct === null ? "var(--border)" : s.pct >= 90 ? "var(--green)" : s.pct >= 70 ? "var(--yellow)" : "var(--red)"};"></div></div>
          </div>` : ""}
          ${admin && m.email !== u.email ? `
          <div style="display:flex;gap:6px;margin-top:12px;">
            <button class="btn btn-sm" data-level="${esc(m.email)}" style="flex:1;">Level</button>
            <button class="btn btn-sm" data-pass="${esc(m.email)}" style="flex:1;">Reset pass</button>
            <button class="btn btn-ghost btn-sm" data-del="${esc(m.email)}" style="color:var(--red);">✕</button>
          </div>` : ""}
        </div>`;
      }).join("")}
    </div>`;

  if ($("tm-add")) $("tm-add").addEventListener("click", openAddMemberModal);
  c.querySelectorAll("[data-view]").forEach(el => el.addEventListener("click", e => {
    if (e.target.closest("button")) return;
    TF.member = el.dataset.view;
    window.__tasksTab = "act";
    route("tasks");
  }));
  c.querySelectorAll("[data-level]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation(); openLevelModal(b.dataset.level, () => route("team"));
  }));
  c.querySelectorAll("[data-pass]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation(); openResetPassModal(b.dataset.pass);
  }));
  c.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const m = getMember(b.dataset.del);
    const hasTasks = DB.tasks.some(t => !t.template && t.responsible === m.email && t.status !== "done");
    openConfirm(`Remove ${m.registered ? fullName(m) : m.email}?${hasTasks ? " They still have active tasks — reassign them afterwards." : ""} Task history is kept.`, () => {
      DB.members = DB.members.filter(x => x.email !== m.email);
      saveDB(); route("team"); toast("Member removed", "ok");
    });

}
